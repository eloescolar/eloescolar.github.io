                <b>${a.achados.length ? "Aplicar protocolo correspondente à categoria sugerida e validar medidas" : "Coleta complementar e avaliação inicial"}</b>
                <div class="mini-steps">
                  ${(!a.achados.length
                    ? ["Acolher e preservar o relato", "Obter informações complementares", "Verificar possível recorrência", "Reavaliar classificação e prioridade"]
                    : ["Confirmar o contexto e os envolvidos", "Selecionar medidas previstas no protocolo institucional", "Definir responsável e prazo", "Monitorar evolução e registrar evidências"]
                  ).map((s, i) => html`<div class="mini-step" key=${i}><span class="step-n">${i + 1}</span><span>${s}</span></div>`)}
                </div>
                <p class="dica">No protótipo, esta é uma <b>linha de ação recomendada</b> com base
                  nas regras disponíveis. Na implantação, o catálogo de protocolos deve ser
                  institucional, versionado e vinculado às bases normativas aprovadas.</p>
              </div>
            `}
          </div>
          <div>
            ${insightsIA === "idle" ? html`
              <div class="recomendacao-principal recomendacao-ia-idle">
                <h4><${Icon} name="clipboard-check" size=${15} /> Insights para ações complementares</h4>
                <p class="card-sub" style=${{ margin: "0 0 12px" }}>Ações extras que podem ser
                  aplicadas ao caso (pedagógicas, psicológicas, disciplinares) — não é o protocolo
                  em si, são complementos que o Gestor avalia se cabem.</p>
                <div class="acoes" style=${{ marginTop: 0 }}>
                  <button class="btn btn-ia-insights" onClick=${gerarInsightsIA}>
                    <${Icon} name="sparkles" size=${16} />Gerar insights com IA</button>
                </div>
              </div>
            ` : insightsIA === "gerando" ? html`
              <div class="recomendacao-principal ia-processando">
                <h4><${Icon} name="clipboard-check" size=${15} /> Insights para ações complementares</h4>
                <div class="ia-processando-corpo">
                  <span class="ia-processando-icone ia-processando-icone-insights"><${Icon} name="sparkles" size=${20} /></span>
                  <div class="ia-processando-info">
                    <div class="ia-processando-texto">${FASES_INSIGHTS[faseInsights]}</div>
                    <div class="ia-processando-barra"><div class="ia-processando-fill ia-processando-fill-insights"></div></div>
                  </div>
                </div>
              </div>
            ` : html`<${InsightsTratamento} a=${a} />`}
          </div>
        </div>
      </div>
      ${!validado ? html`
        <div class="field"><label>Categoria</label>
          <input type="text" value=${cat} onChange=${e => setCat(e.target.value)} /></div>
        <div class="field"><label>Prioridade</label>
          <select value=${prio} onChange=${e => setPrio(e.target.value)}>
            <option>Alta</option><option>Média</option><option>Baixa</option>
          </select></div>
        <div class="field"><label>Responsável designado</label>
          <select value=${resp} onChange=${e => setResp(e.target.value)}>
            <option>Coordenação pedagógica</option><option>Orientação educacional</option>
            <option>Direção</option><option>Psicologia escolar</option>
          </select></div>
        <div class="field"><label>Justificativa (opcional — recomendado se você ajustar a sugestão da IA)</label>
          <textarea style=${{ minHeight: "70px" }} placeholder="Ex.: motivo da correção de categoria/prioridade, ou observações que embasam a validação..."
            value=${justValidacao} onChange=${e => setJustValidacao(e.target.value)}></textarea></div>
        <div class="acoes">
          <button class="btn btn-primary" onClick=${() => decidir(false)}><${Icon} name="check-circle" size=${16} />Confirmar como sugerido</button>
          <button class="btn btn-secondary" onClick=${corrigir}><${Icon} name="edit" size=${16} />Registrar correção</button>
        </div>
      ` : html`
        <table class="tbl">
          <tr><th>Categoria validada</th><td>${esc(sel.validacao.categoria)}</td></tr>
          <tr><th>Prioridade validada</th><td><${Badge} tone=${toneFor(sel.validacao.prioridade)}>${sel.validacao.prioridade}</${Badge}></td></tr>
          <tr><th>Responsável</th><td>${sel.validacao.responsavel}</td></tr>
          <tr><th>Triagem</th><td>${sel.validacao.alterado ? "Sugestão corrigida" : "Sugestão confirmada"}</td></tr>
          ${sel.validacao.justificativa && html`<tr><th>Justificativa</th><td>${esc(sel.validacao.justificativa)}</td></tr>`}
        </table>
      `}
    </${StepCard}>
    <${BotaoAvancarPasso} passoAtual=${3} statusPasso=${statusPasso} onAvancar=${setAbaAtiva} />
    `}

    ${abaAtiva === 4 && html`
    <${StepCard} n=${4} title="Qual a decisão do Gestor do Caso?" status=${statusPasso[4]}>
      ${!validado
        ? html`<p class="dica">Depende da validação da classificação (passo 3).</p>`
        : sel.encaminhamento
          ? html`<p class="dica">Decisão registrada em ${quando(sel.encaminhamento.em)}: <b>${ENCAMINHAMENTO_LABEL[sel.encaminhamento.decisao]}</b>.</p>`
          : html`<p class="card-sub">Escolha o encaminhamento deste caso.</p>
              <div class="acoes">
                <button class="btn btn-secondary" onClick=${() => encaminhar("tratar")}>Tratar diretamente</button>
                <button class="btn btn-secondary" onClick=${() => encaminhar("equipe")}>Atribuir à Equipe de Apoio</button>
                <button class="btn btn-secondary" onClick=${() => encaminhar("escalonar")}>Escalonar para Gestão Escolar</button>
                <button class="btn btn-secondary" onClick=${() => encaminhar("encerrar")}>Encerrar com justificativa</button>
              </div>`}
      ${sel.encaminhamento && sel.encaminhamento.decisao === "equipe" && !sel.equipeConcluidaEm && html`
        <${Alert} tone="info">Aguardando a Equipe de Apoio concluir o acompanhamento deste caso.</${Alert}>`}
      ${sel.encaminhamento && sel.encaminhamento.decisao === "escalonar" && !sel.decisaoInstitucional && html`
        <${Alert} tone="info">Aguardando a decisão institucional da Gestão Escolar.</${Alert}>`}
    </${StepCard}>
    <${BotaoAvancarPasso} passoAtual=${4} statusPasso=${statusPasso} onAvancar=${setAbaAtiva} />
    `}

    ${abaAtiva === 5 && html`
    <${StepCard} n=${5} title="Comunicação com responsáveis" status=${statusPasso[5]}>
      ${!sel.encaminhamento
        ? html`<p class="dica">Depende da decisão de encaminhamento (passo 4).</p>`
        : sel.comunicacaoResponsaveis
          ? html`<table class="tbl">
              <tr><th>Responsáveis informados</th><td>${{ presencial: "Sim, presencialmente", telefone: "Sim, por telefone", nao: "Não" }[sel.comunicacaoResponsaveis.informados]}</td></tr>
              ${sel.comunicacaoResponsaveis.motivoNaoInformados && html`<tr><th>Motivo</th><td>${esc(sel.comunicacaoResponsaveis.motivoNaoInformados)}</td></tr>`}
              <tr><th>Concordaram com os encaminhamentos</th><td>${sel.comunicacaoResponsaveis.concordaramEncaminhamentos ? "Sim" : "Não"}</td></tr>
              ${sel.comunicacaoResponsaveis.motivoDiscordancia && html`<tr><th>Motivo da discordância</th><td>${esc(sel.comunicacaoResponsaveis.motivoDiscordancia)}</td></tr>`}
              <tr><th>Orientados a registrar Boletim de Ocorrência</th><td>${sel.comunicacaoResponsaveis.orientadosBO ? "Sim" : "Não"}</td></tr>
              ${sel.comunicacaoResponsaveis.motivoBO && html`<tr><th>Motivo</th><td>${esc(sel.comunicacaoResponsaveis.motivoBO)}</td></tr>`}
              <tr><th>Registrado em</th><td>${quando(sel.comunicacaoResponsaveis.em)}</td></tr>
            </table>`
          : html`
              <p class="card-sub">Documentação institucional — registre como a família foi
                comunicada sobre o caso. Isso é pré-requisito pra liberar o encerramento.</p>
              <div class="field"><label>Responsáveis informados?</label>
                <div class="acoes" style=${{ marginTop: "4px" }}>
                  <label style=${{ display: "flex", alignItems: "center", gap: "6px", fontWeight: 400 }}>
                    <input type="radio" name="informados-resp" checked=${informadosResp === "presencial"} onChange=${() => setInformadosResp("presencial")} />
                    Sim, presencialmente</label>
                  <label style=${{ display: "flex", alignItems: "center", gap: "6px", fontWeight: 400 }}>
                    <input type="radio" name="informados-resp" checked=${informadosResp === "telefone"} onChange=${() => setInformadosResp("telefone")} />
                    Sim, por telefone</label>
                  <label style=${{ display: "flex", alignItems: "center", gap: "6px", fontWeight: 400 }}>
                    <input type="radio" name="informados-resp" checked=${informadosResp === "nao"} onChange=${() => setInformadosResp("nao")} />
                    Não</label>
                </div>
                ${informadosResp === "nao" && html`<input type="text" style=${{ marginTop: "8px" }} placeholder="Motivo"
                  value=${motivoNaoInformados} onChange=${e => setMotivoNaoInformados(e.target.value)} />`}
              </div>
              <div class="field"><label>Concordaram com os encaminhamentos?</label>
                <div class="acoes" style=${{ marginTop: "4px" }}>
                  <label style=${{ display: "flex", alignItems: "center", gap: "6px", fontWeight: 400 }}>
                    <input type="radio" name="concordaram-enc" checked=${concordaramEnc === true} onChange=${() => setConcordaramEnc(true)} /> Sim</label>
                  <label style=${{ display: "flex", alignItems: "center", gap: "6px", fontWeight: 400 }}>
                    <input type="radio" name="concordaram-enc" checked=${concordaramEnc === false} onChange=${() => setConcordaramEnc(false)} /> Não</label>
                </div>
                ${!concordaramEnc && html`<input type="text" style=${{ marginTop: "8px" }} placeholder="Motivo"
                  value=${motivoDiscordancia} onChange=${e => setMotivoDiscordancia(e.target.value)} />`}
              </div>
              <div class="field"><label>Foram orientados a registrar Boletim de Ocorrência?</label>
                <div class="acoes" style=${{ marginTop: "4px" }}>
                  <label style=${{ display: "flex", alignItems: "center", gap: "6px", fontWeight: 400 }}>
                    <input type="radio" name="orientados-bo" checked=${orientadosBO === true} onChange=${() => setOrientadosBO(true)} /> Sim</label>
                  <label style=${{ display: "flex", alignItems: "center", gap: "6px", fontWeight: 400 }}>
                    <input type="radio" name="orientados-bo" checked=${orientadosBO === false} onChange=${() => setOrientadosBO(false)} /> Não</label>
                </div>
                ${!orientadosBO && html`<input type="text" style=${{ marginTop: "8px" }} placeholder="Motivo"
                  value=${motivoBO} onChange=${e => setMotivoBO(e.target.value)} />`}
              </div>
              <div class="acoes"><button class="btn btn-primary" onClick=${salvarComunicacaoResponsaveis}>
                <${Icon} name="check-circle" size=${16} />Salvar comunicação com responsáveis</button></div>
            `}
    </${StepCard}>
    <${BotaoAvancarPasso} passoAtual=${5} statusPasso=${statusPasso} onAvancar=${setAbaAtiva} />
    `}

    ${abaAtiva === 6 && html`
    <${StepCard} n=${6} title="Condução direta pelo Gestor do Caso" status=${statusPasso[6]}>
      ${!sel.encaminhamento
        ? html`<p class="dica">Depende da decisão de encaminhamento (passo 4).</p>`
        : sel.encaminhamento.decisao !== "tratar"
          ? html`<p class="dica">Não se aplica: a decisão registrada para este caso foi
              "${ENCAMINHAMENTO_LABEL[sel.encaminhamento.decisao]}", não "Tratar diretamente".</p>`
          : html`<${Alert} tone="info"><b>Tratar diretamente não encerra o caso.</b> O caso continua aberto
              nesta tela para que você defina o próximo status. Depois de salvar, ele será listado
              automaticamente no menu correspondente: Em análise, Aguardando complementação,
              Acompanhamentos ou Aguardando encerramento.</${Alert}>
              <div class="field"><label>Status do caso</label>
                <select value=${statusDireto} onChange=${e => setStatusDireto(e.target.value)}>
                  <option value="em_analise">Em análise</option>
                  <option value="aguardando_complementacao">Aguardando informações complementares</option>
                  <option value="em_acompanhamento">Em acompanhamento</option>
                  <option value="pronto_encerrar">Pronto para encerramento</option>
                </select>
                <p class="dica">Ao salvar, o caso passa a aparecer automaticamente no menu correspondente ao status.</p>
              </div>
              ${statusDireto === "em_acompanhamento" && html`
                <div class="grid-2">
                  <div class="field"><label>Período de acompanhamento</label>
                    <select value=${periodoDireto} onChange=${e => setPeriodoDireto(e.target.value)}>
                      <option value="7">7 dias</option><option value="15">15 dias</option>
                      <option value="30">30 dias</option><option value="60">60 dias</option><option value="90">90 dias</option>
                    </select></div>
                  <div class="field"><label>Próxima revisão (opcional)</label>
                    <input type="date" value=${proximaRevisaoDireto} onChange=${e => setProximaRevisaoDireto(e.target.value)} /></div>
                </div>`}
              <div class="field"><label>Observação / próxima ação</label>
                <textarea style=${{ minHeight: "76px" }} value=${obsDireto}
                  onChange=${e => setObsDireto(e.target.value)}
                  placeholder="Ex.: realizar nova escuta, aguardar retorno da família, acompanhar a turma..."></textarea></div>
              <div class="acoes"><button class="btn btn-primary" onClick=${salvarTratamentoDireto}>
                <${Icon} name="check-circle" size=${16} />Salvar status do caso</button></div>
              ${sel.tratamentoDireto && sel.tratamentoDireto.status === "em_acompanhamento" && html`
                <div class="field" style=${{ marginTop: "16px" }}><label>Registrar evolução do acompanhamento</label>
                  <textarea style=${{ minHeight: "72px" }} value=${registroDireto}
                    onChange=${e => setRegistroDireto(e.target.value)}
                    placeholder="Ex.: nova escuta realizada, sem nova ocorrência relatada..."></textarea></div>
                <div class="acoes"><button class="btn btn-secondary" onClick=${registrarAcompanhamentoDireto}>
                  Registrar acompanhamento</button></div>
                ${(sel.acompanhamentosGestor || []).length > 0 && html`<ul class="timeline" style=${{ marginTop: "14px" }}>
                  ${(sel.acompanhamentosGestor || []).map((r,i) => html`<li key=${i}>
                    <div class="quando">${quando(r.em)}</div><b>Acompanhamento registrado</b><div>${esc(r.texto)}</div>
                  </li>`)}
                </ul>`}
              `}
          `}
    </${StepCard}>
    <${BotaoAvancarPasso} passoAtual=${6} statusPasso=${statusPasso} onAvancar=${setAbaAtiva} />
    `}

    ${abaAtiva === 7 && html`
    <${StepCard} n=${7} title="Acionar Rede de Proteção / Órgãos Competentes" status=${statusPasso[7]}>
      <!-- Disponível desde a abertura do caso, nunca bloqueado pela Validação (passo 3) nem
           pela prioridade sugerida pela IA -- artigo MGBE-IA, §4.3/6.2/9.6: a avaliação de risco
           imediato e o acionamento da Rede de Proteção não podem esperar a análise automatizada,
           e a proteção não depende de confirmação computacional de bullying. -->
      ${sel.urgencia
        ? html`<p class="dica">Rede de Proteção acionada em ${quando(sel.urgencia.em)}.</p>`
        : html`<${Alert} tone=${critico ? "danger" : "warn"}>
            ${critico
              ? html`<b>Caso crítico.</b> Acione a Rede de Proteção / Órgãos Competentes e as medidas de proteção imediatamente. Isso é independente da decisão de encaminhamento acima.`
              : html`Avalie o risco imediato pelo relato — não é preciso esperar a validação da classificação (passo 3) nem uma prioridade "Alta" sugerida pela IA. Havendo qualquer indício de risco, acione agora.`}
          </${Alert}>
          <div class="acoes"><button class="btn btn-danger" onClick=${() => dispatch({ type: "ACIONAR_URGENCIA", casoId: sel.id })}>
            <${Icon} name="alert-triangle" size=${16} />Acionar Rede de Proteção</button></div>`}
      ${sel.urgencia && !parecerConcluido(sel) && html`
        <${Alert} tone="warn">Aguardando o parecer da Rede de Proteção / Órgãos Competentes.</${Alert}>`}
    </${StepCard}>

    <!-- Dever de comunicação ao Conselho Tutelar (Lei 13.431/2017 art. 13; Decreto 9.603/2018
         art. 11) -- registro à parte, incondicional, DIFERENTE do "Acionar Rede de Proteção"
         acima: não depende de o caso ter sido classificado crítico nem de parecer externo. Sem
         número de passo próprio (não é uma 10ª etapa) -- fica dentro da mesma aba por ser o
         mesmo assunto (comunicação a órgão de proteção) sob um ângulo diferente (dever legal). -->
    <div class="card">
      <h3>Registrar comunicação ao Conselho Tutelar
        <span style=${{ marginLeft: "auto" }}><${Badge} tone=${sel.comunicacaoLegal ? "baixa" : "media"}>${sel.comunicacaoLegal ? "Registrado" : "Pendente"}</${Badge}></span></h3>
      ${sel.comunicacaoLegal
        ? html`<p class="dica">Comunicação registrada em ${quando(sel.comunicacaoLegal.em)}.${sel.comunicacaoLegal.observacao ? " " + esc(sel.comunicacaoLegal.observacao) : ""}</p>`
        : html`<p class="card-sub">Diante de identificação ou revelação de violência, a Lei nº 13.431/2017 (art. 13)
            prevê dever de comunicação imediata ao Conselho Tutelar — independente da prioridade calculada
            ou de a Rede de Proteção já ter sido acionada acima.</p>
          <div class="field"><label>Observação (opcional)</label>
            <textarea style=${{ minHeight: "60px" }} placeholder="Ex.: comunicado por telefone, protocolo nº..."
              value=${observacaoLegal} onChange=${e => setObservacaoLegal(e.target.value)}></textarea></div>
          <div class="acoes"><button class="btn btn-secondary" onClick=${registrarComunicacaoLegal}>
            <${Icon} name="check-circle" size=${16} />Registrar comunicação ao Conselho Tutelar</button></div>`}
    </div>
    <${BotaoAvancarPasso} passoAtual=${7} statusPasso=${statusPasso} onAvancar=${setAbaAtiva} />
    `}

    ${abaAtiva === 8 && html`
    <${StepCard} n=${8} title="Encerrar caso e registrar justificativa final" status=${statusPasso[8]}>
      ${!sel.encaminhamento
        ? html`<p class="dica">Depende da decisão de encaminhamento (passo 4).</p>`
        : sel.desfecho
          ? html`<p class="dica">Desfecho registrado em ${quando(sel.desfecho.em)}: "${esc(sel.desfecho.justificativa) || "(sem justificativa detalhada)"}"</p>`
          : !pronto
            ? html`<p class="dica">${!sel.comunicacaoResponsaveis
                ? "Depende do registro da comunicação com responsáveis (passo 5)."
                : sel.encaminhamento.decisao === "tratar"
                  ? "O caso permanece " + statusOperacional(sel) + ". Para encerrar, altere a condução direta para “Pronto para encerramento” após concluir a análise/acompanhamento."
                  : "Depende da conclusão da raia escolhida no encaminhamento (e do parecer da Rede de Proteção, se aplicável)."}</p>`
            : html`<div class="field"><label>Justificativa do encerramento</label>
                <textarea style=${{ minHeight: "70px" }} placeholder="Ex.: providências executadas, situação acompanhada sem reincidência..."
                  value=${just} onChange=${e => setJust(e.target.value)} disabled=${encerrando}></textarea></div>
                <div class="acoes"><button class="btn btn-primary" disabled=${encerrando} onClick=${() => { setEncerrando(true); showConfirm({
                  titulo: "Encerrar caso",
                  mensagem: "Esta ação é definitiva: depois de registrado, o encerramento não pode ser desfeito nem editado. Revise a justificativa com cuidado antes de confirmar.",
                  textoConfirmar: "Confirmar encerramento",
                  onConfirmar: encerrar,
                  onCancelar: () => setEncerrando(false)
                }); }}>${encerrando ? "Encerrando…" : "Registrar encerramento"}</button></div>`}
    </${StepCard}>
    <${BotaoAvancarPasso} passoAtual=${8} statusPasso=${statusPasso} onAvancar=${setAbaAtiva} />
    `}

    ${abaAtiva === 9 && html`
    <${StepCard} n=${9} title="Arquivar caso e manter histórico" status=${statusPasso[9]}>
      ${sel.arquivadoEm
        ? html`<${Alert} tone="ok">Caso arquivado com sucesso em ${quando(sel.arquivadoEm)}. Ele
            agora é só consulta (histórico/Escudo Probatório) — não é mais possível editar
            nenhuma etapa dele. Entra nos indicadores agregados da Gestão da Rede de Ensino, que
            não acessa casos individuais.</${Alert}>`
        : !sel.desfecho
          ? html`<p class="dica">Depende do encerramento do caso (passo 8).</p>`
          : html`<div class="acoes"><button class="btn btn-primary" disabled=${arquivando} onClick=${() => { setArquivando(true); showConfirm({
                titulo: "Arquivar caso",
                mensagem: "Esta ação é definitiva: depois de arquivado, o caso sai da lista de casos ativos e vira só consulta (histórico/Escudo Probatório) — não é mais possível editar nenhuma etapa dele.",
                textoConfirmar: "Confirmar arquivamento",
                onConfirmar: () => {
                  dispatch({ type: "ARQUIVAR", casoId: sel.id });
                  showAviso("Caso " + sel.protocolo + " arquivado com sucesso. Ele passa a contar como histórico auditável (Escudo Probatório) e entra nos indicadores agregados da Gestão da Rede de Ensino — que não acessa casos individuais.");
                },
                onCancelar: () => setArquivando(false)
              }); }}><${Icon} name="lock" size=${16} />${arquivando ? "Arquivando…" : "Arquivar caso"}</button></div>`}
    </${StepCard}>
    `}
    `)}

    ${secao === "encerrados" && (() => {
      const verEncerrado = arquivados.find(c => c.protocolo === verEncerradoProtocolo) || null;
      return html`
      <div class="actor-head"><h1>Casos encerrados</h1>
        <p class="lede">Histórico disponível para rastreabilidade e auditoria — só consulta, não
          é mais possível editar nenhuma etapa.</p></div>
      ${arquivados.length === 0
        ? html`<${Alert} tone="info">Nenhum caso encerrado no momento.</${Alert}>`
        : html`<div class="card" style=${{ padding: 0, overflowX: "auto" }}>
            <table class="tbl">
              <thead><tr><th>Protocolo</th><th>Relato</th><th>Status</th><th>Registrado em</th><th></th></tr></thead>
              <tbody>
                ${[...arquivados].sort((a, b) => new Date(b.enviadoEm) - new Date(a.enviadoEm)).map(c => html`<tr key=${c.protocolo}>
                  <td><div style=${{ display: "flex", alignItems: "center", gap: "6px", flexWrap: "wrap" }}>
                    <b>${c.protocolo || "Aguardando protocolo"}</b>
                    ${c.identificacao === "anonimo" && html`<${Badge} tone="neutro">Anônimo</${Badge}>`}
                  </div></td>
                  <td style=${{ maxWidth: "360px", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>${c.relato ? esc(c.relato) : "—"}</td>
                  <td><${Badge} tone="baixa">Encerrado</${Badge}></td>
                  <td>${quando(c.enviadoEm)}</td>
                  <td><button class="btn-icon" title="Ver detalhes" onClick=${() => setVerEncerradoProtocolo(c.protocolo)}><${Icon} name="eye" size=${17} /></button></td>
                </tr>`)}
              </tbody>
            </table>
          </div>`}
      ${verEncerrado && html`<${Modal} title=${"Caso " + (verEncerrado.protocolo || "(sem protocolo)")} onClose=${() => setVerEncerradoProtocolo(null)}>
        <div class="card">
          <p style=${{ whiteSpace: "pre-wrap" }}>${verEncerrado.relato ? esc(verEncerrado.relato) : "Relato não disponível neste registro."}</p>
          <table class="tbl">
            <tr><th>Registrado em</th><td>${quando(verEncerrado.enviadoEm)}</td></tr>
            <tr><th>Identificação</th><td>${verEncerrado.identificacao === "anonimo" ? "Anônimo" : "Identificado"}</td></tr>
            ${verEncerrado.validacao && html`<tr><th>Categoria validada</th><td>${esc(verEncerrado.validacao.categoria)}</td></tr>`}
            ${verEncerrado.validacao && html`<tr><th>Prioridade</th><td><${Badge} tone=${toneFor(verEncerrado.validacao.prioridade)}>${verEncerrado.validacao.prioridade}</${Badge}></td></tr>`}
            ${verEncerrado.encaminhamento && html`<tr><th>Encaminhamento</th><td>${ENCAMINHAMENTO_LABEL[verEncerrado.encaminhamento.decisao]}</td></tr>`}
            ${verEncerrado.desfecho && html`<tr><th>Desfecho</th><td>${esc(verEncerrado.desfecho.justificativa) || "(sem justificativa detalhada)"}</td></tr>`}
            ${verEncerrado.desfecho && html`<tr><th>Encerrado em</th><td>${quando(verEncerrado.desfecho.em)}</td></tr>`}
            ${verEncerrado.arquivadoEm && html`<tr><th>Arquivado em</th><td>${quando(verEncerrado.arquivadoEm)}</td></tr>`}
            ${(verEncerrado.reaberturas || []).map((r, i) => html`<tr key=${i}><th>Reaberto em</th><td>${quando(r.em)} — ${esc(r.justificativa)}</td></tr>`)}
          </table>
          <!-- Reabertura diante de novos fatos (artigo MGBE-IA §6.3/Quadro 3) -- só pra casos
               reais (têm campo id); os 4 casos de demonstração (SEED_ARQUIVADOS) não existem na
               tabela de verdade, não haveria o que reabrir neles. -->
          ${verEncerrado.id && html`
            <div class="field" style=${{ marginTop: "14px" }}><label>Reabrir diante de novos fatos</label>
              <textarea style=${{ minHeight: "60px" }} placeholder="Descreva os novos fatos que justificam reabrir este caso..."
                value=${justificativaReabertura} onChange=${e => setJustificativaReabertura(e.target.value)}></textarea></div>
            <div class="acoes"><button class="btn btn-secondary" onClick=${() => showConfirm({
              titulo: "Reabrir caso",
              mensagem: "O caso volta a ficar ativo na fila do Gestor do Caso, com todo o histórico anterior preservado. Precisará passar por um novo encerramento quando a situação for resolvida.",
              textoConfirmar: "Confirmar reabertura",
              onConfirmar: () => { reabrirCaso(verEncerrado.id); setVerEncerradoProtocolo(null); }
            })}>
              <${Icon} name="refresh" size=${16} />Reabrir caso</button></div>`}
        </div>
      </${Modal}>`}
    `;
    })()}
    ${secao === "alertas" && html`
      <${DestaqueIAPerfil}
        titulo="Alertas e possível recorrência"
        subtitulo="A IA procura sinais que merecem verificação humana nos casos sob sua gestão."
        itens=${[
          { rotulo: "Com repetição no relato", valor: pendentes.filter(c => analisar(c.relato).recorrencia.length > 0).length + " caso(s)", dica: "Indício textual, não confirmação." },
          { rotulo: "Componente digital", valor: pendentes.filter(c => analisar(c.relato).achados.some(x => x.id === "digital")).length + " caso(s)", dica: "Pode exigir preservação de evidências." },
          { rotulo: "Críticos", valor: pendentes.filter(c => isCritico(c)).length + " caso(s)", dica: "Revisar necessidade de proteção imediata." }
        ]}
        recomendacao="Use os alertas para escolher quais casos revisar primeiro e confirme manualmente qualquer correlação antes de decidir."
        aviso="Correlação e recorrência são sinais de apoio à decisão, não prova de autoria, culpa ou enquadramento."
      />
    `}
  </${ProfileShell}>`;
}

/* ============================================================== perfil 3 (raia) — Rede de Proteção / Órgãos Competentes
   Fluxograma v2: "Receber encaminhamento conforme natureza do caso" → "Realizar atendimento e
   retorno das ações". Acionada direto pelo Gestor do Caso quando o caso é Crítico/Urgente (ver
   plano Atualização 9). O parecer abaixo é uma extensão além do fluxograma original (confirmado
   nas Atualizações anteriores): para todo caso Crítico/Urgente, o encerramento passa a depender
   dele. */
const INSTANCIAS_OPCOES = ["Conselho Tutelar", "Rede de Saúde", "Segurança Pública / Polícia Civil", "Ministério Público"];
const PARECER_DECISOES = ["Favorável ao encerramento", "Requer acompanhamento adicional"];

const SECOES_PROTECAO = [
  { grupo: "Atendimento" },
  { id: "status", label: "Casos encaminhados", icon: "building" },
  { id: "retornos", label: "Retornos e acompanhamentos", icon: "activity" },
  { grupo: "Apoio informacional" },
  { id: "ia-contexto", label: "Resumo assistido pela IA", icon: "cpu" }
];

function TelaProtecao({ casos, dispatch, navigate, colapsada, onColapsar }) {
  const [secao, setSecao] = useState("status");
  function filtroProtecao(c) {
    if (!isCritico(c) || !c.urgencia || c.arquivadoEm) return false;
    if (secao === "retornos") return !!c.parecer && !parecerConcluido(c);
    if (secao === "status") return !c.parecer;
    return !parecerConcluido(c);
  }
  const [pendentes, sel, selecionar] = useFilaCaso(casos, filtroProtecao);
  const aguardandoUrgencia = casos.filter(c => isCritico(c) && !c.urgencia).length;
  const [instancia, setInstancia] = useState(INSTANCIAS_OPCOES[0]);
  const [decisao, setDecisao] = useState(PARECER_DECISOES[0]);
  const [justificativa, setJustificativa] = useState("");
  const [novoRegistro, setNovoRegistro] = useState("");
  const [ultimoSelId, setUltimoSelId] = useState(null);
  if (sel && sel.id !== ultimoSelId) {
    setUltimoSelId(sel.id);
    setInstancia(INSTANCIAS_OPCOES[0]);
    setDecisao(PARECER_DECISOES[0]);
    setJustificativa("");
    setNovoRegistro("");
  }

  function emitir() {
    if (!justificativa.trim()) { showAviso("Escreva a justificativa do parecer."); return; }
    dispatch({ type: "EMITIR_PARECER", casoId: sel.id, instancia, decisao, justificativa: justificativa.trim() });
  }
  function adicionarRegistro() {
    const txt = novoRegistro.trim();
    if (!txt) { showAviso("Escreva o registro antes de adicionar."); return; }
    dispatch({ type: "PARECER_ADD_REGISTRO", casoId: sel.id, texto: txt });
    setNovoRegistro("");
  }
  function encerrarPapel() {
    dispatch({ type: "PARECER_ENCERRAR", casoId: sel.id });
  }

  return html`<${ProfileShell} profile="protecao" navigate=${navigate} casos=${casos}
    secoes=${SECOES_PROTECAO} ativa=${secao} onTrocar=${s => { selecionar(null); setSecao(s); }} colapsada=${colapsada} onColapsar=${onColapsar}>

    ${(secao === "status" || secao === "retornos") && html`
      ${aguardandoUrgencia > 0 && html`<${Alert} tone="info">${aguardandoUrgencia} caso(s)
        crítico(s) aguardando o Gestor do Caso acionar a Rede de Proteção — ainda não chegam até
        aqui.</${Alert}>`}
      ${!sel
        ? html`${pendentes.length
            ? html`<${FilaTabela} casos=${pendentes} selecionadoId=${null} onSelecionar=${selecionar} />`
            : html`<${Alert} tone="ok">Nenhum caso neste status no momento.</${Alert}>`}`
        : html`
          <div class="acoes" style=${{ marginTop: 0, marginBottom: "12px" }}>
            <button class="btn btn-ghost" onClick=${() => selecionar(null)}>← Voltar para a fila</button>
          </div>

          <details class="rodape-papel" style=${{ margin: "0 0 16px" }}>
            <summary><${Icon} name="info" size=${14} /> Histórico completo do caso — todas as raias envolvidas</summary>
            <div class="rodape-papel-corpo"><${LinhaDoTempo} kase=${sel} /></div>
          </details>

          <${Alert} tone="danger"><b>Caso acionado.</b> Rede de Proteção acionada em
            ${quando(sel.urgencia.em)} para o caso ${sel.protocolo}. Conforme a natureza do
            caso, envolver Conselho Tutelar, Rede de Saúde, Segurança Pública e/ou Ministério
            Público.</${Alert}>

          <${StepCard} n=${1} title="Receber encaminhamento conforme natureza do caso" status=${sel.parecer ? "concluido" : "atual"}>
            ${!sel.parecer
              ? html`
                <p class="card-sub">Registre o parecer da instância acionada — o encerramento do
                  caso só é liberado depois que o parecer existir (e, se exigir acompanhamento
                  adicional, depois que o papel desta instância for encerrado).</p>
                <div class="field"><label>Instância</label>
                  <select value=${instancia} onChange=${e => setInstancia(e.target.value)}>
                    ${INSTANCIAS_OPCOES.map(o => html`<option key=${o}>${o}</option>`)}
                  </select></div>
                <div class="field"><label>Decisão</label>
                  <select value=${decisao} onChange=${e => setDecisao(e.target.value)}>
                    ${PARECER_DECISOES.map(o => html`<option key=${o}>${o}</option>`)}
                  </select></div>
                <div class="field"><label>Justificativa</label>
                  <textarea style=${{ minHeight: "80px" }} placeholder="Ex.: medidas de proteção acompanhadas; família orientada; situação sob monitoramento do Conselho Tutelar..."
                    value=${justificativa} onChange=${e => setJustificativa(e.target.value)}></textarea></div>
                <div class="acoes"><button class="btn btn-primary" onClick=${emitir}>Registrar parecer</button></div>`
              : html`
                <table class="tbl">
                  <tr><th>Instância</th><td>${sel.parecer.instancia}</td></tr>
                  <tr><th>Decisão</th><td><${Badge} tone=${sel.parecer.decisao === "Favorável ao encerramento" ? "baixa" : "media"}>${sel.parecer.decisao}</${Badge}></td></tr>
                  <tr><th>Emitido em</th><td>${quando(sel.parecer.em)}</td></tr>
                  ${sel.parecer.encerradoEm && html`<tr><th>Papel encerrado em</th><td>${quando(sel.parecer.encerradoEm)}</td></tr>`}
                </table>
                <p class="card-sub">Justificativa</p>
                <p>${esc(sel.parecer.justificativa)}</p>

                ${sel.parecer.decisao === "Requer acompanhamento adicional" && html`
                  <p class="card-sub" style=${{ marginTop: "14px" }}>Acompanhamento da instância</p>
                  ${(sel.parecer.registros || []).length > 0
                    ? html`<ul class="timeline">
                        ${sel.parecer.registros.map((r, i) => html`<li key=${i}>
                          <div class="quando">${quando(r.em)}</div><b>Registro de acompanhamento</b><div>${esc(r.texto)}</div>
                        </li>`)}
                      </ul>`
                    : html`<p class="dica">Nenhum registro de acompanhamento ainda.</p>`}

                  ${!sel.parecer.encerradoEm
                    ? html`
                      <div class="field"><label>Novo registro de acompanhamento</label>
                        <textarea style=${{ minHeight: "70px" }} placeholder="Ex.: visita domiciliar realizada; família compareceu ao Conselho Tutelar..."
                          value=${novoRegistro} onChange=${e => setNovoRegistro(e.target.value)}></textarea></div>
                      <div class="acoes">
                        <button class="btn btn-secondary" onClick=${adicionarRegistro}>Adicionar registro</button>
                        <button class="btn btn-primary" onClick=${encerrarPapel}><${Icon} name="lock" size=${16} />Encerrar papel da instância</button>
                      </div>
                      <p class="dica">Enquanto o papel não for encerrado, você pode continuar
                        adicionando registros — isso é "Realizar atendimento e retorno das
                        ações". O encerramento do caso pelo Gestor do Caso fica bloqueado até
                        aqui.</p>`
                    : html`<${Alert} tone="ok">Papel desta instância encerrado — o caso já pode
                        ser encerrado pelo Gestor do Caso.</${Alert}>`}
                `}
              `}
          </${StepCard}>
        `}
    `}

    ${secao === "ia-contexto" && html`
      <${DestaqueIAPerfil}
        titulo="Resumo assistido para a Rede de Proteção"
        subtitulo="A IA organiza o contexto já registrado para reduzir perda de informação na transição entre atores."
        itens=${sel ? [
          { rotulo: "Protocolo", valor: sel.protocolo, dica: "Referência única do caso." },
          { rotulo: "Prioridade validada", valor: sel.validacao ? sel.validacao.prioridade : "A validar", dica: "Definida pelo Gestor do Caso." },
          { rotulo: "Motivo do acionamento", valor: isCritico(sel) ? "Caso crítico / urgente" : "Encaminhamento", dica: "Revisar dados e parecer institucional." }
        ] : []}
        recomendacao=${sel ? "Leia o resumo, confirme o contexto com os registros formais e documente o parecer da instância.": "Nenhum caso selecionado para resumir no momento."}
        aviso="A IA não substitui avaliação técnica, jurídica, clínica ou protetiva da instância competente."
      />
    `}
  </${ProfileShell}>`;
}

/* ============================================================== perfil 4 (raia) — Equipe de Apoio
   Fluxograma v2: "Realizar ações e providências previstas no protocolo" → "Registrar ações,
   encaminhamentos e evidências" → "Acompanhar evolução do caso e monitorar prazos". Ator novo
   (não existia no fluxograma de 6 raias) — quem o Gestor do Caso atribui um caso "Atribuir à
   Equipe de Apoio" é quem executa o protocolo de verdade, em vez de ser automático. */
const SECOES_EQUIPE = [
  { grupo: "Minha atuação" },
  { id: "visao", label: "Visão geral", icon: "bar-chart" },
  { grupo: "Apoio da IA" },
  { id: "ia-execucao", label: "Sugestões para execução", icon: "cpu" }
];

function TelaEquipe({ casos, dispatch, navigate, colapsada, onColapsar }) {
  const [secao, setSecao] = useState("visao");
  const [registro, setRegistro] = useState("");
  // Continua na fila mesmo depois de concluído, até ser arquivado (igual à Gestão Escolar) — sem
  // mais ação nenhuma pra Equipe fazer ali, mas o caso não deve sumir da vista dela.
  function filtroEquipe(c) {
    return !!(c.encaminhamento && c.encaminhamento.decisao === "equipe" && !c.arquivadoEm);
  }
  const [pendentes, sel, selecionar] = useFilaCaso(casos, filtroEquipe);
  const a = sel ? analisar(sel.relato) : null;
  // Mesmo padrão de auto-desabilitar no clique usado no Gestor do Caso — evita um segundo clique
  // disparar EQUIPE_CONCLUIR de novo antes do estado atualizar; reseta ao trocar de caso.
  const [concluindo, setConcluindo] = useState(false);
  const [ultimoSelIdEquipe, setUltimoSelIdEquipe] = useState(null);
  if (sel && sel.id !== ultimoSelIdEquipe) {
    setUltimoSelIdEquipe(sel.id);
    setConcluindo(false);
  }

  function registrar() {
    const txt = registro.trim();
    if (!txt) { showAviso("Escreva o registro antes de adicionar."); return; }
    dispatch({ type: "EQUIPE_REGISTRAR", casoId: sel.id, texto: txt });
    setRegistro("");
  }
  function concluir() {
    dispatch({ type: "EQUIPE_CONCLUIR", casoId: sel.id });
  }

  return html`<${ProfileShell} profile="equipe" navigate=${navigate} casos=${casos}
    secoes=${SECOES_EQUIPE} ativa=${secao} onTrocar=${s => { selecionar(null); setSecao(s); }} colapsada=${colapsada} onColapsar=${onColapsar}>

    ${secao === "visao" && (!sel
      ? html`
          ${secao === "visao" && html`
            <div class="tiles">
              <div class="tile"><div class="n">${pendentes.length}</div><div class="lbl">Casos atribuídos</div></div>
              <div class="tile"><div class="n">${pendentes.filter(c => !c.equipeConcluidaEm).length}</div><div class="lbl">Acompanhamentos abertos</div></div>
              <div class="tile"><div class="n">${pendentes.reduce((n,c) => n + (c.acompanhamentos || []).length, 0)}</div><div class="lbl">Registros realizados</div></div>
            </div>
            <${DestaqueIAPerfil}
              titulo="IA de apoio à execução"
              subtitulo="A IA usa a classificação já validada para lembrar providências coerentes com o protocolo."
              itens=${sel && a ? [
                { rotulo: "Próxima ação", valor: sugerirTratamento(a)[0] || "Revisar protocolo validado", dica: "Sugestão assistiva." },
                { rotulo: "Prazo de referência", valor: sel.validacao ? PRAZO[sel.validacao.prioridade] : "A definir", dica: "Conforme prioridade validada." },
                { rotulo: "Registro necessário", valor: "Evidências e resultado", dica: "Documentar o que foi executado." }
              ] : []}
              recomendacao="Acesse um caso atribuído, execute as ações previstas pelo Gestor do Caso e registre evidências e evolução."
              aviso="A Equipe de Apoio não altera sozinha a classificação ou prioridade validada pelo Gestor do Caso."
            />
          `}
          ${pendentes.length
            ? html`<${FilaTabela} casos=${pendentes} selecionadoId=${null} onSelecionar=${selecionar} />`
            : html`<${Alert} tone="info">Nenhum caso atribuído a esta equipe no momento. O Gestor do
                Caso atribui um caso aqui ao escolher "Atribuir à Equipe de Apoio".</${Alert}>`}`
      : html`
    <div class="acoes" style=${{ marginTop: 0, marginBottom: "12px" }}>
      <button class="btn btn-ghost" onClick=${() => selecionar(null)}>← Voltar para a fila</button>
    </div>
    ${pendentes.length > 1 && html`<p class="card-sub">${pendentes.length} casos atribuídos —
      selecione qual atender.</p>`}

    <details class="rodape-papel" style=${{ margin: "0 0 16px" }}>
      <summary><${Icon} name="info" size=${14} /> Histórico completo do caso — todas as raias envolvidas</summary>
      <div class="rodape-papel-corpo"><${LinhaDoTempo} kase=${sel} /></div>
    </details>

    <${StepCard} n=${1} title="Realizar ações e providências previstas no protocolo" status="concluido">
      <p style=${{ whiteSpace: "pre-wrap" }}>${sel.relato}</p>
      <p class="card-sub">Categoria validada: <b>${esc(sel.validacao.categoria)}</b> —
        prioridade <${Badge} tone=${toneFor(sel.validacao.prioridade)}>${sel.validacao.prioridade}</${Badge}>.</p>
      <${InsightsTratamento} a=${a} />
    </${StepCard}>

    <${StepCard} n=${2} title="Registrar ações, encaminhamentos e evidências" status=${(sel.acompanhamentos || []).length ? "concluido" : "atual"}>
      ${(sel.acompanhamentos || []).length > 0
        ? html`<ul class="timeline">
            ${sel.acompanhamentos.map((ac, i) => html`<li key=${i}><div class="quando">${quando(ac.em)}</div><b>Registro de acompanhamento</b><div>${esc(ac.texto)}</div></li>`)}
          </ul>`
        : html`<p class="dica">Nenhum registro ainda.</p>`}
      ${!sel.equipeConcluidaEm && html`
        <div class="field"><label>Novo registro</label>
          <textarea style=${{ minHeight: "70px" }} placeholder="Ex.: mediação realizada; famílias comunicadas; evidências anexadas..."
            value=${registro} onChange=${e => setRegistro(e.target.value)}></textarea></div>
        <div class="acoes"><button class="btn btn-secondary" onClick=${registrar}>Adicionar registro</button></div>`}
    </${StepCard}>

    <${StepCard} n=${3} title="Acompanhar evolução do caso e monitorar prazos" status=${sel.equipeConcluidaEm ? "concluido" : "atual"}>
      <p class="card-sub">Prazo de referência (conforme a prioridade validada): <b>${PRAZO[sel.validacao.prioridade]}</b>.</p>
      ${sel.equipeConcluidaEm
        ? html`<p class="dica">Acompanhamento concluído em ${quando(sel.equipeConcluidaEm)}. O
            encerramento segue com o Gestor do Caso.</p>`
        : html`<div class="acoes"><button class="btn btn-primary" disabled=${concluindo} onClick=${() => { setConcluindo(true); showConfirm({
            titulo: "Concluir acompanhamento da Equipe de Apoio",
            mensagem: "Esta ação é definitiva: depois de concluído, não é mais possível adicionar novos registros aqui; o Gestor do Caso segue para o encerramento.",
            textoConfirmar: "Confirmar conclusão",
            onConfirmar: concluir,
            onCancelar: () => setConcluindo(false)
          }); }}><${Icon} name="check-circle" size=${16} />${concluindo ? "Concluindo…" : "Concluir acompanhamento da Equipe de Apoio"}</button></div>`}
    </${StepCard}>
    `)}

    ${secao === "ia-execucao" && html`
      <${DestaqueIAPerfil}
        titulo="Sugestões da IA para execução"
        subtitulo="A IA transforma o protocolo validado em lembretes operacionais, mantendo a decisão humana."
        itens=${sel && a ? sugerirTratamento(a).slice(0,3).map((s,i) => ({ rotulo: "Sugestão " + (i+1), valor: s, dica: "Validar antes de executar." })) : []}
        recomendacao=${sel ? "Priorize ações de proteção, preserve evidências e registre cada providência com data e resultado." : "Selecione um caso atribuído para visualizar sugestões contextuais."}
        aviso="Sugestões não substituem avaliação profissional nem autorização institucional."
      />
    `}
  </${ProfileShell}>`;
}

/* ============================================================== módulo de KPI (Operacional + Gerencial)
   Elementos observáveis definidos no artigo do TCC, §7.1 ("Do caso individual aos indicadores
   agregados"): frequência de registros, categorias predominantes, ambientes mencionados,
   recorrência, tempo de resposta, tempo de tratamento, cumprimento de etapas, situação dos
   casos, evolução temporal. O artigo não define fórmula/meta pra nenhum deles — os números aqui
   são calculados de verdade sobre `casos`/`arquivados`, não placeholders.
   Nível "tático" não existe no artigo — o real é Operacional/Gerencial/Estratégico (§10); aqui
   só Operacional (o que precisa de atenção agora) e Gerencial (padrões pra decisão), já que
   Estratégico depende de dados de várias escolas (fora do escopo de uma demonstração). */
function diasEntre(isoInicio, isoFim) {
  if (!isoInicio || !isoFim) return null;
  const dias = (new Date(isoFim) - new Date(isoInicio)) / 86400000;
  return dias >= 0 ? dias : null;
}
function mediaDias(casos, pegarInicio, pegarFim) {
  const valores = casos.map(c => diasEntre(pegarInicio(c), pegarFim(c))).filter(v => v !== null);
  if (!valores.length) return null;
  return valores.reduce((a, b) => a + b, 0) / valores.length;
}
function contarPor(casos, pegarChave) {
  const contagem = {};
  casos.forEach(c => {
    const chave = pegarChave(c);
    if (chave) contagem[chave] = (contagem[chave] || 0) + 1;
  });
  return Object.entries(contagem).sort((a, b) => b[1] - a[1]);
}
function evolucaoMensal(casos) {
  const porMes = {};
  casos.forEach(c => {
    if (!c.enviadoEm) return;
    const mes = c.enviadoEm.slice(0, 7);
    porMes[mes] = (porMes[mes] || 0) + 1;
  });
  return Object.entries(porMes).sort((a, b) => (a[0] < b[0] ? -1 : 1));
}
function fmtDias(n) { return n === null ? "—" : (n < 1 ? Math.round(n * 24) + "h" : n.toFixed(1) + "d"); }
function nomeMes(aaaaMm) {
  const [ano, mes] = aaaaMm.split("-");
  const nomes = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  return nomes[parseInt(mes, 10) - 1] + "/" + ano.slice(2);
}
/* Barra horizontal ranqueada (categorias, ambientes, evolução mensal) — mesmo padrão visual de
   `.maturity-row`/`.maturity-track`/`.maturity-fill` já usado em Maturidade institucional, só
   parametrizando rótulo/valor/largura em vez da nota N1–N5. */
function BarraRanking({ itens, corBarra }) {
  const max = itens.length ? Math.max(...itens.map(([, n]) => n)) : 1;
  return html`${itens.map(([rotulo, n]) => html`<div class="maturity-row" key=${rotulo}>
    <div class="maturity-label">${rotulo}</div>
    <div class="maturity-track"><div class="maturity-fill" style=${{ width: (n / max) * 100 + "%", background: corBarra || "var(--brand-600)" }}></div></div>
    <div class="maturity-n">${n}</div>
  </div>`)}`;
}

function statusListagem(c) {
  if (c.arquivadoEm) return { label: "Arquivado", tone: "neutro" };
  if (c.desfecho) return { label: "Aguardando arquivamento", tone: "media" };

const SECOES_REDE = [

/* ============================================================== agregados da raia "rede" (RLS)
   Atualização 13: a raia "rede" deixou de receber `casos`/`arquivados` como prop — no banco ela
   não tem NENHUMA policy de leitura em `casos` (só a função indicadores_rede(), que devolve
   somas/contagens já agregadas, nunca uma linha). Os 4 casos de SEED_ARQUIVADOS continuam sendo
   uma constante do módulo (nunca existiram na tabela `casos`), então o RPC não sabe deles — o
   `mesclarComSeed` abaixo soma o que veio do banco com o que é calculado aqui, client-side, sobre
   a constante. Nunca faz média de médias já prontas (dá conta errada); sempre soma numerador e
   denominador primeiro, divide por último. */
const SEED_AGREGADOS = (() => {
  const tt = SEED_ARQUIVADOS.reduce((acc, c) => {
    const d = diasEntre(c.enviadoEm, c.desfecho && c.desfecho.em);
    return d === null ? acc : { soma_dias: acc.soma_dias + d, contagem: acc.contagem + 1 };
  }, { soma_dias: 0, contagem: 0 });
  return {
    total_casos: SEED_ARQUIVADOS.length,
    casos_arquivados: SEED_ARQUIVADOS.length,
    tempo_tratamento: tt,
    categorias_predominantes: contarPor(SEED_ARQUIVADOS, c => c.validacao && c.validacao.categoria).map(([rotulo, n]) => ({ rotulo, n })),
    ambientes_mencionados: contarPor(SEED_ARQUIVADOS, c => c.local).map(([rotulo, n]) => ({ rotulo, n })),
    // Os seeds não têm campo `relato` (só o resultado final já processado) — nunca contam como
    // "com recorrência", mas contam no total, exatamente como o cálculo antigo já fazia.
    recorrencia: { com_recorrencia: 0, total: SEED_ARQUIVADOS.length },
    evolucao_mensal: evolucaoMensal(SEED_ARQUIVADOS).map(([mes, n]) => ({ mes, n }))
  };
})();
function somarRotuloN(a, b) {
  const mapa = {};
  (a || []).forEach(({ rotulo, n }) => { if (rotulo) mapa[rotulo] = (mapa[rotulo] || 0) + n; });
  (b || []).forEach(({ rotulo, n }) => { if (rotulo) mapa[rotulo] = (mapa[rotulo] || 0) + n; });
  return Object.entries(mapa).sort((x, y) => y[1] - x[1]);
}
function somarMesN(a, b) {
  const mapa = {};
  (a || []).forEach(({ mes, n }) => { mapa[mes] = (mapa[mes] || 0) + n; });
  (b || []).forEach(({ mes, n }) => { mapa[mes] = (mapa[mes] || 0) + n; });
  return Object.entries(mapa).sort((x, y) => (x[0] < y[0] ? -1 : 1));
}
function mediaPonderada(a, b) {
  const soma = (a ? a.soma_dias : 0) + (b ? b.soma_dias : 0);
  const n = (a ? a.contagem : 0) + (b ? b.contagem : 0);
  return n ? soma / n : null;
}
function mesclarComSeed(rpc) {
  if (!rpc) return null;
  const s = SEED_AGREGADOS;
  const totalRecorrencia = (rpc.recorrencia ? rpc.recorrencia.total : 0) + s.recorrencia.total;
  const comRecorrencia = (rpc.recorrencia ? rpc.recorrencia.com_recorrencia : 0) + s.recorrencia.com_recorrencia;
  return {
    totalCasos: (rpc.total_casos || 0) + s.total_casos,
    casosArquivados: (rpc.casos_arquivados || 0) + s.casos_arquivados,
    casosAtivosAgora: rpc.casos_ativos_agora || 0,
    emAcompanhamentoAgora: rpc.em_acompanhamento_agora || 0,
    tempoResposta: mediaPonderada(rpc.tempo_resposta, null),
    tempoTratamento: mediaPonderada(rpc.tempo_tratamento, s.tempo_tratamento),
    cumprimentoEtapas: rpc.casos_ativos_agora
      ? Math.round(((rpc.casos_encaminhados_ativos || 0) / rpc.casos_ativos_agora) * 100)
      : null,
    situacaoCasosAgora: (rpc.situacao_casos_ativos || []).map(x => [x.rotulo, x.n]),
    categoriasPredominantes: somarRotuloN(rpc.categorias_predominantes, s.categorias_predominantes),
    ambientesMencionados: somarRotuloN(rpc.ambientes_mencionados, s.ambientes_mencionados),
    pctRecorrencia: totalRecorrencia ? Math.round((comRecorrencia / totalRecorrencia) * 100) : null,
    evolucao: somarMesN(rpc.evolucao_mensal, s.evolucao_mensal)
  };
}

function TelaRede({ navigate, casosVersao, colapsada, onColapsar }) {
  const [secao, setSecao] = useState("visao");
  const [estadoRpc, setEstadoRpc] = useState("carregando"); // carregando | pronto | sem_acesso | erro
  const [dadosReais, setDadosReais] = useState(null);
  const [erroMsg, setErroMsg] = useState(null);

  useEffect(() => {
    let cancelado = false;
    setEstadoRpc("carregando");
    sb.rpc("indicadores_rede").then(({ data, error }) => {
      if (cancelado) return;
      if (error) {
        // 42501 = a própria função indicadores_rede() recusou (sem perfil "rede"/admin no banco)
        // — trata como um estado esperado, não um erro genérico de rede/conexão.
        setEstadoRpc(error.code === "42501" || /acesso negado/.test(error.message || "") ? "sem_acesso" : "erro");
        setErroMsg(error.message);
        return;
      }
      setDadosReais(data);
      setEstadoRpc("pronto");
    });
    return () => { cancelado = true; };
  }, [casosVersao]);

  const dims = [
    ["Governança", 2], ["Prevenção", 1], ["Acessibilidade dos canais", 3], ["Gestão de casos", 3],
    ["Aderência aos protocolos", 2], ["Tempo de resposta", 2], ["Monitoramento", 1], ["Aprendizagem institucional", 1]
  ];
  function corN(n) { return n <= 1 ? "var(--danger)" : n <= 2 ? "var(--warn)" : n <= 3 ? "var(--ok)" : "var(--brand-600)"; }

  if (estadoRpc === "sem_acesso") {
    return html`<${ProfileShell} profile="rede" navigate=${navigate} secoes=${SECOES_REDE}
      ativa=${secao} onTrocar=${setSecao} colapsada=${colapsada} onColapsar=${onColapsar}>
      <${Alert} tone="warn">Sua conta não tem permissão para ver os indicadores da rede.</${Alert}>
    </${ProfileShell}>`;
  }
  if (estadoRpc === "erro") {
    return html`<${ProfileShell} profile="rede" navigate=${navigate} secoes=${SECOES_REDE}
      ativa=${secao} onTrocar=${setSecao} colapsada=${colapsada} onColapsar=${onColapsar}>
      <${Alert} tone="danger">Erro ao carregar indicadores: ${esc(erroMsg || "")}</${Alert}>
    </${ProfileShell}>`;
  }

  const m = mesclarComSeed(dadosReais);
  const precisaDeM = secao === "visao" || secao === "kpi" || secao === "inteligencia" || secao === "alertas";

  return html`<${ProfileShell} profile="rede" navigate=${navigate}
    secoes=${SECOES_REDE} ativa=${secao} onTrocar=${setSecao}
    colapsada=${colapsada} onColapsar=${onColapsar}>

        <${Alert} tone="info">Nível <b>Estratégico</b> (artigo, seção 10) — em produção, este
          painel agregaria dados de várias escolas da rede; aqui, no protótipo, reaproveita os
          dados desta escola única de demonstração.</${Alert}>

        ${!m && precisaDeM && html`<${Alert} tone="info">Carregando indicadores…</${Alert}>`}

        ${m && secao === "visao" && html`
          <div class="card">
            <h3>Indicadores institucionais</h3>
            <div class="tiles">
              <div class="tile"><div class="n">${m.totalCasos}</div><div class="lbl">Casos no sistema</div></div>
              <div class="tile"><div class="n">${m.casosArquivados}</div><div class="lbl">Casos arquivados</div></div>
              <div class="tile"><div class="n">${m.emAcompanhamentoAgora}</div><div class="lbl">Em acompanhamento agora</div></div>
              <div class="tile"><div class="n">${fmtDias(m.tempoResposta)}</div><div class="lbl">Tempo médio de resposta</div></div>
            </div>
            <p class="dica">Números calculados sobre os registros reais desta demonstração — veja
              o detalhamento completo em "Indicadores e KPI". Esta raia não acessa casos
              individuais: no fluxograma oficial, a Secretaria só consolida indicadores e dados
              anonimizados (ver "Papel desta raia", no rodapé).</p>
          </div>
          <div class="grid-2">
            <div class="card">
              <h3>Maturidade institucional</h3>
              <p class="card-sub">8 dimensões (modelo conceitual do artigo, seção 8.2).</p>
              ${dims.map(([label, n]) => html`<div class="maturity-row" key=${label}>
                <div class="maturity-label">${label}</div>
                <div class="maturity-track"><div class="maturity-fill" style=${{ width: (n / 5) * 100 + "%", background: corN(n) }}></div></div>
                <div class="maturity-n">N${n}</div>
              </div>`)}
            </div>
            <div class="card">
              <h3>Recomendações — subsidiar decisões e prevenção</h3>
              <ul>
                <li>Dimensão <b>Prevenção</b> em N1: nenhuma ação preventiva registrada no período.</li>
                <li>21% das triagens fora do prazo — revisar a escala de plantão.</li>
                <li>Dois casos com reincidência vinculada concentrados no mesmo turno.</li>
              </ul>
              <p class="dica">Ciclo institucional: medir → interpretar → recomendar → agir → acompanhar → medir novamente.</p>
            </div>
          </div>
        `}

        ${m && secao === "kpi" && html`
          <${Alert} tone="info">Elementos observáveis conforme o artigo do TCC, seção 7.1 ("Do caso
            individual aos indicadores agregados"). O artigo não define fórmula nem meta pra
            nenhum deles — os números abaixo são calculados sobre os casos reais desta
            demonstração.</${Alert}>

          <div class="card">
            <h3><${Icon} name="activity" size=${18} /> Painel Operacional</h3>
            <p class="card-sub">O que precisa de atenção agora, sobre os casos ativos.</p>
            <div class="tiles">
              <div class="tile"><div class="n">${fmtDias(m.tempoResposta)}</div><div class="lbl">Tempo médio de resposta</div></div>
              <div class="tile"><div class="n">${fmtDias(m.tempoTratamento)}</div><div class="lbl">Tempo médio de tratamento</div></div>
              <div class="tile"><div class="n">${m.cumprimentoEtapas === null ? "—" : m.cumprimentoEtapas + "%"}</div><div class="lbl">Cumprimento de etapas</div></div>
              <div class="tile"><div class="n">${m.casosAtivosAgora}</div><div class="lbl">Casos ativos agora</div></div>
            </div>
            <p class="card-sub" style=${{ marginTop: "18px" }}>Situação dos casos ativos</p>
            ${m.situacaoCasosAgora.length
              ? html`<${BarraRanking} itens=${m.situacaoCasosAgora} corBarra="var(--brand-600)" />`
              : html`<p class="dica">Nenhum caso ativo no momento.</p>`}
          </div>

          <div class="card">
            <h3><${Icon} name="bar-chart" size=${18} /> Painel Gerencial</h3>
            <p class="card-sub">Padrões para decisão institucional, olhando o histórico completo
              (${m.totalCasos} caso${m.totalCasos === 1 ? "" : "s"} no total).</p>
            <div class="tiles">
              <div class="tile"><div class="n">${m.totalCasos}</div><div class="lbl">Frequência de registros (total)</div></div>
              <div class="tile"><div class="n">${m.pctRecorrencia === null ? "—" : m.pctRecorrencia + "%"}</div><div class="lbl">Casos com indício de recorrência</div></div>
            </div>
            <div class="grid-2" style=${{ marginTop: "18px" }}>
              <div>
                <p class="card-sub">Categorias predominantes</p>
                ${m.categoriasPredominantes.length
                  ? html`<${BarraRanking} itens=${m.categoriasPredominantes} corBarra="var(--brand-600)" />`
                  : html`<p class="dica">Nenhum caso validado ainda.</p>`}
              </div>
              <div>
                <p class="card-sub">Ambientes mencionados</p>
                ${m.ambientesMencionados.length
                  ? html`<${BarraRanking} itens=${m.ambientesMencionados} corBarra="var(--pub-a)" />`
                  : html`<p class="dica">Nenhum ambiente informado nos relatos ainda.</p>`}
              </div>
            </div>
            <p class="card-sub" style=${{ marginTop: "18px" }}>Evolução mensal (relatos por mês) — "Monitorar padrões e recorrências"</p>
            ${m.evolucao.length
              ? html`<${BarraRanking} itens=${m.evolucao.map(([mes, n]) => [nomeMes(mes), n])} corBarra="var(--ok)" />`
              : html`<p class="dica">Sem dados suficientes para evolução temporal ainda.</p>`}
          </div>
        `}


        ${m && secao === "inteligencia" && html`
          <${DestaqueIAPerfil}
            titulo="Inteligência estratégica da rede"
            subtitulo="A IA identifica tendências e padrões usando somente dados agregados nesta camada."
            itens=${[
              { rotulo: "Registros com repetição", valor: m.pctRecorrencia === null ? "—" : m.pctRecorrencia + "%", dica: "Indício textual agregado." },
              { rotulo: "Categoria predominante", valor: m.categoriasPredominantes.length ? m.categoriasPredominantes[0][0] : "Sem dados", dica: "Entre os casos já validados." },
              { rotulo: "Ambiente mais citado", valor: m.ambientesMencionados.length ? m.ambientesMencionados[0][0] : "Sem dados", dica: "Leitura agregada." }
            ]}
            recomendacao="Cruze evolução temporal, categorias predominantes e maturidade para priorizar apoio técnico e ações preventivas na rede."
            aviso="Esta camada não deve abrir casos individuais por padrão; trabalha com indicadores anonimizados e agregados."
          />
        `}
        ${m && secao === "alertas" && html`
          <${DestaqueIAPerfil}
            titulo="Alertas estratégicos"
            subtitulo="Sinais para revisão da Secretaria antes de qualquer decisão de política ou intervenção."
            itens=${[
              { rotulo: "Recorrência agregada", valor: m.pctRecorrencia === null ? "—" : m.pctRecorrencia + "%", dica: "Monitorar evolução." },
              { rotulo: "Casos ativos", valor: m.casosAtivosAgora, dica: "Sem exposição nominal." },
              { rotulo: "Cumprimento de etapas", valor: m.cumprimentoEtapas === null ? "—" : m.cumprimentoEtapas + "%", dica: "Pode indicar necessidade de apoio." }
            ]}
            recomendacao="Se um indicador se deteriorar de forma consistente, priorize suporte institucional, formação e revisão de aderência aos protocolos."
            aviso="Alertas estratégicos não são ranking punitivo de escolas e não devem ser usados isoladamente para responsabilização."
          />
        `}
        ${secao === "maturidade" && html`
          <div class="card"><h3>Maturidade institucional — visão agregada</h3>
            ${dims.map(([label,n]) => html`<div class="maturity-row" key=${label}><div class="maturity-label">${label}</div><div class="maturity-track"><div class="maturity-fill" style=${{ width:(n/5)*100+"%", background:corN(n) }}></div></div><div class="maturity-n">N${n}</div></div>`)}
            <p class="dica">Nesta demonstração há uma única escola. Em produção, esta tela deve comparar evolução sem expor dados pessoais.</p>
          </div>
        `}
        ${secao === "relatorios" && html`
          <div class="card"><h3><${Icon} name="file-text" size=${18} /> Relatórios da rede</h3>
            <p class="card-sub">Saídas gerenciais previstas para a camada estratégica.</p>
            <ul><li>Relatório de evolução de ocorrências.</li><li>Relatório de aderência aos protocolos.</li><li>Relatório de maturidade institucional.</li><li>Relatório de padrões e recorrências agregadas.</li></ul>
            <p class="dica">No protótipo, a exportação não grava arquivo; a finalidade aqui é representar a funcionalidade no menu.</p>
          </div>
        `}
  </${ProfileShell}>`;
}

/* ============================================================== login (Supabase Auth real)
   Atualização 12: deixou de ser um seletor de usuário fictício — é e-mail/senha de verdade via
   sb.auth.signInWithPassword(). Conta nova se cria em TelaCadastro; a sessão passa a
   persistir entre recarregamentos (padrão do próprio SDK do Supabase — deixou de fazer sentido
   manter "sem localStorage" como regra agora que o app é online de propósito). */
function TelaLogin({ onEntrar, onRelatoAnonimo, onIrParaCadastro }) {
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [entrando, setEntrando] = useState(false);
  // Consulta pública de protocolo (sem login) — pra quem relatou pelo canal anônimo e só tem o
  // número do protocolo. Usa a função `consultar_protocolo_publico` (ver schema_supabase.sql,
  // seção 5), que só devolve o caso que bate exatamente com o protocolo informado.
  const [consultaAberta, setConsultaAberta] = useState(false);
  const [protocoloConsulta, setProtocoloConsulta] = useState("");
  const [consultando, setConsultando] = useState(false);
  const [resultadoConsulta, setResultadoConsulta] = useState(undefined);

  async function entrar(e) {
    e.preventDefault();
    if (!email.trim() || !senha) { showAviso("Preencha e-mail e senha."); return; }
    setEntrando(true);
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: senha });
    setEntrando(false);
    if (error) { showAviso("Não foi possível entrar: " + error.message); return; }
    onEntrar();
  }

  async function consultarProtocolo(e) {
    e.preventDefault();
    if (!protocoloConsulta.trim()) { showAviso("Digite o número do protocolo."); return; }
    setConsultando(true);
    const { data, error } = await sb.rpc("consultar_protocolo_publico", { p_protocolo: protocoloConsulta.trim() });
    setConsultando(false);
    if (error) { showAviso("Não foi possível consultar: " + error.message); return; }
    setResultadoConsulta(data || null);
  }

  // Manda o e-mail de recuperação — o link volta pra cá mesmo (esta mesma URL), onde
  // TelaRedefinirSenha assume assim que o Supabase detecta o token na URL (ver App()). Precisa
  // que essa URL esteja na lista "Redirect URLs" das configurações de Auth do projeto Supabase.
  async function esqueciSenha(e) {
    e.preventDefault();
    if (!email.trim()) { showAviso("Digite seu e-mail no campo acima primeiro, depois clique em \"Esqueci minha senha\"."); return; }
    const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: location.href.split("#")[0] });
    if (error) { showAviso("Não foi possível enviar o e-mail: " + error.message); return; }
    showAviso("Enviamos um e-mail para " + email.trim() + " com um link para definir uma senha nova.");
  }

        <div>Elo Escolar<small>MGBE-IA — protótipo de alta fidelidade</small></div>
      </div>
      <h1 style=${{ textAlign: "center" }}>Entrar no sistema</h1>
      <p class="lede" style=${{ textAlign: "center" }}>Entre com a conta cadastrada. Se ainda não
        tem uma, crie abaixo — o acesso às raias é liberado pelo Administrador depois.</p>
      <form onSubmit=${entrar}>
        <div class="field"><label>E-mail</label>
          <input type="email" autoComplete="username" value=${email} onChange=${e => setEmail(e.target.value)} disabled=${entrando} /></div>
        <div class="field"><label>Senha</label>
          <${CampoSenha} autoComplete="current-password" value=${senha} onChange=${e => setSenha(e.target.value)} disabled=${entrando} /></div>

        <a href="#" onClick=${esqueciSenha}>Esqueci minha senha</a></p>
      <div class="login-divisor"><span></span><small>ou</small><span></span></div>
      <button class="btn btn-warm" style=${{ width: "100%" }} onClick=${onRelatoAnonimo}>
        <${Icon} name="send" size=${16} />Quero relatar uma situação
      </button>
      <p class="dica" style=${{ textAlign: "center", marginTop: "8px", marginBottom: 0 }}>
        Você pode registrar uma situação sem entrar no sistema.</p>

      <p class="dica" style=${{ textAlign: "center", marginTop: "14px", marginBottom: 0 }}>
        <a href="#" onClick=${e => { e.preventDefault(); setConsultaAberta(!consultaAberta); }}>
          Já enviei um relato — consultar protocolo</a></p>

      ${consultaAberta && html`
        <form onSubmit=${consultarProtocolo} style=${{ marginTop: "10px" }}>
          <div class="field"><label>Número do protocolo</label>
            <input type="text" placeholder="Ex.: MGBE-2026-1234" value=${protocoloConsulta}
              onChange=${e => setProtocoloConsulta(e.target.value)} disabled=${consultando} /></div>
          <button type="submit" class="btn btn-secondary" style=${{ width: "100%" }} disabled=${consultando}>
            ${consultando ? "Consultando…" : "Consultar"}</button>
        </form>
        ${resultadoConsulta === null && html`<div style=${{ marginTop: "10px" }}>
          <${Alert} tone="info">Protocolo não encontrado. Confira se digitou corretamente.</${Alert}>
        </div>`}
        ${resultadoConsulta && (() => {
          const etapa = ETAPAS_COMUNICANTE.find(e => e.chave === statusSimplificadoComunicante(resultadoConsulta));
          return html`<div class="card" style=${{ marginTop: "10px" }}>
            <p class="card-sub" style=${{ margin: "0 0 4px" }}>Protocolo ${resultadoConsulta.protocolo}</p>
            <${Alert} tone=${etapa.chave === "encerrado" ? "ok" : "info"}>
              <b>Status atual: ${etapa.label}.</b> ${etapa.mensagem}</${Alert}>
            <${LinhaDoTempoRelato} statusAtual=${etapa.chave} />
          </div>`;
        })()}
      `}
    </div>
  </div>`;
}

/* Cadastro real de conta — cria em auth.users (via sb.auth.signUp) e, automaticamente por
   trigger no banco (ver schema_supabase.sql), uma linha correspondente em `perfis`, sem nenhum
   perfil liberado ainda. O Administrador concede acesso depois pela tela de Administração. */
function TelaCadastro({ onVoltar, onCadastrado }) {
  const [nome, setNome] = useState("");
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [enviando, setEnviando] = useState(false);
  // Idade + aceite dos Termos de Uso, com base legal explícita (pedido do usuário, mesma lógica
  // já aplicada ao envio de relato em AssistenteRelato) — aqui é sobre a CONTA em si (não sobre
  // um relato específico), então cobre qualquer uma das 6 raias que passam por "Criar conta".
  const [maiorDeIdade, setMaiorDeIdade] = useState(null);
  const [aceiteTermos, setAceiteTermos] = useState(false);

  async function cadastrar(e) {
    e.preventDefault();
    if (!nome.trim()) { showAviso("Informe seu nome."); return; }
    if (!email.trim() || !senha) { showAviso("Preencha e-mail e senha."); return; }
    if (senha.length < 6) { showAviso("A senha precisa ter pelo menos 6 caracteres."); return; }
    if (maiorDeIdade === null) { showAviso("Informe se você é menor ou maior de 18 anos."); return; }
    if (!aceiteTermos) { showAviso("Você precisa ler e aceitar os Termos de Uso e Tratamento de Dados para criar a conta."); return; }
    setEnviando(true);
    const { error } = await sb.auth.signUp({
      email: email.trim(), password: senha,
      // Mesmo padrão do "esqueci minha senha" abaixo: sem isso, o link do e-mail de confirmação
      // usa o "Site URL" configurado no painel do Supabase (que pode estar apontando pra um
      // domínio sem GitHub Pages ativo) em vez de voltar pra onde a pessoa realmente se cadastrou.
      options: { emailRedirectTo: location.href.split("#")[0], data: {
        nome: nome.trim(),
        maior_de_idade: maiorDeIdade, termos_aceitos_em: new Date().toISOString()
      } }
    });
    setEnviando(false);
    if (error) { showAviso("Não foi possível criar a conta: " + error.message); return; }
    onCadastrado();
  }

      </div>
      <h1 style=${{ textAlign: "center" }}>Criar sua conta</h1>
      <p class="lede" style=${{ textAlign: "center" }}>Sua conta já nasce com acesso ao canal do
        Comunicante — se você tiver outro papel na escola (Gestor do Caso, Equipe de Apoio etc.),
        peça ao Administrador do sistema para liberar a raia correspondente.</p>
      <form onSubmit=${cadastrar}>
        <div class="field"><label>Nome</label>
          <input type="text" value=${nome} onChange=${e => setNome(e.target.value)} disabled=${enviando} /></div>
        <div class="field"><label>E-mail</label>
          <input type="email" autoComplete="username" value=${email} onChange=${e => setEmail(e.target.value)} disabled=${enviando} /></div>
        <div class="field"><label>Senha</label>
          <${CampoSenha} autoComplete="new-password" value=${senha} onChange=${e => setSenha(e.target.value)} disabled=${enviando} /></div>

        <div class="field"><label>Sua idade *</label>
          <div class="acoes" style=${{ marginTop: "4px" }}>
            <label style=${{ display: "flex", alignItems: "center", gap: "6px", fontWeight: 400 }}>
              <input type="radio" name="cadastro-idade" checked=${maiorDeIdade === false} onChange=${() => setMaiorDeIdade(false)} disabled=${enviando} />
              Sou menor de 18 anos</label>
            <label style=${{ display: "flex", alignItems: "center", gap: "6px", fontWeight: 400 }}>
              <input type="radio" name="cadastro-idade" checked=${maiorDeIdade === true} onChange=${() => setMaiorDeIdade(true)} disabled=${enviando} />
              Tenho 18 anos ou mais</label>
          </div>
        </div>

        <details class="rodape-papel" style=${{ margin: "6px 0 14px" }}>
          <summary>Termos de Uso e Tratamento de Dados</summary>
          <div class="rodape-papel-corpo">
            <p><b>1. O que coletamos.</b> Para criar sua conta, guardamos nome, e-mail e senha (a
              senha nunca fica visível para ninguém, inclusive a equipe do sistema — é armazenada
              de forma criptografada). Esses dados servem só para identificar quem acessa o
              sistema e controlar quais raias/telas cada pessoa pode usar.</p>
            <p><b>2. Base legal.</b> O tratamento segue a Lei Geral de Proteção de Dados — LGPD
              (Lei nº 13.709/2018), art. 7º, incisos I (consentimento, que você está dando agora)
              e IX (legítimo interesse da escola em controlar o acesso ao sistema). Quando a conta
              é de uma pessoa menor de 18 anos, aplica-se também o art. 14 da LGPD — o
              consentimento é dado aqui pelo próprio estudante para fins de proteção e
              participação no fluxo institucional, coerente com o Estatuto da Criança e do
              Adolescente — ECA (Lei nº 8.069/1990) e com a Lei nº 13.185/2015 (combate à
              intimidação sistemática), que preveem a atuação da escola na proteção do estudante
              sem depender de burocracia adicional. A Lei nº 14.811/2024 (que trata da
              criminalização do bullying e cyberbullying) reforça o dever da escola de manter um
              canal de registro e tratamento desses casos. A Lei nº 13.431/2017 e o Decreto nº
              9.603/2018 (art. 11) estabelecem o dever de comunicação ao Conselho Tutelar diante
              de identificação ou revelação de violência, cumprido pelo Gestor do Caso dentro do
              sistema. A Lei nº 15.211/2025 (ECA Digital) e o Decreto nº 12.880/2026 reforçam a
              proteção de crianças e adolescentes também em ambientes digitais, o que inclui o
              uso deste sistema.</p>
            <p><b>3. Seus direitos.</b> A qualquer momento, você pode pedir ao Administrador do
              sistema acesso, correção ou exclusão dos seus dados de conta, conforme o art. 18 da
              LGPD. Isso não afeta relatos já registrados, que seguem sua própria regra de
              retenção (ver aviso na tela de registro de relato).</p>
            <p><b>4. Segurança e acesso.</b> Os dados ficam num banco protegido por regras de
              acesso por perfil (art. 46 da LGPD) — só pessoas com a raia correta liberada pelo
              Administrador conseguem ver o que cabe à sua função. Nenhum dado de conta é usado
              para outra finalidade além de operar este sistema.</p>
          </div>
        </details>
        <label style=${{ display: "flex", alignItems: "flex-start", gap: "8px", marginBottom: "14px", fontWeight: 400 }}>
          <input type="checkbox" checked=${aceiteTermos} onChange=${e => setAceiteTermos(e.target.checked)} disabled=${enviando} style=${{ marginTop: "3px" }} />
          <span>Li e aceito os Termos de Uso e Tratamento de Dados acima.</span>
        </label>

        <button type="submit" class="btn btn-primary" style=${{ width: "100%" }} disabled=${enviando}>
          ${enviando ? "Criando…" : "Criar conta"}</button>
      </form>
      <div class="acoes" style=${{ justifyContent: "center", marginTop: "12px" }}>
        <button class="btn btn-secondary" onClick=${onVoltar} disabled=${enviando}>
          <${Icon} name="arrow-left" size=${16} />Voltar ao login</button>
      </div>
    </div>
  </div>`;
}

   escolher a senha nova. */

  const [senha, setSenha] = useState("");
  const [confirmacao, setConfirmacao] = useState("");

    e.preventDefault();
    if (senha.length < 6) { showAviso("A senha precisa ter pelo menos 6 caracteres."); return; }
    if (senha !== confirmacao) { showAviso("As duas senhas digitadas são diferentes."); return; }

    const { error } = await sb.auth.updateUser({ password: senha });
    setEnviando(false);
    if (error) { showAviso("Não foi possível salvar a senha nova: " + error.message); return; }

/* Canal público sem login — mesma tarefa "Registrar relato ou denúncia" da raia Demandante do
   fluxograma, só que sem exigir sessão. Reaproveita o mesmo AssistenteRelato e o mesmo
   ENVIAR_RELATO do reducer (não é um caminho de dados paralelo). Ver plano "Atualização 5". */

  const [copiado, setCopiado] = useState(false);
  async function copiarProtocolo() {
    try {
      await navigator.clipboard.writeText(protocolo);
      setCopiado(true);
      setTimeout(() => setCopiado(false), 2000);
