<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MGBE · Elo Escolar</title>
<!--
  Protótipo de ALTA FIDELIDADE - MGBE (Elo Escolar), em React.
  Arquivo único, sem build: React 18, ReactDOM 18 e htm (JSX via template
  strings, sem Babel) estão embutidos inline abaixo.

  Atualização 12: o protótipo deixou de ter requisito de funcionar offline —
  decisão registrada no plano do projeto, pra suportar a oficina extensionista
  com várias pessoas em dispositivos próprios vendo os casos umas das outras
  ao vivo. Por isso o SDK do Supabase (banco real + autenticação real + tempo
  real) é carregado via CDN logo abaixo, e o app.js se conecta a um projeto
  Supabase de verdade (ver as constantes SUPABASE_URL/SUPABASE_ANON_KEY no
  topo do app.js). MGBE_prototipo.html (baixa fidelidade) continua 100%
  offline, sem esta dependência.

  O motor de regras por palavra-chave é PORTADO 1:1 do MGBE_prototipo.html
  (regras explícitas e visíveis, não um modelo de aprendizado de máquina —
  ver LEIA-ME.md do protótipo de baixa fidelidade: apresentar isso como IA
  treinada seria um problema sério na defesa do TCC).

  A partir daqui, o fluxo segue exatamente "Fluxo do Processo — MGBE-IA"
  (fluxograma oficial de 4 fases e 6 raias/atores fornecido pelo usuário):
  Demandante, Recepção da Escola, Profissional Responsável, Sistema MGBE-IA,
  Instâncias Externas e Gestão e Monitoramento. A navegação principal é uma
  barra de 6 perfis — trocar de perfil é a única forma de ver as tarefas de
  outro ator, para não misturar funções.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Identidade visual oficial (logo do produto): navy / turquesa / pêssego —
     substituiu a paleta violeta/ciano original (rebrand concluído a partir
     do design já validado no protótipo mgbe-sbc-demo). --brand-* continua
     sendo a escala usada em quase todo componente (barra de perfis,
     sidebars, botões, links, foco, cabeçalhos de tabela), então repontear
     essa escala já propaga a mudança para o sistema inteiro sem precisar
     tocar componente por componente. */
  --brand-900:#143650; --brand-800:#1a4462; --brand-700:#205072; --brand-600:#2b84a3;
  --brand-500:#46C7C7; --brand-200:#cdeeee; --brand-100:#dbe8f1; --brand-50:#eef4f8;

  --ink-900:#161d27; --ink-700:#333d4a; --ink-500:#5b6675; --ink-400:#7b8493; --ink-300:#9aa3b0;

  --line:#e3e7ed; --line-strong:#cdd4dd;
  --paper:#ffffff; --bg:#f4f2fb;

  /* Semânticas de prioridade/estado — de propósito NÃO seguem a paleta de
     marca: alta=vermelho, média=âmbar, baixa=verde é convenção de segurança
     usada em todo o fluxo de triagem e não deve mudar por preferência
     estética. */
  --danger:#a12722; --danger-bg:#fbeae9; --danger-line:#e3aca8;
  --warn:#8a5300; --warn-bg:#fbf1dd; --warn-line:#e5c37e;
  --ok:#1f6b46; --ok-bg:#e6f3ec; --ok-line:#a9d6bd;
  --neutral:#5b6675; --neutral-bg:#eceff3; --neutral-line:#d7dce2;
  --info:#205072; --info-bg:#eef4f8; --info-line:#dbe8f1;

  --radius-sm:7px; --radius:12px; --radius-lg:18px;
  --shadow-sm:0 1px 2px rgba(20,54,80,.08), 0 1px 1px rgba(20,54,80,.05);
  --shadow:0 10px 24px -8px rgba(20,54,80,.20), 0 2px 6px rgba(20,54,80,.07);
  --shadow-lg:0 24px 48px -12px rgba(20,54,80,.30);

  --sidebar-w:248px;
  --content-w:1320px;
  --font: "Nunito", "Segoe UI", -apple-system, Roboto, Arial, sans-serif;

  /* Paleta "pub" — mantida para o tratamento de destaque (degradê, chips,
     cartão hero) da tela do Demandante, que continua com um acabamento
     próprio dentro da mesma família de cor agora usada em todo o sistema.
     Turquesa/pêssego em vez do violeta/ciano/rosa original. */
  --pub-a:#205072; --pub-a-dark:#143650; --pub-b:#46C7C7; --pub-c:#F0A36E;
  --pub-bg:#eef9f9;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink-900);font:15px/1.55 var(--font);
     -webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid rgba(70,199,199,.55);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0 0 6px;font-weight:700;letter-spacing:-.01em;color:var(--ink-900)}
h1{font-size:24px}
h2{font-size:17px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-500);
   font-weight:700;margin:28px 0 12px}
h3{font-size:15px}
p{margin:0 0 10px}
.lede{color:var(--ink-500);font-size:14.5px;margin:0 0 20px}
a{color:var(--brand-700)}
button{font-family:inherit}
mark{background:#ffe9a8;padding:0 2px;border-radius:2px}
::selection{background:var(--brand-200)}

/* ---------- layout shells ---------- */
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.brand .mark{width:46px;height:46px;border-radius:13px;background:#fff;padding:5px;
  display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;
  box-shadow:0 4px 12px rgba(20,54,80,.25)}
.brand small{display:block;font-weight:500;font-size:11.5px;color:var(--ink-400)}

/* Barra de navegação entre os 6 perfis do fluxograma oficial — única, fixa no
   topo, igual para todos os perfis. É o que resolve "não ficar misturado":
   trocar de perfil é a única forma de ver as tarefas de outro ator. */
.profile-nav{background:var(--paper);border-bottom:1px solid var(--line);
  box-shadow:var(--shadow-sm);position:sticky;top:0;z-index:10}
.profile-nav::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
  background:linear-gradient(90deg,var(--brand-600),var(--pub-b) 55%,var(--pub-c))}
.profile-nav-top{max-width:var(--content-w);margin:0 auto;padding:12px 22px 8px;display:flex;
  align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.case-pill{display:inline-flex;align-items:center;gap:6px;background:var(--brand-50);
  color:var(--brand-700);border:1px solid var(--brand-100);border-radius:999px;
  padding:4px 12px;font-size:12.5px;font-weight:700}
/* Select de personificação — o usuário "master" da demonstração escolhe qual
   dos 6 perfis está encarnando no momento, para percorrer o fluxo sozinho. */
.impersona{max-width:var(--content-w);margin:0 auto;padding:0 22px 12px}
.impersona label{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;
  color:var(--ink-500);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.impersona select{max-width:520px;font-weight:700;color:var(--brand-800);
  border-color:var(--brand-200);background-color:var(--brand-50)}
.impersona select:focus{outline:2px solid var(--brand-500);outline-offset:1px}
.impersona-nota{font-size:12px;color:var(--ink-400);margin:6px 0 0}
.impersona-fixo{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;
  color:var(--brand-700);padding:6px 0}

/* Chip do usuário logado + ações (Administração/Sair), na barra de perfis */
.profile-nav-user{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.user-chip{display:flex;align-items:center;gap:8px;padding:3px 10px 3px 3px;border-radius:999px;
  background:var(--neutral-bg)}
.user-chip-avatar{width:26px;height:26px;border-radius:50%;background:var(--brand-600);color:#fff;
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.user-chip-info{display:flex;flex-direction:column;line-height:1.25}
.user-chip-info b{font-size:12.5px;color:var(--ink-900)}
.user-chip-info small{font-size:11px;color:var(--ink-500)}

.profile-content{max-width:var(--content-w);margin:0 auto;padding:26px 22px 90px}
.actor-head{margin-bottom:18px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.grid-2>.card{margin-bottom:0}
@media(max-width:900px){.grid-2{grid-template-columns:1fr}}

/* Sub-navegação em sidebar, hoje só dentro do perfil Gestão e Monitoramento (não é uma sidebar
   global — fica contida na área de conteúdo desse perfil, abaixo da barra de personificação).
   É um painel de verdade (fundo, borda, sombra), não só links soltos — carrega um resumo com
   números reais do sistema, para não deixar espaço vazio sem informação. */
.gestao-shell{display:flex;gap:20px;align-items:flex-start}
.gestao-sidebar{width:250px;flex-shrink:0;position:sticky;top:88px;background:var(--paper);
  border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);
  padding:16px;display:flex;flex-direction:column;gap:16px}
.gestao-nav{display:flex;flex-direction:column;gap:3px}
.gestao-navlink{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);
  border:1px solid transparent;background:transparent;color:var(--ink-500);font:inherit;
  font-size:13.8px;font-weight:600;cursor:pointer;text-align:left;transition:background .12s,color .12s}
.gestao-navlink:hover{background:var(--neutral-bg);color:var(--ink-900)}
.gestao-navlink.ativo{background:var(--brand-600);color:#fff;border-color:var(--brand-600)}
.gestao-navlink .ic-chip{width:26px;height:26px;border-radius:8px;background:var(--brand-50);
  color:var(--brand-700);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.gestao-navlink.ativo .ic-chip{background:rgba(255,255,255,.2);color:#fff}
.gestao-count{margin-left:auto;background:var(--neutral-bg);color:var(--ink-500);font-size:11.5px;
  font-weight:800;border-radius:999px;padding:1px 8px}
.gestao-navlink.ativo .gestao-count{background:rgba(255,255,255,.25);color:#fff}
.gestao-resumo{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.gestao-resumo-item{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.gestao-resumo-item .n{font-size:19px;font-weight:800;color:var(--brand-700);letter-spacing:-.02em}
.gestao-resumo-item .lbl{font-size:12px;color:var(--ink-500);text-align:right}
.gestao-main{flex:1;min-width:0}
@media(max-width:760px){
  .gestao-shell{flex-direction:column}
  .gestao-sidebar{width:100%;position:static}
  .gestao-nav{flex-direction:row;flex-wrap:wrap}
  .gestao-resumo{flex-direction:row;flex-wrap:wrap;border-top:0;padding-top:0;gap:16px}
}

/* ---------- shell do app inteiro (sidebar única, recolhível, tela cheia) ----------
   Reaproveita as MESMAS classes .gestao-* acima (`.gestao-shell`/`.gestao-sidebar`/`.gestao-nav`/
   `.gestao-navlink`/`.gestao-resumo*`/`.gestao-main`) — os 6 perfis (via ProfileShell) passam a
   somar a classe `.app-shell`/`.app-sidebar`/`.app-main`, cujas regras abaixo, por virem depois
   no arquivo e terem a mesma especificidade, sobrescrevem só o que muda: fundo escuro, altura
   total, largura fixa recolhível. A Administração (única outra usuária de `.gestao-*`) não leva
   essas classes extras, então continua exatamente como estava — painel claro dentro do conteúdo.
   Identidade: mesma escala --brand-* (navy/turquesa/pêssego) do resto do sistema — rebrand a
   partir do design já validado no protótipo mgbe-sbc-demo. */
.app-shell{min-height:100vh;gap:0;align-items:stretch;background:var(--bg)}
.app-sidebar{width:264px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;
  background:radial-gradient(120% 60% at 0% 0%,rgba(70,199,199,.22),transparent 60%),
              radial-gradient(120% 50% at 100% 100%,rgba(240,163,110,.18),transparent 60%),
              linear-gradient(185deg,var(--brand-700) 0%,var(--brand-900) 100%);
  border:0;border-radius:0;box-shadow:2px 0 14px -6px rgba(20,54,80,.35);
  padding:18px 14px;gap:14px;transition:width .16s ease;z-index:5}
.app-shell.colapsada .app-sidebar{width:74px;padding:18px 10px}

.sidebar-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sidebar-top .brand{color:#fff;min-width:0}
.sidebar-top .brand-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-top .brand small{color:rgba(255,255,255,.62)}
.sidebar-toggle{width:28px;height:28px;border-radius:8px;border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;transition:background .12s;padding:0}
.sidebar-toggle:hover{background:rgba(255,255,255,.2)}
.app-shell.colapsada .sidebar-top{justify-content:center}

.sidebar-perfil{border-top:1px solid rgba(255,255,255,.16);border-bottom:1px solid rgba(255,255,255,.16);
  padding:12px 0}
.sidebar-perfil label{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;
  color:rgba(255,255,255,.68);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.sidebar-perfil select{width:100%;font-weight:700;font-size:13px;background-color:rgba(255,255,255,.08);
  color:#fff;border:1.5px solid rgba(255,255,255,.22);border-radius:10px;padding:9px 10px}
.sidebar-perfil select option{color:var(--ink-900);background:var(--paper)}
.sidebar-perfil select:focus{outline:2px solid var(--brand-500);outline-offset:1px;border-color:var(--brand-500)}
.sidebar-perfil .impersona-fixo{color:#fff}

.app-sidebar .gestao-navlink{color:rgba(255,255,255,.82);white-space:nowrap;overflow:hidden}
.app-sidebar .gestao-navlink:hover{background:rgba(255,255,255,.07);color:#fff}
.app-sidebar .gestao-navlink.ativo{background:rgba(255,255,255,.12);color:#fff;border-color:transparent;
  box-shadow:inset 3px 0 0 var(--brand-500)}
.app-sidebar .gestao-navlink .ic-chip{background:rgba(255,255,255,.14);color:#fff}
.app-sidebar .gestao-navlink.ativo .ic-chip{background:rgba(255,255,255,.18);color:#fff}
.app-sidebar .gestao-count{background:rgba(70,199,199,.22);color:#bff0f0}
.app-sidebar .gestao-navlink.ativo .gestao-count{background:rgba(70,199,199,.3);color:#bff0f0}
.app-shell.colapsada .app-sidebar .gestao-navlink{justify-content:center}

.app-sidebar .gestao-resumo{border-top-color:rgba(255,255,255,.16)}
.app-sidebar .gestao-resumo-item .n{color:#fff}
.app-sidebar .gestao-resumo-item .lbl{color:rgba(255,255,255,.65)}

.sidebar-spacer{flex:1}
.sidebar-footer{display:flex;flex-direction:column;gap:3px;border-top:1px solid rgba(255,255,255,.16);
  padding-top:10px}
/* Rodapé da sidebar (IA supervisionada, contagem de casos, usuário, Administração, Sair) — todos
   no MESMO formato dos links de navegação (`.gestao-navlink`: ic-chip + rótulo, largura total),
   só variando se são clicáveis ou não (`.sidebar-static`: sem cursor de link, sem hover). */
.app-sidebar .gestao-navlink.sidebar-static{cursor:default}
.app-sidebar .gestao-navlink.sidebar-static:hover{background:transparent;color:rgba(255,255,255,.8)}
.app-sidebar .gestao-navlink.sidebar-user{align-items:center}
.app-sidebar .gestao-navlink.sidebar-user .user-chip-avatar{width:26px;height:26px;border-radius:50%;
  background:rgba(255,255,255,.16);color:#fff;font-size:10.5px;font-weight:800;display:flex;
  align-items:center;justify-content:center;flex-shrink:0}
.app-sidebar .gestao-navlink.sidebar-user .user-chip-info{display:flex;flex-direction:column;
  line-height:1.25;overflow:hidden}
.app-sidebar .gestao-navlink.sidebar-user .user-chip-info b{font-size:12.5px;color:#fff;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.app-sidebar .gestao-navlink.sidebar-user .user-chip-info small{font-size:11px;color:rgba(255,255,255,.65);
  font-weight:500}

/* Modo recolhido: some com rótulos de texto, mantém só ícones */
.app-shell.colapsada .navlink-label,
.app-shell.colapsada .sidebar-perfil,
.app-shell.colapsada .app-sidebar .gestao-resumo,
.app-shell.colapsada .app-sidebar .gestao-count{display:none}

.app-main{padding:26px 32px 60px}
@media(max-width:900px){.app-main{padding:20px 16px 48px}}
@media(max-width:760px){
  .app-sidebar{width:100% !important;height:auto;position:static;box-shadow:none}
}

/* Telas voltadas à comunidade escolar (perfil Demandante): painel em degradê
   vibrante envolvendo os cartões — convida sem pesar o resto do sistema, que
   segue no tom institucional para os demais 5 perfis. */
.public-page.inline{background:linear-gradient(165deg,var(--pub-a) 0%,var(--pub-b) 100%);
  border-radius:var(--radius-lg);padding:20px}

/* ---------- login (simulado) ---------- */
.login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;background:linear-gradient(165deg,var(--brand-900) 0%,var(--brand-700) 55%,var(--pub-b) 130%)}
.login-card{background:var(--paper);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
  padding:32px 28px;max-width:480px;width:100%}
.login-lista{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.login-usuario{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--radius);
  border:1px solid var(--line);background:#fff;cursor:pointer;text-align:left;width:100%;
  font:inherit;transition:background .12s,border-color .12s}
.login-usuario:hover{background:var(--brand-50);border-color:var(--brand-200)}
.login-avatar{width:36px;height:36px;border-radius:50%;background:var(--brand-600);color:#fff;
  font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.login-info{display:flex;flex-direction:column;flex:1;min-width:0}
.login-info b{font-size:14px;color:var(--ink-900)}
.login-info small{font-size:12px;color:var(--ink-500)}
.login-perfis{font-size:11.5px;color:var(--ink-400);text-align:right;max-width:130px}
.login-seta{color:var(--ink-300);flex-shrink:0}
@media(max-width:480px){.login-perfis{display:none}}
.login-divisor{display:flex;align-items:center;gap:10px;margin:18px 0 14px}
.login-divisor span{height:1px;background:var(--line);flex:1}
.login-divisor small{color:var(--ink-400)}

/* Assistente de relato em 4 passos (Demandante + canal público sem login). */
.wizard-card{max-width:none}
.wizard-progress{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.wizard-dots{display:flex;gap:5px}
.wizard-dot{width:20px;height:5px;border-radius:999px;background:var(--line-strong)}
.wizard-dot.on{background:var(--brand-600)}
.wizard-actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}

/* ---------- cards & primitives ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;margin:0 0 16px;box-shadow:var(--shadow-sm)}
.card h3{display:flex;align-items:center;gap:9px;margin:0 0 4px}
.card-sub{color:var(--ink-500);font-size:13.5px;margin:0 0 14px}

/* Rodapé fixo de "papel desta raia"/"como funciona"/"sobre o motor" — antes eram seções da
   sidebar que exigiam clicar pra ver; agora ficam sempre presentes no fim do conteúdo, em
   qualquer seção do perfil, já expandidas por padrão (<details open>) — o usuário pode recolher
   manualmente se quiser. Fundo suave na paleta do sistema (o mesmo --pub-bg/--brand-* usado na
   visão do Demandante), pra destacar como uma caixinha própria em vez de texto solto. */
.rodape-papel{margin-top:28px;border-radius:var(--radius-lg);border:1px solid var(--brand-200);
  background:linear-gradient(165deg,var(--pub-bg) 0%,var(--brand-50) 100%);
  padding:16px 18px;box-shadow:var(--shadow-sm)}
.rodape-papel summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;
  font-size:12.5px;font-weight:700;color:var(--brand-700);text-transform:uppercase;
  letter-spacing:.04em;user-select:none}
.rodape-papel summary::-webkit-details-marker{display:none}
.rodape-papel summary::before{content:"›";display:inline-block;transition:transform .12s;
  font-size:15px;color:var(--brand-500)}
.rodape-papel[open] summary::before{transform:rotate(90deg)}
.rodape-papel-corpo{margin-top:14px;font-size:13.8px;color:var(--ink-700);max-width:640px}
.rodape-papel-corpo p{margin:0 0 10px}
.rodape-papel-corpo .dica{font-size:12.5px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;font:inherit;
  font-size:14px;font-weight:700;border-radius:var(--radius-sm);border:1.5px solid transparent;
  cursor:pointer;text-decoration:none;line-height:1.2;
  transition:background .12s,border-color .12s,opacity .12s,transform .12s,box-shadow .12s}
.btn-primary{background:var(--brand-700);border-color:var(--brand-700);color:#fff;
  box-shadow:0 3px 10px rgba(20,54,80,.22)}
.btn-primary:hover{background:var(--brand-800);transform:translateY(-1px);box-shadow:0 6px 16px rgba(20,54,80,.28)}
.btn-secondary{background:#fff;border-color:var(--brand-100);color:var(--brand-700)}
.btn-secondary:hover{background:var(--brand-50);border-color:var(--brand-700)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-500)}
.btn-ghost:hover{background:var(--neutral-bg)}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-warm{background:var(--brand-700);border-color:var(--brand-700);color:#fff;
  box-shadow:0 3px 10px rgba(20,54,80,.22)}
.btn-warm:hover{background:var(--brand-800);transform:translateY(-1px);box-shadow:0 6px 16px rgba(20,54,80,.28)}
.btn[disabled]{background:#dfe4ea;border-color:#dfe4ea;color:#98a1ad;cursor:not-allowed}
.btn.block{width:100%;justify-content:center}
.acoes{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}

/* Nas telas públicas, o botão primário segue o mesmo azul sólido do resto do
   sistema (sem o degradê pêssego/navy que havia antes). */
.public-page .card .btn-primary[disabled]{background:#dfe4ea;box-shadow:none;transform:none;filter:none}

/* "Chips" dos cenários prontos — mais convidativos que um botão cinza padrão. */
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:999px;
  border:1.5px solid var(--pub-a);color:var(--pub-a-dark);background:#fff;font:inherit;
  font-size:13.5px;font-weight:700;cursor:pointer;transition:background .12s,color .12s}
.chip:hover{background:var(--pub-a);color:#fff}

/* Termos de regra do motor (admin) — chip fechável, distinto do .chip de cenários. */
.termos-lista{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 0}
.termo-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 8px 5px 12px;
  border-radius:999px;background:var(--brand-50,#f3effc);color:var(--brand-700,#4c2a91);
  font-size:13px;font-weight:600;border:1px solid var(--brand-200,#ded2f7)}
.termo-chip button{display:inline-flex;align-items:center;justify-content:center;
  background:none;border:none;padding:2px;cursor:pointer;color:inherit;opacity:.65;
  border-radius:999px}
.termo-chip button:hover{opacity:1;background:rgba(0,0,0,.08)}

/* ---------- badges & alerts ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;
  font-size:12.5px;font-weight:700;border:1px solid}
.badge-alta{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-line)}
.badge-media{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.badge-baixa{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.badge-neutro{background:var(--neutral-bg);color:var(--neutral);border-color:var(--neutral-line)}
.sinais-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}

/* Linha selecionada numa tabela de fila (Recepção/Profissional/Sistema/Instâncias multi-caso). */
.fila-linha-ativa{background:var(--brand-50)}
.fila-linha-ativa td{border-top-color:var(--brand-200);border-bottom-color:var(--brand-200)}

.alert{display:flex;gap:11px;border-radius:var(--radius);padding:13px 15px;font-size:13.8px;
  margin:0 0 16px;border:1px solid}
.alert .ic{flex-shrink:0;margin-top:1px}
.alert-info{background:var(--info-bg);border-color:var(--info-line);color:var(--brand-800)}
.alert-warn{background:var(--warn-bg);border-color:var(--warn-line);color:#5c3d00}
.alert-danger{background:var(--danger-bg);border-color:var(--danger-line);color:#6e1b17}
.alert-ok{background:var(--ok-bg);border-color:var(--ok-line);color:#12432b}
.alert b{font-weight:700}

/* Caixinha de acolhimento — mensagens que humanizam o sistema (não status operacional, que
   continua em .alert). Cor sólida (não degradê) da paleta vibrante da visão do Demandante —
   usuários reclamaram que o degradê violeta/ciano dificultava a leitura do texto branco por
   cima; uma cor só resolve o contraste e mantém a identidade visual em qualquer perfil. */
.acolhimento-box{display:flex;gap:13px;align-items:flex-start;border-radius:var(--radius-lg);
  padding:16px 18px;margin:0 0 16px;color:#fff;
  background:var(--pub-a-dark);
  box-shadow:0 8px 20px -8px rgba(91,33,182,.45)}
.acolhimento-ic{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.24);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.acolhimento-corpo{font-size:13.8px;line-height:1.55}
.acolhimento-corpo b{font-weight:700}

.sugestao{background:linear-gradient(180deg,var(--brand-50),#fff);border:1px solid var(--brand-200);
  border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}

/* Atualização UX — IA ganha protagonismo visual sem virar decisora.
   O destaque diferencia "resultado da IA" das demais caixas operacionais. */
.ia-protagonista{background:linear-gradient(135deg,#f7f3ff 0%,#fff9f4 100%);
  border:1px solid var(--brand-200);border-left:5px solid var(--brand-600);
  border-radius:var(--radius-lg);padding:18px 20px;margin:0 0 16px;box-shadow:var(--shadow)}
.ia-protagonista-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.ia-protagonista-titulo{display:flex;align-items:center;gap:9px;color:var(--brand-700);
  font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.ia-protagonista-icone{width:34px;height:34px;border-radius:10px;background:var(--brand-600);
  color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ia-protagonista .tile{background:rgba(255,255,255,.88)}
.ia-protagonista .recomendacao-principal{margin-top:14px;background:#fff8f3;
  border:1px solid #efd4c8;border-left:4px solid var(--pub-c);border-radius:var(--radius);padding:14px 15px}
.ia-protagonista .recomendacao-principal h4{font-size:15px;margin:0 0 5px;color:#7d453c}
.ia-regra{font-size:12.5px;color:var(--ink-500);margin:10px 0 0}
.menu-grupo{padding:12px 10px 5px;font-size:10px;font-weight:800;color:rgba(255,255,255,.56);
  text-transform:uppercase;letter-spacing:.09em}
.app-shell.colapsada .menu-grupo{display:none}
.sugestao .rotulo{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--brand-700);font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.par{display:flex;flex-wrap:wrap;gap:10px 30px;margin:6px 0 4px}
.porque{font-size:13px;color:var(--ink-500);border-top:1px dashed var(--brand-200);
  margin-top:12px;padding-top:10px}
.porque ul{margin:6px 0 0;padding-left:18px}

/* Insights sugeridos de tratamento — mesma família visual de .porque (explicabilidade), com um
   leve destaque em --ok (verde) pra diferenciar "por que a sugestão apareceu" de "o que
   considerar fazer a respeito", sem virar uma cor de decisão/aprovação. */
.insights-tratamento{font-size:13px;color:var(--ink-700);border-top:1px dashed var(--ok-line);
  margin-top:12px;padding-top:10px}
.insights-tratamento b{display:flex;align-items:center;gap:7px;color:#12432b}
.insights-tratamento ul{margin:6px 0 10px;padding-left:18px}
.insights-tratamento li{margin-bottom:3px}

/* Caixa de citação do relato analisado (dentro de .sugestao) — reusa .sugestao .rotulo pro
   label "Relato analisado" (herdado por seletor, sem precisar repetir a regra). */
.quote-relato{background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:12px 14px;margin:2px 0 14px}

/* Passos numerados mini (protocolo recomendado / insights de tratamento) — reusa o círculo
   .step-n já usado no número grande de cada StepCard, só que numa lista interna menor. */
.mini-steps{display:grid;gap:9px;margin:8px 0 10px}
.mini-step{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.mini-step .step-n{margin-top:1px}

/* Bloco de correlação com outros casos (Atualização 10) — mesma família visual de .porque
   (explicabilidade), cor neutra por não ser nem "por que apareceu" nem "o que fazer". */
.bloco-correlacao{font-size:13px;color:var(--ink-700);border-top:1px dashed var(--line-strong);
  margin-top:12px;padding-top:10px}
.bloco-correlacao b{display:flex;align-items:center;gap:7px;color:var(--ink-900)}

/* ---------- forms ---------- */
.ident-box{border-top:1px dashed var(--line-strong);margin-top:4px;padding-top:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13.5px;font-weight:700;margin:0 0 5px;color:var(--ink-700)}
.field .dica{font-size:12.5px;color:var(--ink-400);margin-top:5px}
textarea,input[type=text],input[type=date],input[type=email],input[type=password],select{width:100%;padding:10px 12px;font:inherit;font-size:14.5px;
  border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:#fff;color:var(--ink-900)}
textarea{min-height:118px;resize:vertical;font-family:inherit}
textarea:focus,input[type=text]:focus,input[type=date]:focus,input[type=email]:focus,input[type=password]:focus,select:focus{outline:2px solid var(--brand-500);
  outline-offset:1px;border-color:var(--brand-500)}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%235b6675'><path d='M5.5 7.5l4.5 4.5 4.5-4.5'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;padding-right:32px}

/* Campo de busca por protocolo — reaproveitado em toda listagem/fila do sistema. */
.campo-busca{position:relative;margin-bottom:14px;max-width:420px}
.campo-busca svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-400);pointer-events:none}
.campo-busca input{padding-left:36px}

/* Campo de senha com botão de mostrar/ocultar — login, cadastro, redefinir senha. */
.campo-senha{position:relative}
.campo-senha input{padding-right:38px}
.campo-senha-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);
  background:none;border:none;padding:6px;border-radius:6px;cursor:pointer;
  color:var(--ink-400);display:flex;align-items:center;justify-content:center}
.campo-senha-toggle:hover{color:var(--brand-600);background:var(--brand-50)}

/* ---------- table ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.8px}
.tbl th,.tbl td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl th{background:var(--brand-50);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--ink-500);font-weight:700}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .1s}
.tbl tbody tr:hover{background:var(--brand-200)}

/* ---------- checklist ---------- */
.checklist{list-style:none;padding:0;margin:0}
.checklist li{border-bottom:1px solid var(--line);padding:11px 0}
.checklist li:last-child{border-bottom:0}
.checklist label{display:flex;gap:11px;align-items:flex-start;font-weight:500;margin:0;
  cursor:pointer;font-size:14px}
.checklist input{margin-top:3px;flex-shrink:0;width:17px;height:17px;accent-color:var(--brand-700)}

/* ---------- timeline ---------- */
.timeline{list-style:none;margin:0;padding:0 0 0 22px;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 20px 18px}
.timeline li::before{content:"";position:absolute;left:-29px;top:4px;width:12px;height:12px;
  border-radius:50%;background:var(--brand-600);border:3px solid var(--paper);box-shadow:0 0 0 1px var(--line)}
.timeline .quando{font-size:12px;color:var(--ink-400);margin-bottom:2px}
.timeline b{font-size:14px}
.timeline li.timeline-pendente{opacity:.45}
.timeline li.timeline-pendente::before{background:var(--ink-300)}

/* ---------- passos por perfil ---------- */
.step-n{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
  border-radius:50%;background:var(--brand-100);color:var(--brand-700);font-size:12px;
  font-weight:800;flex-shrink:0}
.step-bloqueado .step-body,.step-na .step-body{opacity:.55}
.step-bloqueado .btn,.step-na .btn{pointer-events:none}

/* Interface em abas dos 8 passos — usada só pelo perfil Gestor do Caso por enquanto. Estilo
   "célula de planilha": cantos retos, sem espaço entre uma aba e outra — só uma borda divisória
   fina entre células, com um contorno único em volta de toda a barra (igual a border-collapse de
   tabela). Se a tela for estreita demais pras 8 caberem, rola na horizontal em vez de quebrar
   linha. Cantos arredondados só na barra inteira (overflow:hidden recorta as células das pontas
   no formato do contorno) — as divisórias internas entre células continuam retas. */
.abas-passo{display:flex;flex-wrap:nowrap;margin:0 0 16px;
  border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden}
.aba-passo{display:flex;flex:1 1 0;min-width:64px;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;padding:10px 4px;font:inherit;font-size:11.5px;font-weight:700;
  color:var(--brand-700);background:var(--paper);border:none;border-left:1px solid var(--line-strong);
  cursor:pointer;text-align:center;position:relative;transition:background .12s,color .12s}
.aba-passo:first-child{border-left:none}
.aba-passo:hover:not(:disabled):not(.ativa){background:var(--brand-50)}
.aba-passo-concluido:not(.ativa){background:var(--brand-100)}
.aba-passo.ativa{color:#fff;background:var(--brand-600)}
.aba-passo:disabled{opacity:.5;cursor:not-allowed}
.aba-passo-check{position:absolute;top:3px;right:3px;background:var(--ok);color:#fff;
  border-radius:50%;width:14px;height:14px;display:flex;align-items:center;justify-content:center}
.aba-passo-label{white-space:normal;line-height:1.2}

/* Geração manual da linha de protocolo sugerida pela IA (passo 3 do Gestor do Caso) — botão com
   cara de IA + animação de "processamento" enquanto simula a geração, pra deixar visível que
   tem IA rodando ali (em vez da sugestão só aparecer pronta, sem nenhum sinal de processamento). */
.btn-ia{background:var(--brand-700);border-color:var(--brand-700);color:#fff;
  box-shadow:0 3px 10px rgba(20,54,80,.22)}
.btn-ia:hover{background:var(--brand-800);box-shadow:0 6px 16px rgba(20,54,80,.28)}
.btn-ia svg{transition:transform .3s ease}
.btn-ia:hover svg{transform:scale(1.2) rotate(15deg)}
.ia-processando-corpo{display:flex;align-items:center;gap:16px;padding:2px 0 4px}
.ia-processando-icone{position:relative;display:flex;align-items:center;justify-content:center;
  width:44px;height:44px;border-radius:50%;flex-shrink:0;color:#fff;
  background:linear-gradient(135deg,var(--pub-a),var(--pub-c));
  box-shadow:0 4px 16px -3px rgba(124,58,237,.6)}
.ia-processando-icone svg{position:relative;z-index:1;animation:ia-brilho 1.4s ease-in-out infinite}
.ia-processando-icone::before,.ia-processando-icone::after{content:"";position:absolute;inset:0;
  border-radius:50%;border:2px solid var(--pub-a);animation:ia-anel 1.8s ease-out infinite}
.ia-processando-icone::after{animation-delay:.6s;border-color:var(--pub-c)}
@keyframes ia-anel{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.1);opacity:0}}
@keyframes ia-brilho{
  0%,100%{transform:scale(.85) rotate(-12deg);opacity:.85}
  50%{transform:scale(1.15) rotate(12deg);opacity:1}
}
.ia-processando-info{flex:1;min-width:0}
.ia-processando-texto{font-size:13.5px;font-weight:600;color:var(--brand-700);margin-bottom:8px}
.ia-processando-barra{position:relative;height:5px;border-radius:999px;background:var(--brand-100);
  overflow:hidden;max-width:280px}
.ia-processando-fill{position:absolute;top:0;left:0;height:100%;width:35%;border-radius:999px;
  background:linear-gradient(90deg,var(--brand-500),var(--brand-700));
  animation:ia-varredura 1.1s ease-in-out infinite}
@keyframes ia-varredura{0%{transform:translateX(-100%)}100%{transform:translateX(385%)}}

/* Insights para ações complementares — mesmo padrão do botão/animação de IA acima, mas com uma
   cor própria (ciano/azul em vez de roxo/rosa) pra deixar claro que é uma ação INDEPENDENTE do
   "Gerar protocolo": o protocolo é a linha aplicável ao caso, os insights são ações extras que
   podem (ou não) ser aplicadas. */
.btn-ia-insights{background:linear-gradient(120deg,var(--pub-b),var(--brand-700));border-color:transparent;color:#fff}
.btn-ia-insights:hover{filter:brightness(1.08)}
.btn-ia-insights svg{transition:transform .3s ease}
.btn-ia-insights:hover svg{transform:scale(1.2) rotate(15deg)}
.ia-processando-icone-insights{background:linear-gradient(135deg,var(--pub-b),var(--brand-700));
  box-shadow:0 4px 16px -3px rgba(6,182,212,.6)}
.ia-processando-icone-insights::before,.ia-processando-icone-insights::after{border-color:var(--pub-b)}
.ia-processando-icone-insights::after{border-color:var(--brand-700)}
.ia-processando-fill-insights{background:linear-gradient(90deg,var(--pub-b),var(--brand-700))}

/* ---------- maturity bars ---------- */
.maturity-row{display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.maturity-row:last-child{border-bottom:0}
.maturity-label{width:190px;flex-shrink:0;font-size:13.5px;font-weight:600;color:var(--ink-700)}
.maturity-track{flex:1;height:9px;border-radius:99px;background:var(--neutral-bg);overflow:hidden}
.maturity-fill{height:100%;border-radius:99px}
.maturity-n{width:26px;text-align:right;font-size:12.5px;font-weight:700;color:var(--ink-500)}

/* ---------- indicator tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:6px}
.tile{border:1px solid var(--line);border-top:3px solid var(--brand-500);border-radius:var(--radius);
  padding:14px 16px;background:#fff}
.tile .n{font-size:24px;font-weight:800;color:var(--ink-900);letter-spacing:-.02em}
.tile .lbl{font-size:12px;color:var(--ink-500);margin-top:2px}

/* ---------- modal (padrão único para avisos e detalhamento de casos) ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(20,54,80,.45);backdrop-filter:blur(1.5px);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;animation:fade .15s ease-out}
.modal-panel{background:var(--paper);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
  max-width:640px;width:100%;max-height:88vh;overflow-y:auto;animation:modal-in .16s ease-out}
.modal-panel.wide{max-width:840px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;
  background:var(--paper);border-radius:var(--radius-lg) var(--radius-lg) 0 0;z-index:1}
.modal-head h3{margin:0}
.modal-close{background:transparent;border:0;color:var(--ink-400);cursor:pointer;padding:4px;
  border-radius:8px;display:flex;flex-shrink:0}
.modal-close:hover{background:var(--neutral-bg);color:var(--ink-900)}
.modal-body{padding:18px 20px 22px}
.modal-body .card{box-shadow:none;border:1px solid var(--line)}
@keyframes modal-in{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}

.btn-icon{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
  border-radius:var(--radius-sm);border:1px solid var(--line-strong);background:#fff;
  color:var(--brand-700);cursor:pointer;transition:background .12s,border-color .12s}
.btn-icon:hover{background:var(--brand-50);border-color:var(--brand-200)}

/* ---------- misc ---------- */
.proto-num{font-size:30px;font-weight:800;letter-spacing:.03em;color:var(--brand-700);margin:2px 0 16px}
.spinner{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;display:inline-block;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-in{animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

.rodape{max-width:var(--content-w);margin:10px auto 0;padding:16px 26px;font-size:12px;color:var(--ink-400)}
.rodape a{color:var(--ink-400)}

@media(max-width:880px){
  .profile-content{padding:18px 16px 70px}
  .maturity-label{width:130px;font-size:12.5px}
}
@media(max-width:560px){
  .acoes .btn{flex:1 1 100%;justify-content:center}
  .profile-nav-top{padding:10px 14px 6px}
  .impersona{padding:0 14px 10px}
  .impersona select{max-width:100%}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>

/* ============================================================== motor de regras
   Portado 1:1 de MGBE_prototipo.html (protótipo de baixa fidelidade) e de
   fluxo_mgbe.md. Regras explícitas por palavra-chave, NÃO é modelo de
   aprendizado de máquina — a explicabilidade exigida pelo artigo (seção 5.4)
   depende disso ficar visível e verificável. Não alterar o comportamento
   aqui: esta versão só muda a fidelidade visual/interação. */
const PRAZO = { Alta: "24 horas", Média: "72 horas", Baixa: "5 dias úteis" };

const REGRAS = [
  { id: "fisica", rotulo: "Agressão física",
    termos: ["bater", "bateu", "empurr", "chute", "chutou", "soco", "socou", "agred", "machuc", "puxou o cabelo"] },
  { id: "verbal", rotulo: "Agressão verbal",
    termos: ["xing", "apelido", "humilh", "zoa", "zoar", "insult", "chamam de", "chamaram de", "ridiculariz"] },
  { id: "exclusao", rotulo: "Exclusão social",
    termos: ["exclu", "isol", "ignor", "deixam de fora", "deixaram de fora", "ninguém fala", "sozinh"] },
  { id: "digital", rotulo: "Cyberbullying",
    termos: ["grupo do", "whatsapp", "instagram", "print", "postaram", "postou", "compartilh", "vídeo", "video", "internet", "online", "rede social"] },
  { id: "ameaca", rotulo: "Ameaça",
    termos: ["ameaç", "ameac", "vai apanhar", "esperar na saída", "esperando na saída", "matar", "bater depois"] }
];
const RECORRENCIA = ["sempre", "todo dia", "todos os dias", "toda semana", "de novo", "várias vezes", "varias vezes", "direto", "sempre que", "repetid"];
const AMBIENTES = ["sala", "recreio", "pátio", "patio", "banheiro", "corredor", "quadra", "ônibus", "onibus", "saída", "saida", "refeitório", "refeitorio"];

/* ============================================================== gestão manual das palavras-chave
   REGRAS/RECORRENCIA/AMBIENTES continuam sendo o que analisar() lê diretamente — não viraram
   estado React, porque não precisam: são mutadas no lugar (push/splice), então analisar() já
   enxerga a mudança na próxima chamada, sem precisar passar nada por parâmetro. As funções
   abaixo só existem para a tela de administração editar com validação (sem duplicar termos,
   sem entrada vazia); quem chama essas funções depois força um re-render da PRÓPRIA tela via um
   contador de versão em estado — o motor de análise em si não precisa disso. */
function regrasAdicionarTermo(categoriaId, termoBruto) {
  const cat = REGRAS.find(r => r.id === categoriaId);
  const termo = (termoBruto || "").trim().toLowerCase();
  if (!termo) { showAviso("Escreva um termo antes de adicionar."); return false; }
  if (cat.termos.includes(termo)) { showAviso("Esse termo já existe nessa categoria."); return false; }
  cat.termos.push(termo);
  return true;
}
function regrasRemoverTermo(categoriaId, termo) {
  const cat = REGRAS.find(r => r.id === categoriaId);
  cat.termos = cat.termos.filter(t => t !== termo);
}
function regrasAdicionarCategoria(rotuloBruto) {
  const rotulo = (rotuloBruto || "").trim();
  if (!rotulo) { showAviso("Escreva o nome da categoria antes de adicionar."); return false; }
  REGRAS.push({ id: "cat-" + Date.now(), rotulo, termos: [] });
  return true;
}
function regrasRemoverCategoria(categoriaId) {
  const idx = REGRAS.findIndex(r => r.id === categoriaId);
  if (idx >= 0) REGRAS.splice(idx, 1);
}
function listaAdicionarTermo(lista, termoBruto) {
  const termo = (termoBruto || "").trim().toLowerCase();
  if (!termo) { showAviso("Escreva um termo antes de adicionar."); return false; }
  if (lista.includes(termo)) { showAviso("Esse termo já existe na lista."); return false; }
  lista.push(termo);
  return true;
}
function listaRemoverTermo(lista, termo) {
  const idx = lista.indexOf(termo);
  if (idx >= 0) lista.splice(idx, 1);
}

function analisar(texto) {
  const t = (texto || "").toLowerCase();
  const achados = [];
  REGRAS.forEach(r => {
    const hits = r.termos.filter(x => t.includes(x));
    if (hits.length) achados.push({ id: r.id, rotulo: r.rotulo, termos: hits });
  });
  const recorrencia = RECORRENCIA.filter(x => t.includes(x));
  const ambientes = AMBIENTES.filter(x => t.includes(x));

  const tem = id => achados.some(a => a.id === id);
  let prioridade = "Baixa", motivo = "Nenhum elemento de urgência identificado pelas regras.";
  if (tem("ameaca")) { prioridade = "Alta"; motivo = "Menção compatível com ameaça."; }
  else if (tem("fisica")) { prioridade = "Alta"; motivo = "Menção compatível com agressão física."; }
  else if (tem("digital") && recorrencia.length) { prioridade = "Alta"; motivo = "Indício de cyberbullying somado a relato de repetição."; }
  else if (recorrencia.length) { prioridade = "Média"; motivo = "Relato menciona repetição da situação."; }
  else if (achados.length) { prioridade = "Média"; motivo = "Elementos compatíveis com bullying, sem indício de repetição."; }

  // Rótulo alinhado ao vocabulário do artigo MGBE-IA §6.2: quando as regras não encontram
  // achados de bullying/cyberbullying, o resultado é tratado como uma categoria própria
  // ("outra violência ou conflito"), não como ausência de classificação.
  const categoria = achados.length ? achados.map(a => a.rotulo).join(" + ") : "Outra violência ou conflito (não classificado pelas regras)";
  return { categoria, prioridade, motivo, achados, recorrencia, ambientes };
}

function esc(s) { return (s || "").replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c])); }

// Máscara progressiva de telefone brasileiro: (XX)XXXXXXXXX (DDD + até 9 dígitos, sem separador).
function mascararTelefone(v) {
  const d = (v || "").replace(/\D/g, "").slice(0, 11);
  if (!d) return "";
  if (d.length <= 2) return "(" + d;
  return "(" + d.slice(0, 2) + ")" + d.slice(2);
}

function destacar(texto, a) {
  const termos = [...a.achados.flatMap(x => x.termos), ...a.recorrencia, ...a.ambientes]
    .sort((x, y) => y.length - x.length);
  let saida = esc(texto);
  termos.forEach(t => {
    const rx = new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "[\\wçãáéíóúâêôõà]*)", "gi");
    saida = saida.replace(rx, m => (m.includes("<mark>") ? m : "<mark>" + m + "</mark>"));
  });
  return saida;
}

function porqueHTML(a) {
  let h = "<b>Por que esta sugestão apareceu</b><ul>";
  a.achados.forEach(x => (h += "<li>Regra <b>" + x.rotulo + "</b> — termos encontrados: " +
    x.termos.map(t => "<mark>" + t + "</mark>").join(", ") + "</li>"));
  if (a.recorrencia.length) h += "<li>Indício de <b>repetição</b>: " + a.recorrencia.map(t => "<mark>" + t + "</mark>").join(", ") + "</li>";
  if (a.ambientes.length) h += "<li>Ambiente mencionado: " + a.ambientes.map(t => "<mark>" + t + "</mark>").join(", ") + "</li>";
  if (!a.achados.length && !a.recorrencia.length) h += "<li>Nenhuma regra foi disparada. A triagem humana é a única fonte de classificação neste caso.</li>";
  h += "<li>Prioridade sugerida: " + a.motivo + "</li></ul>" +
    '<p style="margin:8px 0 0">Motor de <b>regras explícitas por palavra-chave</b>. Não é modelo de ' +
    "aprendizado de máquina — a classificação por PLN treinado entra na fase seguinte.</p>";
  return h;
}

/* "Sinais" qualitativos de triagem (inspirados no Safe School AI, ver plano "Atualização 5") —
   deriváveis do que analisar() já calcula, sem lógica nova nem prejuízo à explicabilidade por
   regra: é só uma leitura resumida do mesmo achados/recorrencia/ambientes que porqueHTML() já
   detalha por extenso. Não inclui "intencionalidade aparente"/"desequilíbrio de poder" do
   original por não terem base clara e explicável no motor de palavra-chave atual. */
function SinaisTriagem({ a }) {
  const sinais = [
    { label: "Possível repetição", presente: a.recorrencia.length > 0 },
    { label: "Componente digital", presente: a.achados.some(x => x.id === "digital") },
    { label: "Múltiplos ambientes mencionados", presente: a.ambientes.length > 1 }
  ];
  return html`<div class="sinais-row">
    ${sinais.map(s => html`<span key=${s.label} class=${"badge " + (s.presente ? "badge-media" : "badge-neutro")}>
      <${Icon} name=${s.presente ? "check-circle" : "x-circle"} size=${12} />${s.label}</span>`)}
  </div>`;
}

/* Insights sugeridos de tratamento — NÃO é decisão, é uma leitura a mais sobre o que o
   Profissional Responsável pode considerar (mesmo princípio "sistema sugere, profissional
   decide" já usado em porqueHTML()/SinaisTriagem). Os 4 TIPOS de medida (pedagógica,
   psicológica, disciplinar, encaminhamento externo) vêm do pré-projeto (Quadro 2, etapa
   "Intervenção") — mas qual tipo sugerir para cada categoria detectada é proposta do protótipo,
   igual às próprias categorias e termos do motor de regras (ver produto/procedencia_e_manual.md).
   Não é uma escala validada nem um protocolo institucional pronto. */
const ACOES_POR_CATEGORIA = {
  fisica: ["Medida disciplinar imediata, conforme o regimento escolar", "Comunicação à família e, se cabível, encaminhamento externo (Conselho Tutelar ou autoridade policial)"],
  verbal: ["Medida pedagógica: mediação de conflito entre as partes envolvidas", "Orientação sobre respeito e convivência com a turma"],
  exclusao: ["Medida pedagógica: atividades de integração e pertencimento com a turma", "Acompanhamento psicológico da pessoa possivelmente afetada"],
  digital: ["Orientação sobre uso responsável de redes sociais e ambientes digitais", "Encaminhamento externo se houver conteúdo ilegal ou ameaça associada"],
  ameaca: ["Encaminhamento externo (Conselho Tutelar, Polícia Civil ou Ministério Público, conforme a gravidade)", "Medida de proteção imediata e comunicação à família"]
};
function sugerirTratamento(a) {
  const sugestoes = [];
  a.achados.forEach(x => (ACOES_POR_CATEGORIA[x.id] || []).forEach(s => { if (!sugestoes.includes(s)) sugestoes.push(s); }));
  if (a.recorrencia.length) sugestoes.push("Acompanhamento psicológico continuado — o relato traz indício de repetição");
  return sugestoes;
}
function InsightsTratamento({ a }) {
  const sugestoes = sugerirTratamento(a);
  if (!sugestoes.length) return null;
  return html`<div class="insights-tratamento">
    <b><${Icon} name="clipboard-check" size=${14} /> Insights para ações complementares</b>
    <div class="mini-steps">
      ${sugestoes.map((s, i) => html`<div class="mini-step" key=${i}>
        <span class="step-n">${i + 1}</span><span>${s}</span>
      </div>`)}
    </div>
    <p class="dica">Sugestão derivada das mesmas regras de palavra-chave — não é uma decisão nem
      um protocolo institucional pronto. Baseada nos tipos de medida do pré-projeto (pedagógica,
      psicológica, disciplinar, encaminhamento externo); a ligação com a categoria detectada é
      proposta do protótipo, não uma escala validada. Quem decide o encaminhamento é sempre o
      Gestor do Caso.</p>
  </div>`;
}

/* Confiança da análise e correlação com outros casos — Atualização 10, inspirada num mock de
   referência ("Resultado da Análise Inteligente"). NÃO é IA/ML: são heurísticas e contagens
   explicáveis sobre o que analisar() já deriva e sobre os próprios casos/arquivados do sistema —
   mesmo espírito de honestidade do resto do motor (nunca fingir uma precisão estatística que o
   motor de regras não tem). */
function calcularConfianca(a, sel) {
  const sinais = [a.achados.length > 0, a.recorrencia.length > 0, a.ambientes.length > 0,
    !!sel.local, !!sel.quando, !!(sel.pessoaAfetada || sel.pessoasMencionadas)];
  const presentes = sinais.filter(Boolean).length;
  const pct = Math.round(15 + (presentes / sinais.length) * 80); // nunca 0% nem 100% — o motor nunca tem certeza absoluta nem ausência total de sinal
  const motivo = presentes <= 1
    ? "Poucos sinais disponíveis — relato curto e com poucos campos preenchidos."
    : presentes <= 3
      ? "Alguns sinais disponíveis, mas ainda vale complementar informações."
      : "Vários sinais convergentes — relato com bom nível de detalhe.";
  return { pct, motivo };
}

/* Correlação com outros casos: pessoa mencionada (tokens ≥4 letras em pessoaAfetada/
   pessoasMencionadas), mesma turma (identificacaoDados.turma) e casos com categoria em comum
   dentro de 90 dias de enviadoEm. `null` num campo = o caso atual não informou aquele dado (não
   é o mesmo que "zero correlações encontradas") — evita fingir uma contagem sobre dado ausente. */
function correlacionarCaso(sel, casos, arquivados, a) {
  const outros = [...casos, ...arquivados].filter(c => c !== sel && c.protocolo !== sel.protocolo);
  const normaliza = s => (s || "").toLowerCase().trim();
  const tokensRelevantes = s => normaliza(s).split(/[\s,.;]+/).filter(t => t.length >= 4);

  const tokensPessoa = [...tokensRelevantes(sel.pessoaAfetada), ...tokensRelevantes(sel.pessoasMencionadas)];
  const pessoaMencionada = tokensPessoa.length
    ? outros.filter(c => {
        const alvo = normaliza(c.pessoaAfetada) + " " + normaliza(c.pessoasMencionadas);
        return tokensPessoa.some(t => alvo.includes(t));
      }).length
    : null;

  const turma = sel.identificacaoDados && sel.identificacaoDados.turma;
  const turmaSerie = turma
    ? outros.filter(c => c.identificacaoDados && normaliza(c.identificacaoDados.turma) === normaliza(turma)).length
    : null;

  const categoriasSel = new Set(a.achados.map(x => x.id));
  const temCategoria = categoriasSel.size > 0;
  const dias90 = 90 * 24 * 60 * 60 * 1000;
  const dataSel = sel.enviadoEm ? new Date(sel.enviadoEm).getTime() : null;
  const casosSimilares = !temCategoria ? 0 : outros.filter(c => {
    if (!c.relato) return false;
    if (dataSel && c.enviadoEm && Math.abs(new Date(c.enviadoEm).getTime() - dataSel) > dias90) return false;
    return analisar(c.relato).achados.some(x => categoriasSel.has(x.id));
  }).length;
  const similaridade = !temCategoria ? "Não avaliável"
    : casosSimilares === 0 ? "Nenhuma" : casosSimilares === 1 ? "Baixa" : casosSimilares <= 3 ? "Moderada" : "Alta";

  return { pessoaMencionada, turmaSerie, casosSimilares, similaridade, temCategoria };
}

function quando(iso) {
  const d = iso ? new Date(iso) : new Date();
  return d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
}
function toneFor(p) { return p === "Alta" ? "alta" : p === "Média" ? "media" : "baixa"; }
function seloHTML(p) { return '<span class="badge badge-' + toneFor(p) + '">' + p + "</span>"; }

/* ============================================================== detalhamento completo do caso
   Junta TODOS os eventos do caso (registro, recepção, validação, tratamento, pareceres e seus
   registros de acompanhamento, reavaliação, encerramento, arquivamento) numa única linha do
   tempo em ordem cronológica — usado tanto no caso ativo (Gestão > Casos em acompanhamento)
   quanto no detalhe de um caso arquivado, para nunca faltar informação. */
// Aceita tanto casos no formato v2 (encaminhamento/cienciaEm/equipeConcluidaEm/
// decisaoInstitucional) quanto o formato antigo dos SEED_ARQUIVADOS estáticos
// (recebidoEm/protocoloAplicado/reavaliacao) — os dois convivem: casos novos nunca têm os
// campos antigos, os seeds nunca têm os novos, mas a linha do tempo precisa exibir ambos.
function construirLinhaCompleta(kase) {
  const itens = [];
  if (kase.enviadoEm) itens.push({ em: kase.enviadoEm, titulo: "Relato registrado" + (kase.protocolo ? " — protocolo " + kase.protocolo : ""),
    detalhe: (kase.identificacao === "anonimo" ? "Identificação: anônimo." :
      "Identificação: identificado" + (kase.identificacaoDados ? " — " + esc(kase.identificacaoDados.nome) + " (" + esc(kase.identificacaoDados.vinculo) + ")" : "") + ".") +
      (kase.protocolo ? " Protocolo gerado automaticamente pelo Sistema MGBE-IA." : "") });
  if (kase.recebidoEm) itens.push({ em: kase.recebidoEm, titulo: "Ocorrência recebida",
    detalhe: "Recebido e protocolado pela Recepção da Escola." });
  if (kase.cienciaEm) itens.push({ em: kase.cienciaEm, titulo: "Ciência tomada pelo Gestor do Caso",
    detalhe: "Análise da IA revisada." });
  if (kase.validacao && kase.validacao.em) itens.push({ em: kase.validacao.em, titulo: "Classificação validada",
    detalhe: esc(kase.validacao.categoria) + " · " + kase.validacao.prioridade +
      (kase.validacao.alterado ? " (sugestão da IA corrigida" : " (sugestão da IA confirmada") + " pelo Gestor do Caso) · Responsável designado: " + kase.validacao.responsavel + "." });
  if (kase.encaminhamento) { const RL = { tratar: "Tratar diretamente", equipe: "Atribuir à Equipe de Apoio", escalonar: "Escalonar para Gestão Escolar", encerrar: "Encerrar com justificativa" };
    itens.push({ em: kase.encaminhamento.em, titulo: "Encaminhamento decidido",
      detalhe: "Decisão do Gestor do Caso: <b>" + RL[kase.encaminhamento.decisao] + "</b>." }); }
  if (kase.urgencia) itens.push({ em: kase.urgencia.em, titulo: "Rede de Proteção acionada",
    detalhe: "Caso Crítico/Urgente — acionado pelo Gestor do Caso." });
  if (kase.comunicacaoResponsaveis) { const cr = kase.comunicacaoResponsaveis;
    const INF = { presencial: "Sim, presencialmente", telefone: "Sim, por telefone", nao: "Não" + (cr.motivoNaoInformados ? " — " + esc(cr.motivoNaoInformados) : "") };
    itens.push({ em: cr.em, titulo: "Comunicação com responsáveis registrada",
      detalhe: "Informados: <b>" + INF[cr.informados] + "</b>. Concordaram com os encaminhamentos: <b>" +
        (cr.concordaramEncaminhamentos ? "Sim" : "Não" + (cr.motivoDiscordancia ? " — " + esc(cr.motivoDiscordancia) : "")) +
        "</b>. Orientados a registrar Boletim de Ocorrência: <b>" +
        (cr.orientadosBO ? "Sim" : "Não" + (cr.motivoBO ? " — " + esc(cr.motivoBO) : "")) + "</b>." }); }
  if (kase.comunicacaoLegal) itens.push({ em: kase.comunicacaoLegal.em, titulo: "Comunicação ao Conselho Tutelar registrada",
    detalhe: "Dever de comunicação (Lei nº 13.431/2017, art. 13) cumprido pelo Gestor do Caso." +
      (kase.comunicacaoLegal.observacao ? " " + esc(kase.comunicacaoLegal.observacao) : "") });
  if (kase.protocoloAplicado) itens.push({ em: kase.protocoloAplicado.em, titulo: "Protocolo correspondente aplicado",
    detalhe: "Caso Não crítico — ações educativas/mediação aplicadas automaticamente pelo Sistema MGBE-IA." });
  if (kase.equipeConcluidaEm) itens.push({ em: kase.equipeConcluidaEm, titulo: "Acompanhamento da Equipe de Apoio concluído",
    detalhe: "Ações e providências do protocolo executadas." });
  if (kase.decisaoInstitucional) itens.push({ em: kase.decisaoInstitucional.em, titulo: "Decisão institucional registrada",
    detalhe: esc(kase.decisaoInstitucional.texto) });
  if (kase.parecer) {
    itens.push({ em: kase.parecer.em, titulo: "Parecer emitido — " + kase.parecer.instancia,
      detalhe: "<b>" + kase.parecer.decisao + "</b>. " + esc(kase.parecer.justificativa) });
    (kase.parecer.registros || []).forEach(r => itens.push({ em: r.em,
      titulo: "Registro de acompanhamento — " + kase.parecer.instancia, detalhe: esc(r.texto) }));
    if (kase.parecer.encerradoEm) itens.push({ em: kase.parecer.encerradoEm, titulo: "Papel da instância encerrado",
      detalhe: kase.parecer.instancia + " concluiu o acompanhamento do caso." });
  }
  (kase.acompanhamentos || []).forEach(a => itens.push({ em: a.em,
    titulo: "Registro de acompanhamento — Equipe de Apoio", detalhe: esc(a.texto) }));
  if (kase.reavaliacao) itens.push({ em: kase.reavaliacao.em, titulo: "Reavaliação: resolvido",
    detalhe: "Confirmado pela Gestão." });
  if (kase.desfecho) itens.push({ em: kase.desfecho.em, titulo: "Caso encerrado",
    detalhe: esc(kase.desfecho.justificativa) || "(sem justificativa detalhada)" });
  if (kase.arquivadoEm) itens.push({ em: kase.arquivadoEm, titulo: "Caso arquivado",
    detalhe: "Histórico auditável preservado (Escudo Probatório Institucional)." });
  (kase.reaberturas || []).forEach(r => itens.push({ em: r.em, titulo: "Caso reaberto diante de novos fatos",
    detalhe: esc(r.justificativa) }));
  return itens.sort((a, b) => new Date(a.em) - new Date(b.em));
}
/* Linha do tempo completa do caso — junta os eventos de TODAS as raias (registro, ciência,
   validação, encaminhamento, urgência, execução da Equipe, decisão institucional, parecer da
   Rede de Proteção, encerramento, arquivamento). Usada pra dar continuidade entre perfis: mesmo
   que uma raia não possa alterar a decisão de outra, ela precisa poder VER o que já foi decidido
   e registrado antes dela, pra agir com contexto (pedido do usuário, 2026-08-27). */
function LinhaDoTempo({ kase }) {
  const itens = construirLinhaCompleta(kase);
  if (!itens.length) return html`<p class="dica">Nenhum evento registrado ainda.</p>`;
  return html`<ul class="timeline">
    ${itens.map((it, i) => html`<li key=${i}>
      <div class="quando">${quando(it.em)}</div><b>${it.titulo}</b>
      <div dangerouslySetInnerHTML=${{ __html: it.detalhe }}></div>
    </li>`)}
  </ul>`;
}

/* ============================================================== usuários e permissões (login)
   Atualização 12: deixou de ser simulado — login real via Supabase Auth (e-mail/senha), com os

const TODOS_PERFIS = ACTORS.map(a => a.id);
// Sessão padrão usada quando um componente que depende de ProfileShell é renderizado fora da
// árvore do <App/> (ex.: os harnesses de teste que montam uma Tela* isolada, sem passar por login
// real nenhum) — sem isso, useContext(SessaoContext) vem null e quebra o destructuring dentro de

const SESSAO_PADRAO = {
