/* ============================================================== estado do caso (fluxograma v2)
   Campos batem 1:1 com as caixas do fluxograma oficial v2 (5 fases, 8 raias — ver plano,
   Atualização 9). Sem localStorage, de propósito: o arquivo continua autocontido e sem restrição
   de origem file://. */
function isCritico(kase) { return !!(kase.validacao && kase.validacao.prioridade === "Alta"); }
// "Favorável ao encerramento" já está concluído no instante em que é emitido. "Requer
// acompanhamento adicional" só conclui quando a própria Rede de Proteção encerra o papel dela
// (kase.parecer.encerradoEm) — até lá, ela pode ir adicionando registros de acompanhamento. Só é
// checado quando isCritico(kase) — casos não críticos nunca têm parecer.
function parecerConcluido(kase) {
  if (!kase.parecer) return false;
  if (kase.parecer.decisao === "Requer acompanhamento adicional") return !!kase.parecer.encerradoEm;
  return true;
}
// Cada encaminhamento tem sua própria condição de conclusão.
// "Tratar diretamente" NÃO conclui o caso: o Gestor controla o status até sinalizar
// explicitamente que o caso está pronto para encerramento.
function encaminhamentoConcluido(kase) {
  if (!kase.encaminhamento) return false;
  switch (kase.encaminhamento.decisao) {
    case "tratar": return !!(kase.tratamentoDireto && kase.tratamentoDireto.status === "pronto_encerrar");
    case "equipe": return !!kase.equipeConcluidaEm;
    case "escalonar": return !!kase.decisaoInstitucional;
    case "encerrar": return true;
    default: return false;
  }
}
function prontoParaEncerrar(kase) {
  return encaminhamentoConcluido(kase) && (!isCritico(kase) || !kase.urgencia || parecerConcluido(kase))
    && !!kase.comunicacaoResponsaveis;
}
function statusOperacional(kase) {
  if (!kase) return "Sem status";
  if (kase.arquivadoEm) return "Arquivado";
  if (kase.desfecho) return "Encerrado";
  if (!kase.validacao) return "Em análise";
  if (!kase.encaminhamento) return "Aguardando encaminhamento";
  if (kase.encaminhamento.decisao === "tratar") {
    const td = kase.tratamentoDireto || {};
    const mapa = {
      em_analise: "Em análise",
      aguardando_complementacao: "Aguardando complementação",
      em_acompanhamento: "Em acompanhamento",
      pronto_encerrar: "Aguardando encerramento"
    };
    return mapa[td.status || "em_analise"] || "Em análise";
  }
  if (kase.encaminhamento.decisao === "equipe")
    return kase.equipeConcluidaEm ? "Aguardando encerramento" : "Em acompanhamento";
  if (kase.encaminhamento.decisao === "escalonar")
    return kase.decisaoInstitucional ? "Aguardando encerramento" : "Escalonado à Gestão Escolar";
  if (kase.encaminhamento.decisao === "encerrar") return "Aguardando encerramento";
  return "Em análise";
}

/* Status traduzido pro Comunicante (linguagem simples, 6 etapas) — reconstrói a árvore a partir
   dos campos brutos do caso, NÃO a partir da string de `statusOperacional` (aquela função reusa
   o rótulo "Em análise" pra dois estados internos diferentes, o que perderia a distinção que a
   spec de UX pede entre "Relato enviado" e "Em análise"). Cada etapa carrega só texto seguro de
   mostrar ao Comunicante — nunca categoria/prioridade da IA, protocolo sugerido, ou anotações
   internas do Gestor/Equipe. */
const ETAPAS_COMUNICANTE = [
  { chave: "relato_enviado", label: "Relato enviado", tone: "neutro",
    mensagem: "Recebemos seu relato com segurança.",
    explicacao: "O sistema registrou seu relato e gerou um protocolo. A instituição já foi notificada." },
  { chave: "em_analise", label: "Em análise", tone: "media",
    mensagem: "Seu relato está sendo analisado pela instituição.",
    explicacao: "A equipe responsável está revisando as informações apresentadas antes de decidir os próximos passos." },
  { chave: "encaminhado", label: "Encaminhado para atendimento", tone: "media",
    mensagem: "O caso foi encaminhado à equipe responsável pelo atendimento.",
    explicacao: "A instituição já decidiu como conduzir o seu caso e encaminhou para quem vai atuar diretamente nele." },
  { chave: "providencias_andamento", label: "Providências em andamento", tone: "media",
    mensagem: "A instituição está adotando as providências cabíveis.",
    explicacao: "A equipe responsável está realizando as ações consideradas necessárias para tratar a situação. Algumas informações do atendimento são protegidas e, por isso, não aparecem nesta área." },
  { chave: "em_acompanhamento", label: "Em acompanhamento", tone: "media",
    mensagem: "Houve intervenção e a situação continua sendo acompanhada.",
    explicacao: "Já houve uma ação da instituição, e a situação segue sendo observada para garantir que não volte a acontecer." },
  { chave: "encerrado", label: "Encerrado", tone: "baixa",
    mensagem: "O tratamento institucional foi concluído.",
    explicacao: "A instituição concluiu o tratamento deste caso. Se a situação voltar a acontecer, você pode registrar um novo relato." }
];

function statusSimplificadoComunicante(kase) {
  if (!kase) return "relato_enviado";
  if (kase.arquivadoEm || kase.desfecho) return "encerrado";
  if (!kase.cienciaEm) return "relato_enviado";
  if (!kase.validacao || !kase.encaminhamento) return "em_analise";
  const dec = kase.encaminhamento.decisao;
  if (dec === "tratar") {
    const st = (kase.tratamentoDireto || {}).status || "em_analise";
    return st === "em_acompanhamento" ? "em_acompanhamento" : "providencias_andamento";
  }
  if (dec === "equipe") return kase.equipeConcluidaEm ? "providencias_andamento" : "em_acompanhamento";
  if (dec === "escalonar") return kase.decisaoInstitucional ? "providencias_andamento" : "encaminhado";
  return "providencias_andamento"; // decisao === "encerrar"
}

// Recebe só a CHAVE do status (nunca o caso inteiro) — por design, garante que este componente
// não tem como vazar um campo interno do caso por engano.
function LinhaDoTempoRelato({ statusAtual }) {
  const idxAtual = ETAPAS_COMUNICANTE.findIndex(e => e.chave === statusAtual);
  return html`<ul class="timeline">
    ${ETAPAS_COMUNICANTE.map((e, i) => html`<li key=${e.chave} class=${i > idxAtual ? "timeline-pendente" : ""}>
      <b>${e.label}</b>${i < idxAtual ? " ✓" : i === idxAtual ? " ●" : ""}
      ${i <= idxAtual && html`<div class="dica">${e.mensagem}</div>`}
    </li>`)}
  </ul>`;
}

function caseReducer(state, action) {
  switch (action.type) {
    case "ENVIAR_RELATO": {
      // Fase 1, raia Comunicante — "Registrar relato ou situação". No fluxograma v2 o protocolo
      // já não depende de uma raia humana de recepção: "Validar campos mínimos", "Gerar
      // protocolo automaticamente", "Registrar data/hora, canal e dados do relato" e "Notificar
      // Gestor do Caso" são as 4 tarefas automáticas da raia Sistema MGBE-IA, todas concluídas
      // no mesmo instante do envio (não há mais um humano "recebendo" a ocorrência depois).
      // identificacaoDados só existe quando identificacao === "identificado" (nome, vínculo,
      // turma e contato opcionais) — minimização de dados conforme LGPD art. 6º, III.
      // local/quando/pessoaAfetada/pessoasMencionadas/evidencia são opcionais (não bloqueiam o
      // envio) — inspirados no assistente de relato do Safe School AI, mas continuam dentro da
      // mesma tarefa "Registrar relato ou situação" da raia Comunicante.
      const n = String(Math.floor(1000 + Math.random() * 8999));
      return {
        relato: action.relato,
        identificacao: action.identificacao,
        identificacaoDados: action.identificacaoDados || null,
        local: action.local || null,
        quando: action.quando || null,
        pessoaAfetada: action.pessoaAfetada || null,
        pessoasMencionadas: action.pessoasMencionadas || null,
        evidencia: action.evidencia || null,
        anonimoSemLogin: !!action.anonimoSemLogin,
        maiorDeIdade: typeof action.maiorDeIdade === "boolean" ? action.maiorDeIdade : null,
        termosAceitosEm: action.termosAceitosEm || null,
        // Dono do caso, só quando enviado por um Comunicante logado (nunca no canal anônimo) —
        // é o que permite "Meus Relatos" filtrar só os relatos da própria pessoa.
        comunicanteId: action.comunicanteId || null,
        enviadoEm: new Date().toISOString(),
        protocolo: "MGBE-" + new Date().getFullYear() + "-" + n,
        // Sinal de "possível repetição" persistido já no envio (não só quando o Gestor valida),
        // pra cobrir 100% dos casos — é o que indicadores_rede() (RLS/Atualização 13) lê no banco
        // pra calcular recorrência agregada sem precisar rodar o motor de regras em SQL. Campo
        // TOPO do objeto (não dentro de `ia`) de propósito: o case "VALIDAR" abaixo substitui
        // `state.ia` inteiro por `action.ia`, o que apagaria isso se ficasse aninhado ali.
        sinaisIA: { recorrencia: analisar(action.relato).recorrencia.length > 0 }
      };
    }

    case "TOMAR_CIENCIA":
      // Fase 2, raia Gestor do Caso — "Tomar ciência do caso e revisar análise da IA".
      return { ...state, cienciaEm: new Date().toISOString() };

    case "SALVAR_INFO_COMPLEMENTAR":
      // Fase 2, raia Gestor do Caso — nota livre ao revisar a análise da IA.
      return { ...state, infoComplementar: action.texto };

    case "VALIDAR":
      // Fase 3, raia Gestor do Caso — "Validar ou ajustar classificação e protocolo sugerido".
      return { ...state, ia: action.ia, validacao: action.validacao };

    case "DECIDIR_ENCAMINHAMENTO": {
      const base = { ...state, encaminhamento: { decisao: action.decisao, em: new Date().toISOString() } };
      if (action.decisao === "tratar") {
        return { ...base, tratamentoDireto: {
          status: "em_analise", periodoDias: null, proximaRevisao: null,
          observacao: null, atualizadoEm: new Date().toISOString()
        } };
      }
      return base;
    }

    case "GESTOR_REGISTRAR_COMUNICACAO_RESPONSAVEIS":
      // Documenta se/como os responsáveis foram informados, se concordaram com os
      // encaminhamentos, e se foram orientados a registrar Boletim de Ocorrência -- pré-requisito
      // institucional pra liberar o encerramento do caso (ver prontoParaEncerrar()).
      return { ...state, comunicacaoResponsaveis: {
        informados: action.informados, motivoNaoInformados: action.motivoNaoInformados || null,
        concordaramEncaminhamentos: action.concordaramEncaminhamentos,
        motivoDiscordancia: action.motivoDiscordancia || null,
        orientadosBO: action.orientadosBO, motivoBO: action.motivoBO || null,
        em: new Date().toISOString()
      } };

    case "GESTOR_REGISTRAR_COMUNICACAO_LEGAL":
      // Dever de comunicação ao Conselho Tutelar diante de identificação/revelação de violência
      // (Lei nº 13.431/2017, art. 13; Decreto nº 9.603/2018, art. 11) — DIFERENTE da "Comunicação
      // com responsáveis" (família) acima e do acionamento da Rede de Proteção: este registro é
      // incondicional, não depende de prioridade/urgência nem de validação por IA (artigo
      // MGBE-IA, §3: "a avaliação de urgência não condiciona o dever de comunicação").
      return { ...state, comunicacaoLegal: { observacao: action.observacao || null, em: new Date().toISOString() } };

    case "GESTOR_ATUALIZAR_TRATAMENTO_DIRETO":
      return { ...state, tratamentoDireto: {
        ...(state.tratamentoDireto || {}),
        status: action.status,
        periodoDias: action.periodoDias || null,
        proximaRevisao: action.proximaRevisao || null,
        observacao: action.observacao || null,
        atualizadoEm: new Date().toISOString()
      } };

    case "GESTOR_REGISTRAR_ACOMPANHAMENTO":
      return { ...state, acompanhamentosGestor: [
        ...(state.acompanhamentosGestor || []),
        { texto: action.texto, em: new Date().toISOString() }
      ] };

    case "ACIONAR_URGENCIA":
      // Fase 3/4, raia Gestor do Caso — aciona a Rede de Proteção / Órgãos Competentes direto,
      // independente da decisão de encaminhamento acima (um caso Crítico pode, ao mesmo tempo,
      // ser "atribuído à Equipe de Apoio" E ter a Rede de Proteção acionada).
      return { ...state, urgencia: { em: new Date().toISOString() } };

    case "EQUIPE_REGISTRAR":
      // Fase 4, raia Equipe de Apoio — "Registrar ações, encaminhamentos e evidências".
      return { ...state, acompanhamentos: [...(state.acompanhamentos || []), { texto: action.texto, em: new Date().toISOString() }] };

    case "EQUIPE_CONCLUIR":
      // Fase 4, raia Equipe de Apoio — fecha "Acompanhar evolução do caso e monitorar prazos".
      return { ...state, equipeConcluidaEm: new Date().toISOString() };

    case "DECISAO_INSTITUCIONAL":
      // Fase 4, raia Gestão Escolar — "Tomar decisões institucionais e administrativas".
      return { ...state, decisaoInstitucional: { texto: action.texto, em: new Date().toISOString() } };

    case "EMITIR_PARECER":
      // Extensão proposta pelo usuário além do fluxograma original: a raia Rede de Proteção /
      // Órgãos Competentes emite parecer para todo caso Crítico/Urgente acionado, e o
      // encerramento passa a depender dele — fecha a lacuna de casos críticos sendo encerrados
      // sem confirmação de que Conselho Tutelar/Saúde/Segurança/MP concluíram sua parte (Lei nº
      // 13.185/2015, Lei nº 14.811/2024, ECA).
      return { ...state, parecer: { instancia: action.instancia, decisao: action.decisao, justificativa: action.justificativa, em: new Date().toISOString(), registros: [] } };

    case "PARECER_ADD_REGISTRO":
      // "Requer acompanhamento adicional": enquanto o papel da instância não é encerrado, ela
      // pode ir registrando o andamento do acompanhamento.
      return { ...state, parecer: { ...state.parecer, registros: [...(state.parecer.registros || []), { texto: action.texto, em: new Date().toISOString() }] } };

    case "PARECER_ENCERRAR":
      // Encerra o papel da instância — só depois disso o "Encerrar caso" do Gestor do Caso
      // libera para casos com decisão "Requer acompanhamento adicional" (ver parecerConcluido()).
      return { ...state, parecer: { ...state.parecer, encerradoEm: new Date().toISOString() } };

    case "ENCERRAR":
      // Fase 5, raia Gestor do Caso — "Encerrar caso e registrar justificativa final".
      return { ...state, desfecho: { justificativa: action.justificativa, em: new Date().toISOString() } };

    case "ARQUIVAR":
      // Fase 5, raia Gestor do Caso — "Arquivar caso e manter histórico" → Fim.
      return { ...state, arquivadoEm: new Date().toISOString() };

    case "REABRIR_CASO":
      // Artigo MGBE-IA, §6.3/Quadro 3 ("Revisão e reabertura"): diante de novos fatos, o caso
      // precisa poder voltar ao plano. Preserva TODO o histórico anterior (desfecho/arquivamento
      // viram eventos passados na linha do tempo, não são apagados) e só libera o caso de novo
      // pra encerramento normal — por isso zera desfecho/arquivadoEm (precisam ser refeitos) mas
      // mantém validacao/encaminhamento/tratamentoDireto/comunicacaoResponsaveis como estavam.
      return { ...state,
        arquivadoEm: null,
        desfecho: null,
        reaberturas: [...(state.reaberturas || []), { justificativa: action.justificativa, em: new Date().toISOString() }]
      };

    case "ADICIONAR_INFORMACAO_COMUNICANTE":
      // Raia Comunicante — tela "Adicionar Nova Informação": complementa o protocolo já existente
      // sem abrir um novo caso. Lista própria (não reaproveita infoComplementar, que é campo único
      // de uso exclusivo do Gestor e seria sobrescrito, misturando autoria).
      return { ...state, atualizacoesComunicante: [...(state.atualizacoesComunicante || []),
        { texto: action.texto, recorrencia: !!action.recorrencia, continua: !!action.continua, em: new Date().toISOString() }] };

    default:
      return state;
  }
}

/* ============================================================== lista de casos (multi-caso)
   Antes o app inteiro girava em torno de UM `kase` — impedia, por exemplo, o aluno enviar um
   segundo relato sem perder o primeiro, ou o Sistema aplicar protocolo automaticamente pra um
   caso enquanto outro ainda está em análise. `caseReducer` acima continua sendo a lógica PURA
   por-caso (idêntica, já testada); `casosReducer` é só a camada de lista por cima: sabe criar um
   caso novo (com id próprio, atribuído aqui — protocolo só existe depois, gerado pela Recepção,
   então não serve como identificador desde o início) e sabe rotear toda outra action pro caso
   certo via `action.casoId`, sem tocar nos demais. */
// Precisa ser único de verdade entre sessões/dispositivos diferentes — um contador reiniciando
// em 1 a cada carregamento de página colidia com ids já existentes no banco (ex.: "c-1" gerado
// de novo numa sessão nova), fazendo o upsert virar um UPDATE em cima de outro caso: silencioso
// pra quem está autenticado (sobrescreve um caso alheio sem aviso) e um erro de RLS pra quem
// envia pelo canal anônimo (anon não tem permissão de UPDATE em `casos`, só INSERT).
function novoCasoId() {
  if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
  return "c-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
}

function casosReducer(casos, action) {
  switch (action.type) {
    case "ENVIAR_RELATO":
      return [...casos, { ...caseReducer({}, action), id: novoCasoId() }];
    case "RESET":
      // Só os casos ativos. historico/arquivados (em App) sobrevivem — mesmo comportamento de
      // sempre, só que agora "o kase" virou "todos os casos não arquivados".
      return [];
    default:
      return casos.map(k => (k.id === action.casoId ? caseReducer(k, action) : k));
  }
}

/* Padrão de fila reutilizado por Recepção, Profissional, Sistema (acompanhamento) e Instâncias:
   filtra os casos pendentes daquela raia e mantém qual deles está selecionado pra agir. */
function useFilaCaso(casos, filtroPendente) {
  const pendentes = casos.filter(filtroPendente).sort((a, b) => new Date(b.enviadoEm) - new Date(a.enviadoEm));

  // Regra de UX:
  // 1) A fila nunca abre um caso automaticamente.
  // 2) O caso só é aberto após clique explícito do usuário.
  // 3) Depois de aberto, o detalhe permanece visível mesmo que uma ação altere o status e
  //    retire o caso da fila atual. Isso evita o "sumiço" da tela após decisões como
  //    "Tratar diretamente".
  // 4) Ao trocar de menu/status, os próprios perfis chamam selecionar(null), fechando o detalhe.
  const [selecionadoId, setSelecionadoId] = useState(null);

  // Procura o selecionado na coleção completa, não apenas na fila filtrada.
  // Assim, uma mudança de status atualiza a fila, mas mantém aberto o caso que o usuário
  // já estava tratando até ele voltar para a lista ou trocar de menu.
  const selecionado = casos.find(c => c.id === selecionadoId) || null;
  return [pendentes, selecionado, setSelecionadoId];
}

// Avança `abaAtiva` para o próximo passo aplicável assim que `concluido` passa de false pra
// true (borda de subida via useRef, não o valor absoluto) — depender só de `abaAtiva` faria o
// Gestor ser "chutado" de volta pra frente toda vez que clicasse numa aba já concluída pra
// revisar. Usado só pela interface em abas do Gestor do Caso.
function useAvancoAutomatico(numeroAba, concluido, abaAtiva, setAbaAtiva, statusPasso) {
  const eraConcluido = useRef(concluido);
  useEffect(() => {
    const acabouDeConcluir = concluido && !eraConcluido.current;
    eraConcluido.current = concluido;
    if (acabouDeConcluir && abaAtiva === numeroAba) {
      setAbaAtiva(proximaAbaAplicavel(numeroAba, statusPasso));
    }
  }, [concluido]);
}

/* Busca por protocolo (também aceita trecho do relato — útil antes do protocolo existir, ex.:
   fila da Recepção) — reaproveitada em toda listagem/fila do sistema. Só filtra o que é
   MOSTRADO; não interfere na lógica de seleção/fila por baixo (useFilaCaso continua operando
   sobre a lista completa). */
function filtrarPorBusca(casos, busca) {
  const q = (busca || "").trim().toLowerCase();
  if (!q) return casos;
  return casos.filter(c => (c.protocolo || "").toLowerCase().includes(q) || (c.relato || "").toLowerCase().includes(q));
}
function CampoBusca({ valor, onChange, placeholder }) {
  return html`<div class="campo-busca">
    <${Icon} name="search" size=${15} />
    <input type="text" placeholder=${placeholder || "Buscar por protocolo..."} value=${valor} onChange=${e => onChange(e.target.value)} />
  </div>`;
}

/* Tabela de fila genérica (Recepção/Profissional/Instâncias/Sistema-acompanhamento) — uma linha
   por caso pendente, clicável para trocar qual está selecionado abaixo. Busca embutida: como as
   4 raias já reaproveitam este componente, um único ajuste cobre todas. */
function FilaTabela({ casos, selecionadoId, onSelecionar, labelAcao }) {
  const [busca, setBusca] = useState("");
  const filtrados = filtrarPorBusca(casos, busca);
  return html`<div class="card" style=${{ padding: 0, overflowX: "auto" }}>
    ${casos.length > 1 && html`<div style=${{ padding: "14px 16px 0" }}>
      <${CampoBusca} valor=${busca} onChange=${setBusca} placeholder="Buscar por protocolo ou trecho do relato..." /></div>`}
    <table class="tbl">
      <thead><tr><th>Protocolo</th><th>Relato</th><th>Status</th><th>Registrado em</th><th></th></tr></thead>
      <tbody>
        ${filtrados.map(c => html`<tr key=${c.id} class=${c.id === selecionadoId ? "fila-linha-ativa" : ""}
          style=${{ cursor: "pointer" }} onClick=${() => onSelecionar(c.id)}>
          <td><div style=${{ display: "flex", alignItems: "center", gap: "6px", flexWrap: "wrap" }}>
            <b>${c.protocolo || "Aguardando protocolo"}</b>
            ${c.identificacao === "anonimo" && html`<${Badge} tone="neutro">Anônimo</${Badge}>`}
          </div></td>
          <td style=${{ maxWidth: "360px", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>${esc(c.relato)}</td>
          <td><${Badge} tone=${statusOperacional(c) === "Aguardando encerramento" ? "media" : statusOperacional(c) === "Encerrado" ? "neutro" : "baixa"}>${statusOperacional(c)}</${Badge}></td>
          <td>${quando(c.enviadoEm)}</td>
          <td>${c.id === selecionadoId
            ? html`<${Badge} tone="baixa">Aberto</${Badge}>`
            : html`<button class="btn btn-secondary" onClick=${e => { e.stopPropagation(); onSelecionar(c.id); }}>${labelAcao ? labelAcao(c) : "Abrir caso"}</button>`}</td>
        </tr>`)}
        ${filtrados.length === 0 && html`<tr><td colspan="5" class="dica" style=${{ padding: "14px 16px" }}>Nenhum caso encontrado para "${busca}".</td></tr>`}
      </tbody>
    </table>
  </div>`;
}

function useHashRoute(def) {
  const read = () => location.hash.replace(/^#\/?/, "") || def;
  const [route, setRoute] = useState(read);
  useEffect(() => {
    function onHash() { setRoute(read()); }
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);
  const navigate = useCallback(id => { location.hash = "#/" + id; }, []);
  return [route, navigate];
}

/* ============================================================== primitivas visuais */
function Alert({ tone = "info", children }) {
  const iconName = tone === "danger" ? "alert-triangle" : tone === "warn" ? "alert-triangle" : tone === "ok" ? "check-circle" : "info";
  return html`<div class=${"alert alert-" + tone}><${Icon} name=${iconName} size=${18} className="ic" /><div>${children}</div></div>`;
}

function Badge({ tone, children }) {
  return html`<span class=${"badge badge-" + tone}>${children}</span>`;
}

/* Campo de senha com "olhinho" pra alternar entre oculto/visível — usado em toda tela que pede
   senha (login, cadastro, redefinir senha, redefinir senha de outra conta pelo Admin). */
function CampoSenha({ value, onChange, autoComplete, disabled, placeholder, style }) {

    <input type=${visivel ? "text" : "password"} autoComplete=${autoComplete} placeholder=${placeholder}
      value=${value} onChange=${onChange} disabled=${disabled} />
    <button type="button" class="campo-senha-toggle" tabIndex="-1"

      <${Icon} name=${visivel ? "eye-off" : "eye"} size=${17} />

}

/* Caixinha fixa de acolhimento — para as mensagens que humanizam o sistema (não para status
   operacional genérico, que continua em Alert). Usa a paleta vibrante da visão do Demandante
   (--pub-a/--pub-b, o mesmo degradê de .public-page.inline), aplicada aqui a qualquer perfil
   onde apareça uma mensagem de acolhimento — não é exclusiva da tela do aluno. */
function Acolhimento({ icon = "heart", children }) {
  return html`<div class="acolhimento-box">
    <span class="acolhimento-ic"><${Icon} name=${icon} size=${18} /></span>
    <div class="acolhimento-corpo">${children}</div>
  </div>`;
}

/* ============================================================== modal padrão do sistema
   Um único componente de modal, reutilizado em toda a aplicação (avisos e detalhamento de
   casos), para manter a mesma moldura visual em vez de cada tela criar a sua. Fecha com Esc,
   clique no fundo, ou no X. */
function Modal({ title, onClose, children, wide }) {
  useEffect(() => {
    function onKey(e) { if (e.key === "Escape") onClose(); }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);
  return html`<div class="modal-backdrop" onClick=${onClose}>
    <div class=${"modal-panel" + (wide ? " wide" : "")} onClick=${e => e.stopPropagation()}>
      <div class="modal-head"><h3>${title}</h3>
        <button class="modal-close" onClick=${onClose} aria-label="Fechar"><${Icon} name="x-circle" size=${19} /></button></div>
      <div class="modal-body">${children}</div>
    </div>
  </div>`;
}

/* Avisos do sistema (troca o showAviso() nativo do navegador, que foge do design system, por um
   modal no mesmo padrão visual). showAviso() pode ser chamado de qualquer componente; <AvisoHost/>
   é montado uma única vez, na raiz do App. */
let _avisoListeners = [];
function showAviso(mensagem) { _avisoListeners.forEach(fn => fn(mensagem)); }
function AvisoHost() {
  const [msg, setMsg] = useState(null);
  useEffect(() => {
    const fn = m => setMsg(m);
    _avisoListeners.push(fn);
    return () => { _avisoListeners = _avisoListeners.filter(f => f !== fn); };
  }, []);
  if (!msg) return null;
  return html`<${Modal} title="Aviso" onClose=${() => setMsg(null)}>
    <p style=${{ margin: 0 }}>${msg}</p>
    <div class="acoes"><button class="btn btn-primary" onClick=${() => setMsg(null)}>Entendi</button></div>
  </${Modal}>`;
}

/* Confirmação de ações definitivas (mesmo padrão de showAviso() acima) — troca o confirm()
   nativo do navegador por um modal no design system, usado antes de ações que não podem ser
   desfeitas (encerrar caso, arquivar caso, concluir acompanhamento da Equipe de Apoio etc.).
   showConfirm() pode ser chamado de qualquer componente; <ConfirmHost/> é montado uma única vez,
   na raiz do App. */
let _confirmListeners = [];
function showConfirm(opcoes) { _confirmListeners.forEach(fn => fn(opcoes)); }
function ConfirmHost() {
  const [cfg, setCfg] = useState(null);
  useEffect(() => {
    const fn = c => setCfg(c);
    _confirmListeners.push(fn);
    return () => { _confirmListeners = _confirmListeners.filter(f => f !== fn); };
  }, []);
  if (!cfg) return null;
  function confirmar() {
    cfg.onConfirmar();
    setCfg(null);
  }
  // Fechar sem confirmar (botão Cancelar ou X) avisa quem chamou showConfirm() — usado pelos
  // botões de ação definitiva (Gestor do Caso, Equipe de Apoio) pra se reabilitar quando o
  // usuário desiste, já que eles se desabilitam no próprio clique que abre este modal.
  function cancelar() {
    if (cfg.onCancelar) cfg.onCancelar();
    setCfg(null);
  }
  return html`<${Modal} title=${cfg.titulo || "Confirmar ação"} onClose=${cancelar}>
    <${Alert} tone="warn">${cfg.mensagem}</${Alert}>
    <div class="acoes">
      <button class="btn btn-secondary" onClick=${cancelar}>Cancelar</button>
      <button class="btn btn-danger" onClick=${confirmar}>${cfg.textoConfirmar || "Confirmar"}</button>
    </div>
  </${Modal}>`;
}

const STEP_CFG = {
  pendente: { tone: "neutro", label: "Pendente" },
  atual: { tone: "media", label: "Ação necessária" },
  concluido: { tone: "baixa", label: "Concluído" },
  bloqueado: { tone: "neutro", label: "Aguardando etapa anterior" },
  na: { tone: "neutro", label: "Não se aplica a este caso" }
};

function StepCard({ n, title, status, children }) {
  const cfg = STEP_CFG[status] || STEP_CFG.pendente;
  return html`<div class=${"card step-card step-" + status}>
    <h3><span class="step-n">${n}</span>${title}
      <span style=${{ marginLeft: "auto" }}><${Badge} tone=${cfg.tone}>${cfg.label}</${Badge}></span></h3>
    <div class="step-body">${children}</div>
  </div>`;
}

/* Interface em abas dos 9 passos da jornada do Gestor do Caso — usada só por TelaGestor por
   enquanto. Os passos 6 e 7, que hoje somem quando não se aplicam ao caso, passam a usar o
   status "na" (já existente em STEP_CFG, mas sem uso até aqui) em vez de deixar de renderizar.
   Passo 5 (Comunicação com Responsáveis) foi acrescentado a pedido do usuário (2026-08-27) —
   documentação institucional que independe do caminho de encaminhamento escolhido, e vira
   pré-requisito pra liberar o Encerramento (ver prontoParaEncerrar()). */
const TITULOS_PASSO_GESTOR = [
  { n: 1, curto: "Protocolo",        icone: "file-text",      titulo: "Registrar dados do relato e gerar protocolo (Sistema MGBE-IA)" },
  { n: 2, curto: "Ciência",          icone: "eye",             titulo: "Tomar ciência do caso e revisar análise da IA" },
  { n: 3, curto: "Validação",        icone: "clipboard-check", titulo: "Validar ou ajustar classificação e protocolo sugerido" },
  { n: 4, curto: "Decisão",          icone: "send",            titulo: "Qual a decisão do Gestor do Caso?" },
  { n: 5, curto: "Comunicação",      icone: "users",           titulo: "Comunicação com responsáveis" },
  { n: 6, curto: "Condução direta",  icone: "users",           titulo: "Condução direta pelo Gestor do Caso" },
  { n: 7, curto: "Rede de Proteção", icone: "shield",          titulo: "Acionar Rede de Proteção / Órgãos Competentes" },
  { n: 8, curto: "Encerramento",     icone: "x-circle",        titulo: "Encerrar caso e registrar justificativa final" },
  { n: 9, curto: "Arquivamento",     icone: "lock",            titulo: "Arquivar caso e manter histórico" }
];

function calcularStatusPassoGestor(sel, validado, pronto) {
  const decisaoTratar = !!(sel.encaminhamento && sel.encaminhamento.decisao === "tratar");
  const tratamentoPronto = !!(sel.tratamentoDireto && sel.tratamentoDireto.status === "pronto_encerrar");
  return {
    1: "concluido",
    2: "concluido",
    3: validado ? "concluido" : "atual",
    4: sel.encaminhamento ? "concluido" : (validado ? "atual" : "bloqueado"),
    5: !sel.encaminhamento ? "bloqueado" : (sel.comunicacaoResponsaveis ? "concluido" : "atual"),
    6: !sel.encaminhamento ? "bloqueado" : (!decisaoTratar ? "na" : (tratamentoPronto ? "concluido" : "atual")),
    // Acionar a Rede de Proteção NUNCA pode depender da validação da IA estar concluída
    // (artigo MGBE-IA, §4.3/6.2/9.6: "a avaliação inicial de risco imediato orienta medidas de
    // proteção... sem aguardar a IA"; "a proteção não depende de confirmação computacional de
    // bullying"). Por isso este passo fica sempre disponível assim que o caso é aberto — nunca
    // bloqueado, nunca "não se aplica" — independente de `validado`/`critico`.
    7: sel.urgencia ? "concluido" : "atual",
    8: !sel.encaminhamento ? "bloqueado" : (sel.desfecho ? "concluido" : (pronto ? "atual" : "bloqueado")),
    9: sel.arquivadoEm ? "concluido" : (sel.desfecho ? "atual" : "bloqueado")
  };
}

// Pula abas "na" em sequência; nunca pula "bloqueado" — o usuário precisa "ver" o bloqueio.
function proximaAbaAplicavel(desde, statusPasso) {
  let n = desde + 1;
  while (n < 9 && statusPasso[n] === "na") n++;
  return n;
}

function AbasPasso({ passos, ativa, onSelecionar }) {
  return html`<div class="abas-passo" role="tablist">
    ${passos.map(p => {
      const bloqueada = p.status === "bloqueado" || p.status === "na";
      return html`<button key=${p.n} type="button" role="tab" aria-selected=${p.n === ativa}
        class=${"aba-passo aba-passo-" + p.status + (p.n === ativa ? " ativa" : "")}
        disabled=${bloqueada}
        title=${p.status === "na" ? "Não se aplica a este caso" : p.status === "bloqueado" ? "Aguardando etapa anterior" : p.titulo}
        onClick=${() => onSelecionar(p.n)}>
        ${p.status === "concluido" && html`<span class="aba-passo-check"><${Icon} name="check-circle" size=${10} /></span>`}
        <${Icon} name=${p.icone} size=${17} />
        <span class="aba-passo-label">${p.curto}</span>
      </button>`;
    })}
  </div>`;
}

// Fica fora do <StepCard> (irmão, não filho) de propósito: `.step-bloqueado .btn,.step-na
// .btn{pointer-events:none}` desabilitaria este botão justamente quando o Gestor mais quer
// usá-lo (aba atual bloqueada/não aplicável, avançando só pra inspecionar o que vem a seguir).
function BotaoAvancarPasso({ passoAtual, statusPasso, onAvancar }) {
  if (passoAtual >= 9) return null;
  const proxima = proximaAbaAplicavel(passoAtual, statusPasso);
  if (proxima <= passoAtual) return null;
  return html`<div class="acoes">
    <button class="btn btn-secondary" onClick=${() => onAvancar(proxima)}>
      Avançar para a próxima etapa <${Icon} name="arrow-right" size=${16} />
    </button>
    ${statusPasso[proxima] === "bloqueado" && html`<span class="dica" style=${{ alignSelf: "center" }}>
      A próxima etapa ainda depende de uma ação anterior — você poderá vê-la, mas não concluí-la ainda.</span>`}
  </div>`;
}

/* Barra de navegação entre as 8 raias — visível em toda tela. É a resposta
   direta ao pedido de não misturar as funções de cada ator: trocar de
   perfil é a única forma de ver as tarefas de outro ator. */
function iniciais(nome) {
  return (nome || "").split(" ").filter(Boolean).slice(0, 2).map(p => p[0]).join("").toUpperCase();
}

/* Shell de app inteiro: sidebar única (fixa, altura total, recolhível) fundindo o que antes eram
   duas navegações separadas — a barra de perfis (topo) e a sub-navegação em sidebar por seção
   (dentro do conteúdo). Ocupa 100% da tela, sem faixa de topo nem margens laterais no corpo —
   igual ao pedido do usuário (referência visual: sidebar escura de ponta a ponta, botão de
   recolher). Mantém a identidade do sistema: mesma paleta --brand-* (violeta) do resto do
   protótipo, não a paleta da referência. */
function ProfileShell({ profile, titulo, subtitulo, navigate, casos, secoes, ativa, onTrocar, resumo, colapsada, onColapsar, onVoltar, children }) {
  const { usuarioLogado, onSair, onAdministracao } = useContext(SessaoContext) || SESSAO_PADRAO;
  const ator = profile ? ACTOR_BY_ID[profile] : null;
  const opcoes = ator ? ACTORS.filter(a => usuarioLogado.perfisPermitidos.includes(a.id)) : [];

/* ============================================================== perfil 1 (raia) — Comunicante
   Fluxograma v2: "Registrar relato ou situação" (fase 1). Única caixa desta raia. */
const VINCULOS = ["Sou a pessoa envolvida", "Sou testemunha", "Sou responsável ou familiar", "Sou professor(a) ou funcionário(a)"];
// Campos inspirados no assistente do Safe School AI (referência externa, ver plano "Atualização
// 5") — enriquecem a mesma tarefa "Registrar relato ou denúncia" do fluxograma, sem criar raia
// nova. Todos opcionais: não bloqueiam o envio.
const LOCAIS_OCORRENCIA = ["Sala de aula", "Recreio ou pátio", "Corredor", "Quadra ou educação física", "Banheiro", "Transporte escolar / entrada e saída", "Ambiente digital (redes sociais, grupos, jogos)", "Outro"];
const EVIDENCIA_TIPOS = ["Relato verbal", "Capturas de tela", "Fotos ou vídeos", "Testemunhas", "Registros anteriores"];

/* Assistente de relato em 4 passos, reaproveitado tanto pela raia Demandante (logada) quanto pelo
   canal público sem login (ver TelaLogin/App). Não dispara nada sozinho — devolve os dados
   coletados via onEnviar(), quem chama decide o que fazer (sempre ENVIAR_RELATO no reducer). */
function AssistenteRelato({ modoAnonimo, enviando, onEnviar }) {
  const [passo, setPasso] = useState(1);
  const [relato, setRelato] = useState("");
  const [ident, setIdent] = useState("anonimo");
  const [nome, setNome] = useState("");
  const [vinculo, setVinculo] = useState(VINCULOS[0]);
  const [turma, setTurma] = useState("");
  const [contato, setContato] = useState("");
  const [local, setLocal] = useState(LOCAIS_OCORRENCIA[0]);
  const [dataOcorrido, setDataOcorrido] = useState("");
  const [pessoaAfetada, setPessoaAfetada] = useState("");
  const [pessoasMencionadas, setPessoasMencionadas] = useState("");
  const [evidencia, setEvidencia] = useState(EVIDENCIA_TIPOS[0]);
  // Faixa etária + aceite dos termos — pedido explicitamente pelo usuário (transparência sobre
  // tratamento de dados, LGPD). Não substitui consentimento dos responsáveis quando exigido por
  // lei; para bullying, o art. 14 §3º da LGPD já permite tratar o dado sem esse consentimento
  // prévio quando a finalidade é proteger o próprio estudante (ver Alert abaixo) — mas registrar
  // a faixa etária e um aceite explícito continua sendo boa prática de transparência.
  const [maiorDeIdade, setMaiorDeIdade] = useState(null); // null = ainda não escolheu
  const [aceiteTermos, setAceiteTermos] = useState(false);

  const identEfetiva = modoAnonimo ? "anonimo" : ident;
  const TITULOS = ["Quem está fazendo o relato?", "Conte o que aconteceu", "Pessoas e evidências", "Confira com calma"];

  function passo1Valido() {
    if (!modoAnonimo && identEfetiva === "identificado" && !nome.trim()) {
      showAviso("Informe seu nome completo ou escolha não se identificar.");
      return false;
    }
    if (maiorDeIdade === null) { showAviso("Informe se você é menor ou maior de 18 anos."); return false; }
    if (!aceiteTermos) { showAviso("Você precisa marcar que leu e concorda com as informações sobre o uso dos dados."); return false; }
    return true;
  }
  function passo2Valido() {
    if (!relato.trim()) { showAviso("Escreva o relato antes de continuar."); return false; }
    return true;
  }
  function avancar() {
    if (passo === 1 && !passo1Valido()) return;
    if (passo === 2 && !passo2Valido()) return;
    setPasso(p => Math.min(4, p + 1));
  }
  function voltar() { setPasso(p => Math.max(1, p - 1)); }
  function enviar() {
    if (!passo2Valido()) { setPasso(2); return; }
    if (!passo1Valido()) { setPasso(1); return; }
    const dados = identEfetiva === "identificado"
      ? { nome: nome.trim(), vinculo, turma: turma.trim() || null, contato: contato.trim() || null }
      : null;
    onEnviar({
      relato: relato.trim(), identificacao: identEfetiva, identificacaoDados: dados,
      local, quando: dataOcorrido || null,
      pessoaAfetada: pessoaAfetada.trim() || null, pessoasMencionadas: pessoasMencionadas.trim() || null,
      evidencia, anonimoSemLogin: modoAnonimo,
      maiorDeIdade, termosAceitosEm: new Date().toISOString()
    });
  }

  return html`<div class="card wizard-card">
    <div class="wizard-progress">
      <span class="badge badge-neutro">Etapa ${passo} de 4</span>
      <div class="wizard-dots">${[1, 2, 3, 4].map(n => html`<span key=${n} class=${"wizard-dot" + (n <= passo ? " on" : "")}></span>`)}</div>
    </div>
    <h3>${TITULOS[passo - 1]}</h3>

    ${passo === 1 && html`
      ${modoAnonimo
        ? html`<${Alert} tone="ok">Você está no canal público, sem login. Este relato é registrado
            como anônimo — você não precisa se identificar nem saber classificar o que
            aconteceu.</${Alert}>`
        : html`
          <div class="field"><label>Identificação</label>
            <select value=${ident} onChange=${e => setIdent(e.target.value)}>
              <option value="anonimo">Prefiro não me identificar</option>
              <option value="identificado">Quero me identificar</option>
            </select>
            <p class="dica">Relatos anônimos são aceitos e <b>não</b> recebem prioridade menor por isso.</p>
          </div>
          ${ident === "identificado" && html`
            <div class="ident-box">
              <div class="field"><label>Nome completo *</label>
                <input type="text" value=${nome} onChange=${e => setNome(e.target.value)} /></div>
              <div class="field"><label>Vínculo com a situação *</label>
                <select value=${vinculo} onChange=${e => setVinculo(e.target.value)}>
                  ${VINCULOS.map(v => html`<option key=${v}>${v}</option>`)}
                </select></div>
              <div class="field"><label>Turma/série (opcional)</label>
                <input type="text" placeholder="Ex.: 7º ano B" value=${turma} onChange=${e => setTurma(e.target.value)} /></div>
              <div class="field"><label>Telefone para retorno (opcional)</label>
                <input type="text" inputMode="numeric" placeholder="(xx)xxxxxxxxx" value=${contato} onChange=${e => setContato(mascararTelefone(e.target.value))} /></div>
              <${Alert} tone="info"><b>Proteção de dados.</b> Só o nome, o vínculo e, se você
                preencher, turma e contato são coletados — o mínimo necessário para a escola dar
                retorno. Conforme o art. 14, §3º da LGPD (Lei nº 13.709/2018), dados de crianças e
                adolescentes podem ser tratados sem consentimento prévio dos responsáveis quando a
                finalidade é proteger o próprio estudante — como prevê também o ECA (Lei nº
                8.069/1990) e a Lei nº 13.185/2015 (Lei do Bullying). O acesso fica restrito à
                Sistema MGBE-IA e ao Gestor do Caso responsável; nunca é exposto publicamente
                nem usado para outra finalidade.</${Alert}>
            </div>`}
          <p class="dica">Isso nos ajuda a proteger sua identidade e definir como podemos falar com você.</p>
        `}

      <div class="ident-box" style=${{ marginTop: "14px" }}>
        <div class="field"><label>Sua idade *</label>
          <div class="acoes" style=${{ marginTop: "4px" }}>
            <label style=${{ display: "flex", alignItems: "center", gap: "6px", fontWeight: 400 }}>
              <input type="radio" name="faixa-etaria" checked=${maiorDeIdade === false} onChange=${() => setMaiorDeIdade(false)} />
              Sou menor de 18 anos</label>
            <label style=${{ display: "flex", alignItems: "center", gap: "6px", fontWeight: 400 }}>
              <input type="radio" name="faixa-etaria" checked=${maiorDeIdade === true} onChange=${() => setMaiorDeIdade(true)} />
              Tenho 18 anos ou mais</label>
          </div>
        </div>
        <${Alert} tone="info">Este relato fica salvo no sistema da escola e é visto só pelas
          pessoas responsáveis por tratar o caso (Gestor do Caso, Equipe de Apoio e, se
          necessário, Rede de Proteção) — nunca é exibido publicamente. Se você é menor de 18
          anos, a Lei Geral de Proteção de Dados (art. 14, §3º) permite tratar esse relato mesmo
          sem autorização prévia dos responsáveis, porque a finalidade é te proteger — mesmo
          assim, a escola pode envolver seus responsáveis conforme o andamento do caso.</${Alert}>
        <label style=${{ display: "flex", alignItems: "flex-start", gap: "8px", marginTop: "10px", fontWeight: 400 }}>
          <input type="checkbox" checked=${aceiteTermos} onChange=${e => setAceiteTermos(e.target.checked)} style=${{ marginTop: "3px" }} />
          <span>Li e entendi como esse relato vai ser usado, e quero enviá-lo.</span>
        </label>
      </div>
    `}

    ${passo === 2 && html`
      <p class="card-sub">Escreva com suas palavras. Não é preciso saber classificar nem usar termos técnicos.</p>

        <div class="acoes" style=${{ marginTop: 0 }}>

          <button class="chip" onClick=${() => setRelato(EXEMPLOS[2])}>Cenário B — digital</button>

    ${passo === 3 && html`

      <div class="field"><label>Pessoa possivelmente afetada (opcional)</label>

      <div class="field"><label>Outras pessoas mencionadas (opcional)</label>

    ${passo === 4 && html`
      <p class="card-sub">Seu relato será recebido pela equipe responsável. Ele não representa uma

      <table class="tbl">

        13.185/2015 (Lei do Bullying). O acesso às informações fica restrito às pessoas
        responsáveis por tratar o seu caso.</${Alert}>

          </button>`}

}

const SECOES_DEMANDANTE = [
  { grupo: "Meu acesso" },
  { id: "novo", label: "Registrar uma situação", icon: "send" },
  { id: "meus", label: "Meus casos", icon: "list" }
];

function TelaComunicante({ casos, dispatch, navigate, colapsada, onColapsar }) {
  const { usuarioLogado } = useContext(SessaoContext) || SESSAO_PADRAO;
  const [secao, setSecao] = useState("novo");
  const [enviando, setEnviando] = useState(false);
  const [confirmando, setConfirmando] = useState(false);
  // Acompanhar e complementar deixaram de ser páginas próprias — tudo isso agora mora dentro do
  // modal aberto a partir de "Meus casos" (casoAbertoId != null = modal aberto).
  const [casoAbertoId, setCasoAbertoId] = useState(null);
  const [buscaMeus, setBuscaMeus] = useState("");
  const [entendaAberto, setEntendaAberto] = useState(false);
  const [modoComplemento, setModoComplemento] = useState(false);
  const [textoComplemento, setTextoComplemento] = useState("");
  const [voltouAcontecer, setVoltouAcontecer] = useState(false);
  const [continuaAcontecendo, setContinuaAcontecendo] = useState(false);
  const [apenasAcrescentar, setApenasAcrescentar] = useState(false);
  const [complementoEnviado, setComplementoEnviado] = useState(false);

  // "Meus casos" só mostra o que ESTE Comunicante enviou logado — relatos anônimos (canal
  // público ou identificação "anônimo") nunca têm comunicanteId, então nunca aparecem aqui; não
  // há como "recuperar" um relato anônimo depois, por desenho.
  const meusRelatos = casos.filter(c => c.comunicanteId === usuarioLogado.id)
    .sort((a, b) => new Date(b.enviadoEm) - new Date(a.enviadoEm));
  const meusRelatosFiltrados = filtrarPorBusca(meusRelatos, buscaMeus);
  const casoAberto = meusRelatos.find(c => c.id === casoAbertoId) || null;

  function abrirCaso(id) {
    setCasoAbertoId(id);
    setEntendaAberto(false);
    setModoComplemento(false);
    setComplementoEnviado(false);
  }
  function fecharModalCaso() {
    setCasoAbertoId(null);
  }

  function enviarRelato(dados) {
    setEnviando(true);
    setTimeout(() => {
      dispatch({ type: "ENVIAR_RELATO", ...dados, comunicanteId: usuarioLogado.id });
      setEnviando(false);
      setConfirmando(true);
    }, 350);
  }
  function fecharConfirmacao() {
    setConfirmando(false);
    setSecao("meus");
    const recente = meusRelatos[0];
    if (recente) abrirCaso(recente.id);
  }

  function enviarComplemento() {
    if (!textoComplemento.trim()) { showAviso("Descreva o que aconteceu antes de enviar."); return; }
    dispatch({ type: "ADICIONAR_INFORMACAO_COMUNICANTE", casoId: casoAberto.id,
      texto: textoComplemento.trim(), recorrencia: voltouAcontecer, continua: continuaAcontecendo });
    setTextoComplemento(""); setVoltouAcontecer(false); setContinuaAcontecendo(false); setApenasAcrescentar(false);
    setModoComplemento(false);
    setComplementoEnviado(true);
  }

  return html`<${ProfileShell} profile="comunicante" navigate=${navigate} casos=${casos}
    secoes=${SECOES_DEMANDANTE} ativa=${secao} onTrocar=${setSecao} colapsada=${colapsada} onColapsar=${onColapsar}>
    ${secao === "novo" && html`
    <div class="public-page inline">
      <${AssistenteRelato} modoAnonimo=${false} enviando=${enviando} onEnviar=${enviarRelato} />
      ${meusRelatos.length > 0 && html`<${Alert} tone="ok"><b>Você pode enviar quantos relatos
        precisar.</b> Cada situação diferente vira um caso próprio, acompanhado separadamente —
        veja todos em "Meus casos".</${Alert}>`}
    </div>
    `}

    ${secao === "meus" && html`
      <div class="tiles">
        <div class="tile"><div class="n">${meusRelatos.length}</div><div class="lbl">Relatos enviados</div></div>
        <div class="tile"><div class="n">${meusRelatos.filter(c => statusSimplificadoComunicante(c) !== "encerrado").length}</div><div class="lbl">Em andamento</div></div>
        <div class="tile"><div class="n">${meusRelatos.filter(c => statusSimplificadoComunicante(c) === "encerrado").length}</div><div class="lbl">Encerrados</div></div>
      </div>
      ${meusRelatos.length === 0
        ? html`<${Alert} tone="info">Você ainda não enviou nenhum relato. Use "Registrar uma situação" para começar.</${Alert}>`
        : html`<div class="card" style=${{ padding: 0, overflowX: "auto" }}>
            ${meusRelatos.length > 1 && html`<div style=${{ padding: "14px 16px 0" }}>
              <${CampoBusca} valor=${buscaMeus} onChange=${setBuscaMeus} placeholder="Buscar por protocolo ou trecho do relato..." /></div>`}
            <table class="tbl">
              <thead><tr><th>Protocolo</th><th>Relato</th><th>Status</th><th>Registrado em</th><th></th></tr></thead>
              <tbody>
                ${meusRelatosFiltrados.map(c => {
                  const etapa = ETAPAS_COMUNICANTE.find(e => e.chave === statusSimplificadoComunicante(c));
                  return html`<tr key=${c.id}>
                    <td><b>${c.protocolo || "Aguardando protocolo"}</b></td>
                    <td style=${{ maxWidth: "320px", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>${esc(c.relato)}</td>
                    <td><${Badge} tone=${etapa.tone}>${etapa.label}</${Badge}></td>
                    <td>${quando(c.enviadoEm)}</td>
                    <td><button class="btn-icon" title="Ver detalhes" onClick=${() => abrirCaso(c.id)}><${Icon} name="eye" size=${17} /></button></td>
                  </tr>`;
                })}
                ${meusRelatosFiltrados.length === 0 && html`<tr><td colspan="5" class="dica" style=${{ padding: "14px 16px" }}>Nenhum relato encontrado para "${buscaMeus}".</td></tr>`}
              </tbody>
            </table>
          </div>`}
    `}

    ${casoAberto && html`<${Modal} title=${"Caso " + (casoAberto.protocolo || "(aguardando protocolo)")} onClose=${fecharModalCaso}>
      ${(() => {
        const etapa = ETAPAS_COMUNICANTE.find(e => e.chave === statusSimplificadoComunicante(casoAberto));
        return !modoComplemento ? html`
          <p class="dica">Registrado em ${quando(casoAberto.enviadoEm)}</p>
          <${Alert} tone=${etapa.chave === "encerrado" ? "ok" : "info"}>
            <b>Status atual: ${etapa.label}.</b> ${etapa.mensagem}</${Alert}>
          <${LinhaDoTempoRelato} statusAtual=${etapa.chave} />
          <button class="btn btn-ghost" style=${{ padding: "6px 0" }} onClick=${() => setEntendaAberto(!entendaAberto)}>
            ${entendaAberto ? "Fechar explicação" : "Entenda o que acontece nesta etapa"}</button>
          ${entendaAberto && html`<p class="dica">${etapa.explicacao}</p>`}
          ${complementoEnviado && html`<${Alert} tone="ok"><b>Informação recebida.</b> Sua
            atualização foi adicionada a este protocolo e será considerada na análise do caso.</${Alert}>`}
          ${etapa.chave === "encerrado" && html`
            <${Acolhimento} icon="shield-check"><b>Devolutiva protegida.</b> Para preservar quem
              participou do caso, não detalhamos aqui as providências internas nem dados de outras
              pessoas envolvidas — só confirmamos que o caso foi concluído. Se você quiser entender
              melhor o desfecho, pode procurar o Gestor do Caso diretamente.</${Acolhimento}>`}
          <div class="acoes"><button class="btn btn-secondary" onClick=${() => setModoComplemento(true)}>
            <${Icon} name="edit" size=${16} />Adicionar nova informação</button></div>
          <${Acolhimento} icon="cpu"><b>Apoio inteligente.</b> A inteligência artificial auxilia a
            equipe responsável na análise das informações, identificação de situações semelhantes e
            organização das informações do caso. As decisões e providências são sempre validadas
            pelos profissionais responsáveis.</${Acolhimento}>
        ` : html`
          <p class="card-sub">O que aconteceu desde o último registro?</p>
          <div class="field"><textarea style=${{ minHeight: "110px" }} placeholder="Conte o que aconteceu..."
            value=${textoComplemento} onChange=${e => setTextoComplemento(e.target.value)}></textarea></div>
          <ul class="checklist">
            <li><label><input type="checkbox" checked=${voltouAcontecer} onChange=${e => setVoltouAcontecer(e.target.checked)} /> A situação voltou a acontecer</label></li>
            <li><label><input type="checkbox" checked=${continuaAcontecendo} onChange=${e => setContinuaAcontecendo(e.target.checked)} /> A situação continua acontecendo</label></li>
            <li><label><input type="checkbox" checked=${apenasAcrescentar} onChange=${e => setApenasAcrescentar(e.target.checked)} /> Quero apenas acrescentar informação</label></li>
          </ul>
          <div class="acoes">
            <button class="btn btn-ghost" onClick=${() => setModoComplemento(false)}>← Voltar</button>
            <button class="btn btn-primary" onClick=${enviarComplemento}>Enviar atualização</button>
          </div>
        `;
      })()}
    </${Modal}>`}

    ${confirmando && html`<${Modal} title="Recebemos o seu relato" onClose=${fecharConfirmacao}>
      <${Acolhimento}><b>Obrigado por confiar isso a nós.</b> Seu relato foi registrado com
        cuidado e sigilo — o protocolo já foi gerado e o Gestor do Caso foi notificado para cuidar
        dos próximos passos a partir de agora. Você não precisa resolver isso sozinho(a): nossa
        equipe está aqui para apoiar, e quem decide, em cada etapa, é sempre uma pessoa.</${Acolhimento}>
      <p class="dica">Se precisar de apoio imediato, procure um adulto de confiança na escola além
        de usar este sistema.</p>
      <div class="acoes"><button class="btn btn-warm" onClick=${fecharConfirmacao}>Ver meu relato</button></div>
    </${Modal}>`}
  </${ProfileShell}>`;
}

/* As raias "Sistema MGBE-IA" e "IA – Inteligência Artificial" do fluxograma não têm ator humano
   dedicado — a pedido do usuário, deixaram de ser perfis navegáveis próprios (TelaSistema/TelaIA
   existiram até a Atualização 9, ver histórico do plano) e seu conteúdo foi unido ao perfil
   Gestor do Caso logo abaixo, como os passos 1 ("Registrar dados do relato e gerar protocolo —
   Sistema MGBE-IA") e 3 ("Validar ou ajustar classificação — reúne as 4 tarefas da IA"). Nenhuma
   tarefa do fluxograma foi removida, só deixou de ter uma tela/rota própria. */

/* ============================================================== perfil 2 (raia) — Gestor do Caso
   Fluxograma v2: "Tomar ciência do caso e revisar análise da IA" → "Validar ou ajustar
   classificação e protocolo sugerido" → gateway "Qual a decisão do Gestor do Caso?" (Tratar
   diretamente / Atribuir à Equipe de Apoio / Escalonar para Gestão Escolar / Encerrar com
   justificativa) → ... → "Encerrar caso e registrar justificativa final" → "Arquivar caso e
   manter histórico" → Fim. Também aciona a Rede de Proteção direto (extensão do antigo
   "Acionar protocolo de urgência", ver plano Atualização 9) quando o caso é Crítico/Urgente. */
const SECOES_GESTOR = [
  { grupo: "Gestão dos casos" },
  { id: "visao", label: "Visão geral", icon: "bar-chart" },
  { id: "encerrados", label: "Casos encerrados", icon: "check-circle" },
  { grupo: "Inteligência" },
  { id: "alertas", label: "Alertas e recorrências", icon: "alert-triangle" }
];

function TelaGestor({ casos, arquivados = [], dispatch, navigate, colapsada, onColapsar }) {
  // "Análise e encaminhamento" deixou de ser um item de menu separado — a fila de casos e o
  // detalhe do caso agora vivem dentro do próprio "Visão geral" (fundidos a pedido do usuário),
  // que também é a seção de entrada.
  const [secao, setSecao] = useState("visao");
  function filtroGestor(c) {
    if (c.arquivadoEm) return false;
    // Um caso já validado/encaminhado pelo Gestor não some desta fila: ele continua aqui para
    // acompanhamento (botão "Acompanhar"), só sai quando é encerrado (desfecho) ou arquivado.
    if (secao === "visao") return !c.desfecho;
    if (secao === "encerrados") return !!c.desfecho;
    return !c.arquivadoEm;
  }
  const [pendentes, sel, selecionar] = useFilaCaso(casos, filtroGestor);
  // "Tomar ciência do caso" não é uma ação manual separada na prática — no momento em que o
  // Gestor do Caso abre/seleciona o caso, ele já está ciente dele. Em vez de um botão, a ciência
  // é registrada automaticamente assim que o caso selecionado ainda não tem cienciaEm.
  const selId = sel ? sel.id : null;
  const selCiente = sel ? !!sel.cienciaEm : true;
  useEffect(() => {
    if (selId && !selCiente) dispatch({ type: "TOMAR_CIENCIA", casoId: selId });
  }, [selId, selCiente]);
  const a = sel ? analisar(sel.relato) : null;
  const conf = sel ? calcularConfianca(a, sel) : null;
  const corr = sel ? correlacionarCaso(sel, casos, arquivados, a) : null;
  const [info, setInfo] = useState("");
  const [cat, setCat] = useState("");
  const [prio, setPrio] = useState("Baixa");
  const [resp, setResp] = useState("Coordenação pedagógica");
  const [justValidacao, setJustValidacao] = useState("");
  const [just, setJust] = useState("");
  const [statusDireto, setStatusDireto] = useState("em_analise");
  const [periodoDireto, setPeriodoDireto] = useState("30");
  const [proximaRevisaoDireto, setProximaRevisaoDireto] = useState("");
  const [obsDireto, setObsDireto] = useState("");
  const [registroDireto, setRegistroDireto] = useState("");
  // "Registrar encerramento"/"Arquivar caso" desabilitam a si mesmos assim que clicados — evitam
  // um segundo clique acidental disparar a ação de novo enquanto o modal de confirmação está
  // aberto ou o estado ainda não terminou de atualizar (o caso já sai da fila logo em seguida,
  // mas o botão fica indisponível desde o primeiro clique, não só depois do re-render).
  const [encerrando, setEncerrando] = useState(false);
  const [arquivando, setArquivando] = useState(false);
  // Passo 5 — Comunicação com responsáveis (documentação institucional, vira pré-requisito do
  // Encerramento, ver prontoParaEncerrar()).
  const [informadosResp, setInformadosResp] = useState("presencial");
  const [motivoNaoInformados, setMotivoNaoInformados] = useState("");
  const [concordaramEnc, setConcordaramEnc] = useState(true);
  const [motivoDiscordancia, setMotivoDiscordancia] = useState("");
  const [orientadosBO, setOrientadosBO] = useState(false);
  const [motivoBO, setMotivoBO] = useState("");
  // Comunicação legal ao Conselho Tutelar (dever incondicional, Lei 13.431/2017 art. 13) e
  // reabertura de caso (artigo MGBE-IA §6.3) — ambos registros simples, sem estado de "salvando"
  // (mesma lição do botão de Arquivar que ficava travado: dispatch direto, sem disable-tracking).
  const [observacaoLegal, setObservacaoLegal] = useState("");
  const [justificativaReabertura, setJustificativaReabertura] = useState("");
  // Aba ativa da interface em passos (1 a 9) — sempre reaberta na aba 1 (ver bloco de reset
  // abaixo e o comentário perto de AbasPasso sobre por que não "pousar" na etapa pendente).
  const [abaAtiva, setAbaAtiva] = useState(1);
  // Linha de protocolo sugerida pela IA (passo 3): geração manual, com uma simulação de
  // processamento (fases + barra) pra deixar visível que existe um passo de IA rodando, em vez
  // de a sugestão simplesmente já aparecer pronta. "idle" = ainda não gerou; "gerando" = animação
  // em curso; "pronto" = mostra o resultado (já calculado por analisar(), só fica escondido até
  // aqui). Caso já validado abre direto em "pronto" — não faz sentido pedir pra gerar de novo algo
  // que já foi decidido.
  const [protocoloIA, setProtocoloIA] = useState("pronto");
  const [faseIA, setFaseIA] = useState(0);
  // Mesmo padrão do protocolo, mas independente: o Gestor pode gerar um sem o outro. O protocolo
  // é a linha de ação aplicável ao caso; os insights são ações extras que PODEM ser aplicadas,
  // por isso viram botões (e cores) separados em vez de um "gerar tudo" só.
  const [insightsIA, setInsightsIA] = useState("pronto");
  const [faseInsights, setFaseInsights] = useState(0);
  // "Casos encerrados" mistura casos reais arquivados com os SEED_ARQUIVADOS estáticos de
  // demonstração — nenhum dos dois garante um `id` estável (os seeds não têm), por isso o modal
  // de consulta é indexado pelo protocolo, que é único e sempre existe nos dois formatos.
  const [verEncerradoProtocolo, setVerEncerradoProtocolo] = useState(null);
  // Reseta os campos do formulário de validação quando a seleção muda de caso.
  const [ultimoSelId, setUltimoSelId] = useState(null);
  if (sel && sel.id !== ultimoSelId) {
    setUltimoSelId(sel.id);
    setInfo(sel.infoComplementar || "");
    setCat(a.categoria);
    setPrio(a.prioridade);
    setJustValidacao("");
    const td = sel.tratamentoDireto || {};
    setStatusDireto(td.status || "em_analise");
    setPeriodoDireto(String(td.periodoDias || 30));
    setProximaRevisaoDireto(td.proximaRevisao || "");
    setObsDireto(td.observacao || "");
    setRegistroDireto("");
    setEncerrando(false);
    setArquivando(false);
    const cr = sel.comunicacaoResponsaveis || {};
    setInformadosResp(cr.informados || "presencial");
    setMotivoNaoInformados(cr.motivoNaoInformados || "");
    setConcordaramEnc(cr.concordaramEncaminhamentos !== undefined ? cr.concordaramEncaminhamentos : true);
    setMotivoDiscordancia(cr.motivoDiscordancia || "");
    setOrientadosBO(cr.orientadosBO !== undefined ? cr.orientadosBO : false);
    setMotivoBO(cr.motivoBO || "");
    setObservacaoLegal("");
    setJustificativaReabertura("");
    setAbaAtiva(1);
    setProtocoloIA(sel.validacao ? "pronto" : "idle");
    setFaseIA(0);
    setInsightsIA(sel.validacao ? "pronto" : "idle");
    setFaseInsights(0);
  }
  const validado = !!(sel && sel.validacao);
  const critico = sel ? isCritico(sel) : false;

  const FASES_IA = ["Cruzando os achados do relato com o protocolo institucional…",
    "Selecionando as medidas aplicáveis à categoria sugerida…",
    "Montando a linha de ação recomendada…"];
  function gerarProtocoloIA() {
    setProtocoloIA("gerando");
    setFaseIA(0);
    let i = 0;
    const intervalo = setInterval(() => { i++; setFaseIA(i % FASES_IA.length); }, 650);
    setTimeout(() => { clearInterval(intervalo); setProtocoloIA("pronto"); }, 2100);
  }

  const FASES_INSIGHTS = ["Analisando o perfil da situação relatada…",
    "Cruzando com medidas pedagógicas, psicológicas e disciplinares…",
    "Selecionando os insights aplicáveis a este caso…"];
  function gerarInsightsIA() {
    setInsightsIA("gerando");
    setFaseInsights(0);
    let i = 0;
    const intervalo = setInterval(() => { i++; setFaseInsights(i % FASES_INSIGHTS.length); }, 650);
    setTimeout(() => { clearInterval(intervalo); setInsightsIA("pronto"); }, 2100);
  }

  function salvarInfo() {
    dispatch({ type: "SALVAR_INFO_COMPLEMENTAR", casoId: sel.id, texto: info.trim() });
  }
  function decidir(forcado) {
    const alterado = forcado || cat !== a.categoria || prio !== a.prioridade;
    dispatch({
      type: "VALIDAR", casoId: sel.id,
      ia: { categoria: a.categoria, prioridade: a.prioridade, motivo: a.motivo },
      validacao: { categoria: cat, prioridade: prio, responsavel: resp, justificativa: justValidacao.trim() || null, alterado, em: new Date().toISOString() }
    });
  }
  function corrigir() {
    if (cat === a.categoria && prio === a.prioridade) { showAviso("Altere a categoria ou a prioridade antes de registrar a correção."); return; }
    decidir(true);
  }
  function encaminhar(decisao) {
    dispatch({ type: "DECIDIR_ENCAMINHAMENTO", casoId: sel.id, decisao });
  }
  function salvarTratamentoDireto() {
    if (statusDireto === "em_acompanhamento" && !periodoDireto) {
      showAviso("Defina o período de acompanhamento antes de salvar."); return;
    }
    dispatch({ type: "GESTOR_ATUALIZAR_TRATAMENTO_DIRETO", casoId: sel.id,
      status: statusDireto,
      periodoDias: statusDireto === "em_acompanhamento" ? periodoDireto : null,
      proximaRevisao: statusDireto === "em_acompanhamento" ? proximaRevisaoDireto : null,
      observacao: obsDireto.trim() });
  }
  function registrarAcompanhamentoDireto() {
    if (!registroDireto.trim()) { showAviso("Descreva o acompanhamento antes de registrar."); return; }
    dispatch({ type: "GESTOR_REGISTRAR_ACOMPANHAMENTO", casoId: sel.id, texto: registroDireto.trim() });
    setRegistroDireto("");
  }
  function salvarComunicacaoResponsaveis() {
    if (informadosResp === "nao" && !motivoNaoInformados.trim()) {
      showAviso("Informe o motivo de os responsáveis não terem sido comunicados."); return;
    }
    if (!concordaramEnc && !motivoDiscordancia.trim()) {
      showAviso("Informe o motivo da discordância com os encaminhamentos."); return;
    }
    if (!orientadosBO && !motivoBO.trim()) {
      showAviso("Informe o motivo de não terem sido orientados a registrar Boletim de Ocorrência."); return;
    }
    dispatch({ type: "GESTOR_REGISTRAR_COMUNICACAO_RESPONSAVEIS", casoId: sel.id,
      informados: informadosResp, motivoNaoInformados: informadosResp === "nao" ? motivoNaoInformados.trim() : null,
      concordaramEncaminhamentos: concordaramEnc, motivoDiscordancia: !concordaramEnc ? motivoDiscordancia.trim() : null,
      orientadosBO, motivoBO: !orientadosBO ? motivoBO.trim() : null
    });
  }
  function registrarComunicacaoLegal() {
    dispatch({ type: "GESTOR_REGISTRAR_COMUNICACAO_LEGAL", casoId: sel.id, observacao: observacaoLegal.trim() });
  }
  function reabrirCaso(casoId) {
    // Recebe o id explicitamente: chamado a partir de "Casos encerrados", onde o caso em vista
    // (verEncerrado) pode ser diferente do caso atualmente selecionado na fila principal (sel).
    if (!justificativaReabertura.trim()) { showAviso("Descreva os novos fatos antes de reabrir o caso."); return; }
    dispatch({ type: "REABRIR_CASO", casoId, justificativa: justificativaReabertura.trim() });
    setJustificativaReabertura("");
  }
  function encerrar() {
    dispatch({ type: "ENCERRAR", casoId: sel.id, justificativa: just.trim() });
  }

  const ENCAMINHAMENTO_LABEL = { tratar: "Tratar diretamente", equipe: "Atribuir à Equipe de Apoio", escalonar: "Escalonar para Gestão Escolar", encerrar: "Encerrar com justificativa" };
  const pronto = sel ? prontoParaEncerrar(sel) : false;
  const statusPasso = sel ? calcularStatusPassoGestor(sel, validado, pronto) : {};
  useAvancoAutomatico(3, validado, abaAtiva, setAbaAtiva, statusPasso);
  useAvancoAutomatico(4, !!(sel && sel.encaminhamento), abaAtiva, setAbaAtiva, statusPasso);
  useAvancoAutomatico(5, !!(sel && sel.comunicacaoResponsaveis), abaAtiva, setAbaAtiva, statusPasso);
  useAvancoAutomatico(6, !!(sel && sel.tratamentoDireto && sel.tratamentoDireto.status === "pronto_encerrar"), abaAtiva, setAbaAtiva, statusPasso);
  useAvancoAutomatico(7, !!(sel && sel.urgencia), abaAtiva, setAbaAtiva, statusPasso);
  useAvancoAutomatico(8, !!(sel && sel.desfecho), abaAtiva, setAbaAtiva, statusPasso);

  return html`<${ProfileShell} profile="gestor" navigate=${navigate} casos=${casos}
    secoes=${SECOES_GESTOR} ativa=${secao} onTrocar=${s => { selecionar(null); setSecao(s); }} colapsada=${colapsada} onColapsar=${onColapsar}>

    ${secao === "visao" && (!sel
      ? html`
          <div class="tiles">
            <div class="tile"><div class="n">${pendentes.length}</div><div class="lbl">Casos sob minha gestão</div></div>
            <div class="tile"><div class="n">${pendentes.filter(c => !c.validacao).length}</div><div class="lbl">Aguardando validação</div></div>
            <div class="tile"><div class="n">${pendentes.filter(c => isCritico(c)).length}</div><div class="lbl">Casos críticos</div></div>
            <div class="tile"><div class="n">${pendentes.filter(c => c.encaminhamento && !prontoParaEncerrar(c)).length}</div><div class="lbl">Em acompanhamento</div></div>
          </div>
          <${DestaqueIAPerfil}
            titulo="Resumo inteligente da fila"
            subtitulo="A IA organiza sinais e pendências para apoiar a priorização do Gestor do Caso."
            itens=${[
              { rotulo: "Validação pendente", valor: pendentes.filter(c => !c.validacao).length + " caso(s)", dica: "Recomendações aguardando decisão humana." },
              { rotulo: "Possível recorrência", valor: pendentes.filter(c => analisar(c.relato).recorrencia.length > 0).length + " alerta(s)", dica: "Sinal derivado dos relatos atuais." },
              { rotulo: "Casos críticos", valor: pendentes.filter(c => isCritico(c)).length + " caso(s)", dica: "Podem exigir Rede de Proteção." }
            ]}
            recomendacao="Comece pelos casos sem validação humana e pelos casos críticos. Depois revise acompanhamentos que estejam próximos do prazo."
            aviso="Esta priorização é assistiva. A responsabilidade pelo encaminhamento continua sendo do Gestor do Caso."
          />
          <div class="actor-head"><h1>Análise e encaminhamento</h1>
          <p class="lede">Casos sob sua análise e decisão. Um caso já validado e encaminhado
            continua aqui para acompanhamento, mesmo sem precisar de nova ação sua.</p></div>
          ${pendentes.length
            ? html`<${FilaTabela} casos=${pendentes} selecionadoId=${null} onSelecionar=${selecionar}
                labelAcao=${c => (c.validacao && c.encaminhamento) ? "Acompanhar" : "Abrir caso"} />`
            : html`<${Alert} tone="info">Nenhum caso neste status no momento.</${Alert}>`}`
      : html`
    <div class="acoes" style=${{ marginTop: 0, marginBottom: "12px" }}>
      <button class="btn btn-ghost" onClick=${() => selecionar(null)}>← Voltar para a fila</button>
    </div>

    <details class="rodape-papel" style=${{ margin: "0 0 16px" }}>
      <summary><${Icon} name="info" size=${14} /> Histórico completo do caso — todas as raias envolvidas</summary>
      <div class="rodape-papel-corpo"><${LinhaDoTempo} kase=${sel} /></div>
    </details>

    <${AbasPasso} passos=${TITULOS_PASSO_GESTOR.map(t => ({ ...t, status: statusPasso[t.n] }))}
      ativa=${abaAtiva} onSelecionar=${setAbaAtiva} />

    ${abaAtiva === 1 && html`
    <${StepCard} n=${1} title="Registrar dados do relato e gerar protocolo (Sistema MGBE-IA)" status=${statusPasso[1]}>
      <p class="card-sub">Reúne as 4 tarefas automáticas da raia Sistema MGBE-IA do fluxograma —
        validar campos mínimos, gerar protocolo, registrar dados do relato e notificar o Gestor
        do Caso —, todas concluídas no mesmo instante do envio.</p>
      <table class="tbl">
        <tr><th>Protocolo</th><td class="proto-num" style=${{ padding: "4px 0" }}>${sel.protocolo}</td></tr>
        <tr><th>Registrado em</th><td>${quando(sel.enviadoEm)}</td></tr>
        <tr><th>Canal</th><td>${sel.anonimoSemLogin ? "Canal público (sem login)" : "Sistema (usuário logado)"}</td></tr>
        <tr><th>Identificação</th><td>${sel.identificacao === "anonimo" ? "Anônimo" : "Identificado"}</td></tr>
        ${sel.identificacaoDados && html`
          <tr><th>Nome</th><td>${esc(sel.identificacaoDados.nome)}</td></tr>
          <tr><th>Vínculo</th><td>${esc(sel.identificacaoDados.vinculo)}</td></tr>
          ${sel.identificacaoDados.turma && html`<tr><th>Turma/série</th><td>${esc(sel.identificacaoDados.turma)}</td></tr>`}
          ${sel.identificacaoDados.contato && html`<tr><th>Telefone</th><td>${esc(sel.identificacaoDados.contato)}</td></tr>`}
        `}
        ${sel.local && html`<tr><th>Local</th><td>${esc(sel.local)}</td></tr>`}
        ${sel.quando && html`<tr><th>Data aproximada</th><td>${esc(sel.quando)}</td></tr>`}
        ${sel.evidencia && html`<tr><th>Evidência informada</th><td>${esc(sel.evidencia)}</td></tr>`}
      </table>
    </${StepCard}>
    <${BotaoAvancarPasso} passoAtual=${1} statusPasso=${statusPasso} onAvancar=${setAbaAtiva} />
    `}

    ${abaAtiva === 2 && html`
    <${StepCard} n=${2} title="Tomar ciência do caso e revisar análise da IA" status=${statusPasso[2]}>
      <p class="dica">${sel.cienciaEm && ("Ciência registrada em " + quando(sel.cienciaEm) + ".")}</p>
      <p style=${{ whiteSpace: "pre-wrap" }}>${sel.relato}</p>
      <div class="field"><label>Informações complementares (opcional)</label>
        <textarea style=${{ minHeight: "70px" }} placeholder="Ex.: histórico do estudante, contexto adicional relatado por professores..."
          value=${info} onChange=${e => setInfo(e.target.value)}></textarea></div>
      <div class="acoes"><button class="btn btn-secondary" onClick=${salvarInfo}>Salvar informações complementares</button></div>
      ${sel.infoComplementar && html`<p class="dica">Salvo: "${esc(sel.infoComplementar) || "(sem observações adicionais)"}"</p>`}
      ${(sel.atualizacoesComunicante || []).length > 0 && html`
        <${Alert} tone="info"><b>O Comunicante enviou ${sel.atualizacoesComunicante.length}
          atualização(ões) neste protocolo.</b></${Alert}>
        <ul class="timeline">
          ${sel.atualizacoesComunicante.map((u, i) => html`<li key=${i}>
            <div class="quando">${quando(u.em)}</div><b>Nova informação do Comunicante</b>
            <div style=${{ whiteSpace: "pre-wrap" }}>${esc(u.texto)}</div>
            ${(u.recorrencia || u.continua) && html`<div class="dica">${[
              u.recorrencia && "Situação voltou a acontecer", u.continua && "Situação continua acontecendo"
            ].filter(Boolean).join(" · ")}</div>`}
          </li>`)}
        </ul>
      `}
    </${StepCard}>
    <${BotaoAvancarPasso} passoAtual=${2} statusPasso=${statusPasso} onAvancar=${setAbaAtiva} />
    `}

    ${abaAtiva === 3 && html`
    <${StepCard} n=${3} title="Validar ou ajustar classificação e protocolo sugerido" status=${statusPasso[3]}>
      <div class="ia-protagonista">
        <div class="ia-protagonista-head"><div><div class="ia-protagonista-titulo"><span class="ia-protagonista-icone"><${Icon} name="cpu" size=${17} /></span>Análise inteligente do caso</div></div><span class="badge badge-neutro">Resultado da IA</span></div>
        <p class="card-sub" style=${{ margin: "0 0 10px" }}>Reúne as 4 tarefas da raia IA do
          fluxograma: analisar o relato (PLN), classificar o tipo de ocorrência, avaliar risco e
          prioridade, e sugerir um protocolo de ação — sempre com justificativa explicável.</p>

        <div class="quote-relato">
          <div class="rotulo">Relato analisado</div>
          <p style=${{ whiteSpace: "pre-wrap", margin: 0 }} dangerouslySetInnerHTML=${{ __html: destacar(sel.relato, a) }}></p>
        </div>

        <div class="tiles">
          <div class="tile">
            <div class="lbl">Classificação sugerida</div>
            <div class="n" style=${{ fontSize: "17px" }}>${a.achados.length ? a.categoria : "Inconclusiva"}</div>
            <p class="dica" style=${{ margin: "4px 0 0" }}>${a.achados.length
              ? "Baseada nas regras de palavra-chave disparadas."
              : "Nenhuma regra de palavra-chave foi disparada — informação insuficiente para classificar com segurança."}</p>
          </div>
          <div class="tile">
            <div class="lbl">Prioridade sugerida</div>
            <div class="n" style=${{ fontSize: "17px" }}><${Badge} tone=${toneFor(a.prioridade)}>${a.prioridade}</${Badge}></div>
            <p class="dica" style=${{ margin: "4px 0 0" }}>${a.motivo}</p>
          </div>
          <div class="tile">
            <div class="lbl">Confiança da análise</div>
            <div class="n" style=${{ fontSize: "17px" }}>${conf.pct}%</div>
            <p class="dica" style=${{ margin: "4px 0 6px" }}>${conf.motivo}</p>
            <div class="maturity-track"><div class="maturity-fill" style=${{ width: conf.pct + "%",
              background: conf.pct < 40 ? "var(--danger)" : conf.pct < 70 ? "var(--warn)" : "var(--ok)" }}></div></div>
          </div>
        </div>

        <${SinaisTriagem} a=${a} />
        <div class="porque" dangerouslySetInnerHTML=${{ __html: porqueHTML(a) }}></div>

        ${!validado && html`
          <div class="bloco-correlacao">
            <b><${Icon} name="search" size=${14} /> Padrões, contexto e possível recorrência</b>
            <div class="tiles" style=${{ marginTop: "8px" }}>
              <div class="tile"><div class="lbl">Pessoa mencionada</div><div class="n" style=${{ fontSize: "15px" }}>
                ${corr.pessoaMencionada === null ? "Não informado" : corr.pessoaMencionada === 0 ? "Nenhum relato relacionado" : corr.pessoaMencionada + " relato(s) relacionado(s)"}</div></div>
              <div class="tile"><div class="lbl">Turma / série</div><div class="n" style=${{ fontSize: "15px" }}>
                ${corr.turmaSerie === null ? "Não informado" : corr.turmaSerie === 0 ? "Nenhum padrão relevante" : corr.turmaSerie + " caso(s) na mesma turma"}</div></div>
              <div class="tile"><div class="lbl">Casos similares (90 dias)</div><div class="n" style=${{ fontSize: "15px" }}>
                ${!corr.temCategoria ? "Não avaliável" : corr.casosSimilares + " caso(s) similar(es)"}</div></div>
              <div class="tile"><div class="lbl">Similaridade temática</div><div class="n" style=${{ fontSize: "15px" }}>${corr.similaridade}</div></div>
            </div>
            <p class="dica" style=${{ marginTop: "8px" }}><b>Interpretação:</b> são contagens reais
              sobre os próprios casos do sistema (mesma pessoa mencionada, mesma turma, categoria em
              comum em até 90 dias) — não confirmam nem descartam bullying, autoria ou culpabilidade
              sozinhas. Cabe ao Gestor do Caso verificar manualmente antes de decidir.</p>
          </div>
        `}

        <div class="grid-2">
          <div>
            ${protocoloIA === "idle" ? html`
              <div class="recomendacao-principal recomendacao-ia-idle">
                <h4><${Icon} name="clipboard-check" size=${15} /> Linha de protocolo sugerida pela IA</h4>
                <p class="card-sub" style=${{ margin: "0 0 12px" }}>A linha de ação aplicável a
                  este caso, cruzando os achados do relato com o protocolo institucional. Isso não
                  é automático — só roda quando o Gestor pedir.</p>
                <div class="acoes" style=${{ marginTop: 0 }}>
                  <button class="btn btn-ia" onClick=${gerarProtocoloIA}>
                    <${Icon} name="sparkles" size=${16} />Gerar protocolo com IA</button>
                </div>
              </div>
            ` : protocoloIA === "gerando" ? html`
              <div class="recomendacao-principal ia-processando">
                <h4><${Icon} name="clipboard-check" size=${15} /> Linha de protocolo sugerida pela IA</h4>
                <div class="ia-processando-corpo">
                  <span class="ia-processando-icone"><${Icon} name="sparkles" size=${20} /></span>
                  <div class="ia-processando-info">
                    <div class="ia-processando-texto">${FASES_IA[faseIA]}</div>
                    <div class="ia-processando-barra"><div class="ia-processando-fill"></div></div>
                  </div>
                </div>
              </div>
            ` : html`
              <div class="recomendacao-principal">
                <h4><${Icon} name="clipboard-check" size=${15} /> Linha de protocolo sugerida pela IA</h4>
