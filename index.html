/* ============================================================== administração — perfis e permissões
   Semente do futuro "menu gerencial" (ainda não construído) — por ora, só a gestão de usuários e
   quais das 8 raias cada um acessa. Só o Administrador chega aqui. */
const SECOES_ADMIN = [
  { grupo: "Administração" },
  { id: "usuarios", label: "Usuários e permissões", icon: "users" },
  { id: "protocolos", label: "Protocolos institucionais", icon: "clipboard-check" },
  { grupo: "IA e qualidade" },
  { id: "parametros-ia", label: "Parâmetros da IA", icon: "cpu" },
  { id: "palavras-chave", label: "Palavras-chave do motor", icon: "shield" },
  { id: "monitoramento-ia", label: "Monitoramento da IA", icon: "bar-chart" },
  { grupo: "Segurança" },
  { id: "auditoria", label: "Auditoria", icon: "file-text" },
  { id: "dados", label: "Proteção de dados", icon: "lock" }
];

function TelaAdministracao({ usuarios, onTogglePerfil, onToggleAdmin, onSalvarPerfis, onVoltar, colapsada, onColapsar }) {
  const [secao, setSecao] = useState("usuarios");
  const [novosTermos, setNovosTermos] = useState({});
  const [novaCategoria, setNovaCategoria] = useState("");
  const [versaoRegras, setVersaoRegras] = useState(0);

  // Marcar um perfil diferente do padrão (Comunicante) fica só como rascunho local até o Admin
  // clicar "Confirmar" -- evita conceder/revogar uma raia sensível com um clique só sem querer.
  const [rascunhos, setRascunhos] = useState({});
  function alternarRascunho(u, perfilId) {
    setRascunhos(r => {
      const base = r[u.id] || u.perfisPermitidos;
      const novo = base.includes(perfilId) ? base.filter(p => p !== perfilId) : [...base, perfilId];
      return { ...r, [u.id]: novo };
    });
  }
  function confirmarRascunho(u) {
    onSalvarPerfis(u.id, rascunhos[u.id]);
    setRascunhos(r => { const c = { ...r }; delete c[u.id]; return c; });
  }
  function cancelarRascunho(u) {
    setRascunhos(r => { const c = { ...r }; delete c[u.id]; return c; });
  }

  // Redefinir senha de outra conta sem depender de e-mail: chama a Edge Function
  // "admin-reset-password" (guarda a service_role key no servidor, nunca no navegador — ver
  // supabase/functions/admin-reset-password/index.ts) usando o token da própria sessão do Admin
  // pra provar quem está pedindo. A função confere de novo, no servidor, que quem chamou é admin.
  const [redefinindoId, setRedefinindoId] = useState(null);
  const [novaSenhaAdmin, setNovaSenhaAdmin] = useState("");
  const [salvandoSenha, setSalvandoSenha] = useState(false);
  async function redefinirSenha(userId) {
    if (novaSenhaAdmin.length < 6) { showAviso("A senha precisa ter pelo menos 6 caracteres."); return; }
    setSalvandoSenha(true);
    const { data: sessaoAtual } = await sb.auth.getSession();
    const resp = await fetch(SUPABASE_URL + "/functions/v1/admin-reset-password", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + sessaoAtual.session.access_token },
      body: JSON.stringify({ userId, novaSenha: novaSenhaAdmin })
    });
    const resultado = await resp.json();
    setSalvandoSenha(false);
    if (!resp.ok) { showAviso("Não foi possível redefinir a senha: " + (resultado.error || resp.statusText)); return; }
    showAviso("Senha redefinida com sucesso.");
    setRedefinindoId(null);
    setNovaSenhaAdmin("");
  }

  function setNovoTermo(chave, valor) { setNovosTermos(nt => ({ ...nt, [chave]: valor })); }
  function handleAdicionarTermoCategoria(categoriaId) {
    if (regrasAdicionarTermo(categoriaId, novosTermos[categoriaId])) { setNovoTermo(categoriaId, ""); setVersaoRegras(v => v + 1); }
  }
  function handleRemoverTermoCategoria(categoriaId, termo) { regrasRemoverTermo(categoriaId, termo); setVersaoRegras(v => v + 1); }
  function handleAdicionarCategoria() {
    if (regrasAdicionarCategoria(novaCategoria)) { setNovaCategoria(""); setVersaoRegras(v => v + 1); }
  }
  function handleRemoverCategoria(categoriaId) { regrasRemoverCategoria(categoriaId); setVersaoRegras(v => v + 1); }
  function handleAdicionarTermoLista(lista, chave) {
    if (listaAdicionarTermo(lista, novosTermos[chave])) { setNovoTermo(chave, ""); setVersaoRegras(v => v + 1); }
  }
  function handleRemoverTermoLista(lista, termo) { listaRemoverTermo(lista, termo); setVersaoRegras(v => v + 1); }

  return html`<${ProfileShell} titulo="Administração" subtitulo="Semente do futuro menu gerencial — por
      enquanto, usuários/permissões e as palavras-chave do motor de análise."
    secoes=${SECOES_ADMIN} ativa=${secao} onTrocar=${setSecao} onVoltar=${onVoltar}
    colapsada=${colapsada} onColapsar=${onColapsar}>

        ${secao === "usuarios" && html`
          <${Alert} tone="info">Contas são criadas pela própria pessoa em "Criar conta", na tela
            de login — já nascem com o perfil Comunicante liberado. Aqui o Admin concede/revoga os
            demais perfis. Marcar um perfil diferente do padrão (Comunicante) só entra em vigor
            depois de clicar em "Confirmar" na linha da pessoa.</${Alert}>
          <div class="card" style=${{ overflowX: "auto" }}>
            <h3>Usuários e permissões</h3>
            ${usuarios.length === 0
              ? html`<p class="dica">Nenhuma conta cadastrada ainda.</p>`
              : html`<table class="tbl">
              <thead><tr>
                <th>Usuário</th>
                ${ACTORS.map(a => html`<th key=${a.id}>${a.label}</th>`)}
                <th>Admin</th>
                <th>Alterações</th>
                <th>Senha</th>
              </tr></thead>
              <tbody>
                ${usuarios.map(u => { const rascunho = rascunhos[u.id]; const perfisExibidos = rascunho || u.perfisPermitidos;
                  const pendente = !!rascunho && JSON.stringify([...rascunho].sort()) !== JSON.stringify([...u.perfisPermitidos].sort());
                  return html`<tr key=${u.id}>
                  <td><b>${u.nome}</b><br /><span class="dica" style=${{ margin: 0 }}>${u.cargo || "Sem cargo informado"}${u.admin ? " · Administrador" : ""}</span></td>
                  ${ACTORS.map(a => html`<td key=${a.id}>
                    ${a.id === "comunicante"
                      ? html`<input type="checkbox" checked=${u.perfisPermitidos.includes("comunicante")} onChange=${() => onTogglePerfil(u.id, "comunicante")} />`
                      : html`<input type="checkbox" checked=${perfisExibidos.includes(a.id)} onChange=${() => alternarRascunho(u, a.id)} />`}</td>`)}
                  <td><input type="checkbox" checked=${!!u.admin} onChange=${() => onToggleAdmin(u.id)} /></td>
                  <td style=${{ minWidth: "160px" }}>
                    ${pendente && html`<div class="acoes" style=${{ marginTop: 0 }}>
                      <button class="btn btn-primary" onClick=${() => confirmarRascunho(u)}>Confirmar</button>
                      <button class="btn btn-secondary" onClick=${() => cancelarRascunho(u)}>Cancelar</button>
                    </div>`}
                  </td>
                  <td style=${{ minWidth: "220px" }}>
                    ${redefinindoId === u.id
                      ? html`<div style=${{ display: "flex", gap: "6px", alignItems: "center" }}>
                          <${CampoSenha} placeholder="Senha nova" style=${{ width: "150px" }}
                            value=${novaSenhaAdmin} onChange=${e => setNovaSenhaAdmin(e.target.value)} disabled=${salvandoSenha} />
                          <button class="btn btn-primary" disabled=${salvandoSenha} onClick=${() => redefinirSenha(u.id)}>
                            ${salvandoSenha ? "…" : "Salvar"}</button>
                          <button class="btn btn-secondary" disabled=${salvandoSenha}
                            onClick=${() => { setRedefinindoId(null); setNovaSenhaAdmin(""); }}>Cancelar</button>
                        </div>`
                      : html`<button class="btn btn-secondary" onClick=${() => { setRedefinindoId(u.id); setNovaSenhaAdmin(""); }}>
                          Redefinir senha</button>`}
                  </td>
                </tr>`; })}
              </tbody>
            </table>`}
          </div>
        `}

        ${secao === "palavras-chave" && html`
          <${Alert} tone="warn"><b>Isso altera o motor de análise em tempo real.</b> Qualquer
            relato analisado pelo Sistema MGBE-IA depois de uma mudança aqui já usa as regras
            atualizadas — mesmo relatos enviados antes, se ainda não tiverem passado pela análise.</${Alert}>

          ${REGRAS.map(cat => html`<div class="card" key=${cat.id + "-" + versaoRegras}>
            <h3 style=${{ justifyContent: "space-between" }}>
              <span style=${{ display: "flex", alignItems: "center", gap: "9px" }}><${Icon} name="shield" size=${16} />${cat.rotulo}</span>
              <button class="btn-icon" title="Remover categoria" onClick=${() => handleRemoverCategoria(cat.id)}><${Icon} name="x-circle" size=${16} /></button>
            </h3>
            <p class="card-sub">${cat.termos.length} termo(s) disparam esta categoria.</p>
            <div class="termos-lista">
              ${cat.termos.map(t => html`<span class="termo-chip" key=${t}>${t}
                <button title="Remover termo" onClick=${() => handleRemoverTermoCategoria(cat.id, t)}><${Icon} name="x-circle" size=${13} /></button></span>`)}
              ${cat.termos.length === 0 && html`<span class="dica">Nenhum termo cadastrado — esta categoria nunca vai disparar.</span>`}
            </div>
            <div class="acoes" style=${{ marginTop: "10px" }}>
              <input type="text" style=${{ maxWidth: "240px" }} placeholder="novo termo..."
                value=${novosTermos[cat.id] || ""} onChange=${e => setNovoTermo(cat.id, e.target.value)} />
              <button class="btn btn-secondary" onClick=${() => handleAdicionarTermoCategoria(cat.id)}>Adicionar termo</button>
            </div>
          </div>`)}

          <div class="card">
            <h3>Nova categoria de regra</h3>
            <p class="card-sub">Cria uma categoria vazia — adicione termos a ela depois de criada.</p>
            <div class="acoes" style=${{ marginTop: 0 }}>
              <input type="text" style=${{ maxWidth: "260px" }} placeholder="Ex.: Discurso de ódio"
                value=${novaCategoria} onChange=${e => setNovaCategoria(e.target.value)} />
              <button class="btn btn-primary" onClick=${handleAdicionarCategoria}>Adicionar categoria</button>

/* ============================================================== app raiz */
function App() {
  const [profile, navigate] = useHashRoute("comunicante");
  // Sidebar única, recolhível — estado vive aqui (não em ProfileShell) pra persistir a
  // preferência ao trocar de perfil, já que cada Tela* é um componente diferente que remonta.
  const [colapsada, setColapsada] = useState(false);

  /* ============================================================ autenticação (Supabase Auth)
     sessao: undefined = ainda checando se já existe sessão salva; null = deslogado; objeto =
     logado. perfil: dados da tabela `perfis` (nome/cargo/perfis_permitidos/admin) ligados à
     sessão — carrega logo depois da sessão existir. */
  const [sessao, setSessao] = useState(undefined);
  const [perfil, setPerfil] = useState(undefined);
  const [modoCadastro, setModoCadastro] = useState(false);
  // Link de "esqueci minha senha" (e-mail) chega com #access_token=...&type=recovery na URL; o
  // próprio SDK do Supabase detecta isso sozinho (detectSessionInUrl, ligado por padrão) e cria
  // uma sessão temporária, avisando com o evento especial abaixo — não precisamos parsear o hash
  // à mão. Essa sessão só serve pra confirmar quem é a pessoa e trocar a senha, nada mais.
  const [modoRecuperacao, setModoRecuperacao] = useState(false);

  useEffect(() => {
    // sb fica null se o SDK (carregado via CDN, ver head.html) não tiver terminado de
    // carregar — sem internet, ou numa rede lenta. Sem isso, um `useEffect` chamando `.auth` de
    // `null` derrubaria a árvore inteira com um erro não tratado, em vez de mostrar aviso.
    if (!sb) { showAviso("Não foi possível conectar ao banco. Verifique sua internet e recarregue a página."); setSessao(null); return; }
    sb.auth.getSession().then(({ data }) => setSessao(data.session || null));
    const { data: assinatura } = sb.auth.onAuthStateChange((evento, novaSessao) => {
      if (evento === "PASSWORD_RECOVERY") setModoRecuperacao(true);
      setSessao(novaSessao);
    });
    return () => assinatura.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!sessao) { setPerfil(sessao === null ? null : undefined); return; }
    sb.from("perfis").select("*").eq("id", sessao.user.id).single().then(({ data, error }) => {
      if (error) { showAviso("Erro ao carregar seu perfil: " + error.message); setPerfil(null); return; }
      setPerfil(data);
    });
  }, [sessao]);

  const usuarioLogado = perfil ? {
    id: perfil.id, nome: perfil.nome, cargo: perfil.cargo,
    perfisPermitidos: perfil.perfis_permitidos || [], admin: !!perfil.admin
  } : null;

  /* ============================================================ casos (Supabase + tempo real)
     caseReducer/casosReducer continuam intocados — só mudou ONDE o resultado é guardado. Cada
     dispatch calcula o próximo estado localmente (mesma lógica pura de sempre) e depois grava só
     o caso que mudou/nasceu no Supabase; a assinatura realtime aplica o que outros dispositivos
     gravarem. */
  const [casos, setCasos] = useState([]);
  // Contador de versão dos casos — a raia "rede" não recebe mais o array de casos (RLS/
  // Atualização 13: ela não tem NENHUM acesso de leitura a `casos` no banco), então não pode
  // reagir ao array mudando. Em vez disso, ela observa este número (bumped tanto pelo realtime
  // quanto por um dispatch local bem-sucedido) e refaz o RPC agregado quando ele muda.
  const [casosVersao, setCasosVersao] = useState(0);
  useEffect(() => {
    // Sem sessão (tela de login, ou visitante no canal anônimo) não há por que carregar/assinar
    // casos — a política de RLS de leitura é só para `authenticated` mesmo, então nem tentar.
    if (!sessao) { setCasos([]); return; }
    let cancelado = false;
    sb.from("casos").select("dados").then(({ data, error }) => {
      if (cancelado) return;
      if (error) { showAviso("Erro ao carregar casos: " + error.message); return; }
      setCasos(data.map(r => r.dados));
    });
    const canal = sb.channel("casos-rt").on("postgres_changes",
      { event: "*", schema: "public", table: "casos" },
      payload => {
        setCasosVersao(v => v + 1);
        if (payload.eventType === "DELETE") {
          setCasos(prev => prev.filter(c => c.id !== payload.old.id));
          return;
        }
        const casoNovo = payload.new.dados;
        setCasos(prev => {
          const idx = prev.findIndex(c => c.id === casoNovo.id);
          if (idx === -1) return [...prev, casoNovo];
          const copia = prev.slice();
          copia[idx] = casoNovo;
          return copia;
        });
      }).subscribe();
    return () => { cancelado = true; sb.removeChannel(canal); };
  }, [sessao]);

  function dispatch(action) {
    setCasos(prevCasos => {
      const novoArray = casosReducer(prevCasos, action);
      const criando = action.type === "ENVIAR_RELATO";
      const casoAlvo = criando
        ? novoArray[novoArray.length - 1]
        : novoArray.find(c => c.id === action.casoId);
      if (casoAlvo) {
        const linha = { id: casoAlvo.id, protocolo: casoAlvo.protocolo || null,
          enviado_em: casoAlvo.enviadoEm, arquivado_em: casoAlvo.arquivadoEm || null, dados: casoAlvo };
        // INSERT puro na criação (nunca upsert): "INSERT ... ON CONFLICT DO UPDATE" exige
        // privilégio de UPDATE na tabela mesmo quando nenhum conflito realmente acontece — é
        // por isso que o canal anônimo (que só tem policy de INSERT) sempre dava erro de RLS
        // aqui, mesmo com um id novo e único. Ações seguintes (só quem já está autenticado)
        // continuam sendo um UPDATE de verdade no caso existente.
        const query = criando
          ? sb.from("casos").insert(linha)
          : sb.from("casos").update(linha).eq("id", casoAlvo.id);
        query.then(({ error }) => {
          if (error) { showAviso("Erro ao salvar no banco: " + error.message); return; }
          setCasosVersao(v => v + 1);
        });
      }
      return novoArray;
    });
  }

  // Sem histórico separado: como os casos agora persistem de verdade (nada some ao recarregar),
  // "arquivados" é só um filtro sobre os próprios casos sincronizados, junto com os 4 seeds
  // estáticos de demonstração.
  const arquivados = [...SEED_ARQUIVADOS, ...casos.filter(c => c.arquivadoEm)];

  const [telaAdmin, setTelaAdmin] = useState(false);
  // Lista de todos os perfis (pra tela de Administração) — carrega quando o Admin abre a tela.
  const [usuariosAdmin, setUsuariosAdmin] = useState([]);
  useEffect(() => {
    if (!telaAdmin) return;
    sb.from("perfis").select("*").order("criado_em").then(({ data, error }) => {
      if (error) { showAviso("Erro ao carregar usuários: " + error.message); return; }
      setUsuariosAdmin(data.map(p => ({ id: p.id, nome: p.nome, cargo: p.cargo, perfisPermitidos: p.perfis_permitidos || [], admin: !!p.admin })));
    });
  }, [telaAdmin]);
  function onTogglePerfil(userId, perfilId) {
    const alvo = usuariosAdmin.find(u => u.id === userId);
    const novosPerfis = alvo.perfisPermitidos.includes(perfilId)
      ? alvo.perfisPermitidos.filter(p => p !== perfilId)
      : [...alvo.perfisPermitidos, perfilId];
    setUsuariosAdmin(us => us.map(u => u.id === userId ? { ...u, perfisPermitidos: novosPerfis } : u));
    sb.from("perfis").update({ perfis_permitidos: novosPerfis }).eq("id", userId)
      .then(({ error }) => { if (error) showAviso("Erro ao salvar permissão: " + error.message); });
  }
  // Usado só pra confirmar de uma vez um conjunto de perfis diferentes do padrão (Comunicante) —
  // ver o rascunho por linha em TelaAdministracao. Substitui o array inteiro em vez de alternar
  // um perfil por vez, pra não perder toggles feitos antes de clicar "Confirmar".
  function onSalvarPerfis(userId, perfisPermitidos) {
    setUsuariosAdmin(us => us.map(u => u.id === userId ? { ...u, perfisPermitidos } : u));
    sb.from("perfis").update({ perfis_permitidos: perfisPermitidos }).eq("id", userId)
      .then(({ error }) => { if (error) showAviso("Erro ao salvar permissão: " + error.message); });
  }
  function onToggleAdmin(userId) {
    const alvo = usuariosAdmin.find(u => u.id === userId);
    const novoAdmin = !alvo.admin;
    setUsuariosAdmin(us => us.map(u => u.id === userId ? { ...u, admin: novoAdmin } : u));
    sb.from("perfis").update({ admin: novoAdmin }).eq("id", userId)
      .then(({ error }) => { if (error) showAviso("Erro ao salvar: " + error.message); });
  }

  // Canal público sem login — mesma raia Demandante, sem exigir sessão (ver plano "Atualização
  // 5"). Não é um caminho de dados paralelo: usa o mesmo dispatch(ENVIAR_RELATO) do fluxo normal
  // (a política de RLS "casos: anonimos podem registrar um relato" cobre esse insert sem sessão).
  const [modoAnonimo, setModoAnonimo] = useState(false);
  const [enviandoAnonimo, setEnviandoAnonimo] = useState(false);
  const [anonimoEnviado, setAnonimoEnviado] = useState(false);
  function enviarRelatoAnonimo(dados) {
    setEnviandoAnonimo(true);
    setTimeout(() => {
      dispatch({ type: "ENVIAR_RELATO", ...dados });
      setEnviandoAnonimo(false);
      setAnonimoEnviado(true);
    }, 350);
  }
  function sairDoAnonimo() {
    setModoAnonimo(false);
    setAnonimoEnviado(false);
  }

  // Guarda de rota: se o hash apontar para um perfil fora da permissão do usuário logado (ex.:
  // editando a URL manualmente), redireciona para o primeiro perfil permitido a ele.
  useEffect(() => {
    if (usuarioLogado && usuarioLogado.perfisPermitidos.length && !usuarioLogado.perfisPermitidos.includes(profile)) {
      navigate(usuarioLogado.perfisPermitidos[0]);
    }
  }, [usuarioLogado, profile]);

  async function limparTudo(e) {
    e.preventDefault();
    if (!usuarioLogado || !usuarioLogado.admin) return;
    showConfirm({
      titulo: "Limpar todos os casos",
      mensagem: "Isso apaga PERMANENTEMENTE todos os casos do banco — de TODOS os dispositivos " +
        "conectados agora, não só o seu. Use isso só entre uma sessão de oficina e outra.",
      textoConfirmar: "Apagar tudo",
      onConfirmar: async () => {
        const { error } = await sb.from("casos").delete().not("id", "is", null);
        if (error) { showAviso("Erro ao limpar: " + error.message); return; }
        setCasos([]);
        navigate("comunicante");
        showAviso("Todos os casos foram apagados do banco.");
      }
    });
  }
  async function sair() {
    setTelaAdmin(false);
    await sb.auth.signOut();
  }
  function onColapsar() { setColapsada(v => !v); }

  if (modoAnonimo) {
    // O caso recém-criado é sempre o último do array (mesmo padrão já usado pro dispatch de
    // ENVIAR_RELATO) — dá pra mostrar o protocolo pro visitante sem precisar de sessão/RLS extra.
    const protocoloAnonimo = anonimoEnviado && casos.length ? casos[casos.length - 1].protocolo : null;
    return html`<div><${AvisoHost} /><${TelaRelatoAnonimo} enviado=${anonimoEnviado}
      enviando=${enviandoAnonimo} onEnviar=${enviarRelatoAnonimo} onVoltar=${sairDoAnonimo}
      protocolo=${protocoloAnonimo} /></div>`;
  }
  if (modoRecuperacao) {
    return html`<div><${AvisoHost} /><${TelaRedefinirSenha} onDefinida=${() => {
      setModoRecuperacao(false);
      history.replaceState(null, "", location.pathname + location.search);
    }} /></div>`;
  }
  if (sessao === undefined || (sessao && perfil === undefined)) {
    return html`<div class="login-shell"><p class="dica" style=${{ color: "#fff" }}>Carregando…</p></div>`;
  }
  if (!usuarioLogado) {
    return html`<div><${AvisoHost} />
      ${modoCadastro
        ? html`<${TelaCadastro} onVoltar=${() => setModoCadastro(false)}
            onCadastrado=${() => { setModoCadastro(false); showAviso("Conta criada! Peça ao Administrador do sistema para liberar seu acesso."); }} />`
        : html`<${TelaLogin} onEntrar=${() => {}} onRelatoAnonimo=${() => setModoAnonimo(true)}
            onIrParaCadastro=${() => setModoCadastro(true)} />`}
    </div>`;
  }

  // Conta existe mas ainda não tem nenhum perfil liberado — Admin entra direto na Administração
  // pra poder se autoconceder acesso; qualquer outra conta vê uma tela de espera.
  if (usuarioLogado.perfisPermitidos.length === 0 && !usuarioLogado.admin) {
    return html`<${SessaoContext.Provider} value=${{ usuarioLogado, onSair: sair, onAdministracao: () => {} }}>
      <div class="login-shell"><div class="login-card">
